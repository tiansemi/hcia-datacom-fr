<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Trois solutions de routage inter-VLAN par routes directes</title><desc id="desc">Comparaison d'interfaces physiques de routeur, de sous-interfaces dot1q et d'interfaces VLANIF sur un switch de couche 3.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#12324f" flood-opacity=".12"/></filter><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#12324f}.t{font-size:46px;font-weight:760}.st{font-size:22px;fill:#526e87}.h{font-size:25px;font-weight:750}.b{font-size:18px}.w{fill:#fff}.line{stroke:#58768f;stroke-width:8;fill:none}</style></defs>
  <rect width="1600" height="900" rx="38" fill="#f7fafc"/><text x="800" y="75" text-anchor="middle" class="t">Inter-VLAN : trois façons de créer des routes directes</text><text x="800" y="115" text-anchor="middle" class="st">Le choix porte sur l'emplacement et la forme des passerelles</text>
  <g filter="url(#s)"><rect x="70" y="200" width="450" height="520" rx="30" fill="#fff" stroke="#d4e4ef" stroke-width="2"/><rect x="575" y="200" width="450" height="520" rx="30" fill="#fff" stroke="#d4e4ef" stroke-width="2"/><rect x="1080" y="200" width="450" height="520" rx="30" fill="#fff" stroke="#d4e4ef" stroke-width="2"/></g>
  <g><text x="295" y="255" text-anchor="middle" class="h">Interfaces physiques</text><rect x="205" y="295" width="180" height="80" rx="18" fill="#1c70b0"/><text x="295" y="345" text-anchor="middle" class="h w">Routeur</text><path d="M245 375V465 M345 375V565" class="line"/><rect x="145" y="465" width="200" height="65" rx="16" fill="#e7f2fa"/><rect x="245" y="565" width="200" height="65" rx="16" fill="#e5f7f5"/><text x="245" y="505" text-anchor="middle" class="b">VLAN 10 · passerelle 1</text><text x="345" y="605" text-anchor="middle" class="b">VLAN 20 · passerelle 2</text><text x="295" y="680" text-anchor="middle" class="b">Simple, une interface par VLAN</text>
  <text x="800" y="255" text-anchor="middle" class="h">Sous-interfaces dot1q</text><rect x="710" y="295" width="180" height="80" rx="18" fill="#10a6a0"/><text x="800" y="345" text-anchor="middle" class="h w">Routeur</text><path d="M800 375V535" class="line"/><rect x="660" y="420" width="120" height="60" rx="15" fill="#e7f2fa"/><rect x="820" y="420" width="120" height="60" rx="15" fill="#e5f7f5"/><text x="720" y="457" text-anchor="middle" class="b">.10</text><text x="880" y="457" text-anchor="middle" class="b">.20</text><rect x="670" y="535" width="260" height="70" rx="18" fill="#f4c85f"/><text x="800" y="578" text-anchor="middle" class="h">Trunk 10, 20</text><text x="800" y="680" text-anchor="middle" class="b">Une liaison, terminaison des tags</text>
  <text x="1305" y="255" text-anchor="middle" class="h">VLANIF</text><rect x="1180" y="300" width="250" height="150" rx="24" fill="#7d56b3"/><text x="1305" y="345" text-anchor="middle" class="h w">Switch couche 3</text><rect x="1205" y="375" width="90" height="48" rx="12" fill="#fff" opacity=".92"/><rect x="1315" y="375" width="90" height="48" rx="12" fill="#fff" opacity=".92"/><text x="1250" y="406" text-anchor="middle" class="b">VIF 10</text><text x="1360" y="406" text-anchor="middle" class="b">VIF 20</text><path d="M1250 450V535 M1360 450V620" class="line"/><rect x="1150" y="535" width="200" height="65" rx="16" fill="#e7f2fa"/><rect x="1260" y="620" width="200" height="65" rx="16" fill="#e5f7f5"/><text x="1250" y="575" text-anchor="middle" class="b">VLAN 10</text><text x="1360" y="660" text-anchor="middle" class="b">VLAN 20</text></g>
  <rect x="330" y="770" width="940" height="70" rx="35" fill="#e8f1f7"/><text x="800" y="813" text-anchor="middle" class="h">Dans les trois cas, chaque passerelle crée une route directe vers son VLAN</text>
