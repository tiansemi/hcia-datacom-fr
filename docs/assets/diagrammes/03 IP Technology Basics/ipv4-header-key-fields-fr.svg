<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Principaux champs de l'en-tête IPv4</title><desc id="desc">Vue simplifiée des champs version, longueur, identification, fragmentation, TTL, protocole, checksum et adresses.</desc><defs><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#12324f" flood-opacity=".12"/></filter><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#12324f}.t{font-size:46px;font-weight:760}.st{font-size:22px;fill:#526e87}.h{font-size:24px;font-weight:740}.b{font-size:18px}.w{fill:#fff}.c{fill:#fff;stroke:#d4e4ef;stroke-width:2}</style></defs><rect width="1600" height="900" rx="38" fill="#f7fafc"/><text x="800" y="75" text-anchor="middle" class="t">En-tête IPv4 : transférer, limiter et remettre les données</text><text x="800" y="115" text-anchor="middle" class="st">20 octets fixes, jusqu'à 40 octets d'options</text><g transform="translate(90 190)" filter="url(#s)"><rect width="1420" height="470" rx="30" class="c"/><g transform="translate(45 55)"><rect width="220" height="90" rx="15" fill="#1769aa"/><text x="110" y="38" text-anchor="middle" class="h w">Version · IHL</text><text x="110" y="68" text-anchor="middle" class="b w">IPv4 · longueur</text><rect x="230" width="420" height="90" rx="15" fill="#2388bd"/><text x="440" y="38" text-anchor="middle" class="h w">Service · Total Length</text><text x="440" y="68" text-anchor="middle" class="b w">traitement et taille du paquet</text><rect x="660" width="670" height="90" rx="15" fill="#10a6a0"/><text x="995" y="38" text-anchor="middle" class="h w">Identification · Flags · Fragment Offset</text><text x="995" y="68" text-anchor="middle" class="b w">fragmenter et réassembler</text><rect y="105" width="300" height="90" rx="15" fill="#f6c85f"/><text x="150" y="143" text-anchor="middle" class="h">TTL</text><text x="150" y="173" text-anchor="middle" class="b">limite de sauts</text><rect x="310" y="105" width="300" height="90" rx="15" fill="#e8def7"/><text x="460" y="143" text-anchor="middle" class="h">Protocol</text><text x="460" y="173" text-anchor="middle" class="b">ICMP · TCP · UDP</text><rect x="620" y="105" width="710" height="90" rx="15" fill="#e8f1f7"/><text x="975" y="143" text-anchor="middle" class="h">Header Checksum</text><text x="975" y="173" text-anchor="middle" class="b">intégrité de l'en-tête</text><rect y="210" width="665" height="90" rx="15" fill="#e8f3fb"/><text x="332" y="265" text-anchor="middle" class="h">Adresse IPv4 source · 32 bits</text><rect x="675" y="210" width="655" height="90" rx="15" fill="#e5f7f5"/><text x="1002" y="265" text-anchor="middle" class="h">Adresse IPv4 destination · 32 bits</text><rect y="315" width="1330" height="70" rx="15" fill="#fff0e6"/><text x="665" y="359" text-anchor="middle" class="h">Options + Padding · 0 à 40 octets</text></g></g><rect x="345" y="740" width="910" height="70" rx="35" fill="#e8f1f7"/><text x="800" y="783" text-anchor="middle" class="h">Protocol 1 = ICMP · 6 = TCP · 17 = UDP</text></svg>
