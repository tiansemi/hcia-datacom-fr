<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Découpage d'un réseau /24 en deux /25</title><desc id="desc">192.168.10.0/24 est divisé en 192.168.10.0/25 et 192.168.10.128/25.</desc><defs><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#12324f" flood-opacity=".12"/></filter><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#12324f}.t{font-size:46px;font-weight:760}.st{font-size:22px;fill:#526e87}.h{font-size:28px;font-weight:750}.b{font-size:20px}.w{fill:#fff}</style></defs><rect width="1600" height="900" rx="38" fill="#f7fafc"/><text x="800" y="75" text-anchor="middle" class="t">Emprunter un bit : /24 devient deux /25</text><text x="800" y="115" text-anchor="middle" class="st">La taille de bloc passe de 256 à 128 adresses</text><rect x="390" y="165" width="820" height="105" rx="28" fill="#1769aa" filter="url(#s)"/><text x="800" y="208" text-anchor="middle" class="h w">192.168.10.0/24</text><text x="800" y="242" text-anchor="middle" class="b w">.0 à .255 · 254 hôtes utilisables</text><path d="M800 270 L800 340 M800 340 L430 405 M800 340 L1170 405" stroke="#55748d" stroke-width="7" fill="none"/><g transform="translate(100 405)" filter="url(#s)"><rect width="660" height="320" rx="30" fill="#e8f3fb" stroke="#1769aa" stroke-width="3"/><text x="330" y="60" text-anchor="middle" class="h">Sous-réseau 1</text><text x="330" y="110" text-anchor="middle" class="h">192.168.10.0/25</text><text x="330" y="175" text-anchor="middle" class="b">Réseau : .0</text><text x="330" y="215" text-anchor="middle" class="b">Hôtes : .1 à .126</text><text x="330" y="255" text-anchor="middle" class="b">Broadcast : .127</text></g><g transform="translate(840 405)" filter="url(#s)"><rect width="660" height="320" rx="30" fill="#e5f7f5" stroke="#10a6a0" stroke-width="3"/><text x="330" y="60" text-anchor="middle" class="h">Sous-réseau 2</text><text x="330" y="110" text-anchor="middle" class="h">192.168.10.128/25</text><text x="330" y="175" text-anchor="middle" class="b">Réseau : .128</text><text x="330" y="215" text-anchor="middle" class="b">Hôtes : .129 à .254</text><text x="330" y="255" text-anchor="middle" class="b">Broadcast : .255</text></g><rect x="455" y="790" width="690" height="58" rx="29" fill="#e8f1f7"/><text x="800" y="827" text-anchor="middle" class="b">Chaque /25 : 128 adresses, 126 hôtes utilisables.</text></svg>
