<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Types d'adresses IPv6</title><desc id="desc">Les adresses IPv6 sont organisées en unicast, multicast et anycast, sans broadcast.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#12324f" flood-opacity=".12"/></filter><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#12324f}.t{font-size:46px;font-weight:760}.st{font-size:22px;fill:#526e87}.h{font-size:25px;font-weight:750}.b{font-size:18px}.w{fill:#fff}</style></defs><rect width="1600" height="900" rx="38" fill="#f7fafc"/><text x="800" y="75" text-anchor="middle" class="t">IPv6 cible une interface, un groupe ou le plus proche</text><text x="800" y="115" text-anchor="middle" class="st">IPv6 ne définit aucune adresse de broadcast</text>
  <g filter="url(#s)"><rect x="60" y="200" width="800" height="530" rx="32" fill="#fff" stroke="#d4e4ef" stroke-width="2"/><rect x="900" y="200" width="300" height="530" rx="32" fill="#10a6a0"/><rect x="1240" y="200" width="300" height="530" rx="32" fill="#7d56b3"/></g><text x="460" y="255" text-anchor="middle" class="h">Unicast · une interface</text><g><rect x="110" y="310" width="330" height="95" rx="20" fill="#e7f2fa"/><text x="275" y="348" text-anchor="middle" class="h">Global unicast</text><text x="275" y="380" text-anchor="middle" class="b">2000::/3 · routable</text><rect x="480" y="310" width="330" height="95" rx="20" fill="#e5f7f5"/><text x="645" y="348" text-anchor="middle" class="h">Link-local</text><text x="645" y="380" text-anchor="middle" class="b">FE80::/10 · lien local</text><rect x="110" y="445" width="330" height="95" rx="20" fill="#fff1d5"/><text x="275" y="483" text-anchor="middle" class="h">Unique local</text><text x="275" y="515" text-anchor="middle" class="b">FD00::/8 · intranet</text><rect x="480" y="445" width="155" height="95" rx="20" fill="#e8f1f7"/><text x="557" y="483" text-anchor="middle" class="h">::</text><text x="557" y="515" text-anchor="middle" class="b">non spécifiée</text><rect x="655" y="445" width="155" height="95" rx="20" fill="#e8f1f7"/><text x="732" y="483" text-anchor="middle" class="h">::1</text><text x="732" y="515" text-anchor="middle" class="b">loopback</text></g><text x="1050" y="275" text-anchor="middle" class="h w">Multicast</text><text x="1050" y="335" text-anchor="middle" class="h w">FF00::/8</text><circle cx="1050" cy="470" r="55" fill="#fff" opacity=".25"/><circle cx="985" cy="570" r="38" fill="#fff" opacity=".88"/><circle cx="1050" cy="600" r="38" fill="#fff" opacity=".88"/><circle cx="1115" cy="570" r="38" fill="#fff" opacity=".88"/><text x="1050" y="675" text-anchor="middle" class="b w">tous les membres du groupe</text><text x="1390" y="275" text-anchor="middle" class="h w">Anycast</text><text x="1390" y="335" text-anchor="middle" class="b w">format unicast</text><circle cx="1390" cy="445" r="52" fill="#fff" opacity=".92"/><circle cx="1330" cy="585" r="38" fill="#fff" opacity=".55"/><circle cx="1450" cy="585" r="38" fill="#fff" opacity=".92"/><path d="M1390 500L1450 547" stroke="#fff" stroke-width="9"/><text x="1390" y="675" text-anchor="middle" class="b w">interface la plus proche</text><rect x="330" y="790" width="940" height="62" rx="31" fill="#e8f1f7"/><text x="800" y="829" text-anchor="middle" class="h">Une interface IPv6 possède généralement plusieurs adresses</text>
</svg>
