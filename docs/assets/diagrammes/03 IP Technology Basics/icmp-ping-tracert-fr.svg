<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Ping et tracert avec ICMP</title><desc id="desc">Ping échange Echo Request et Reply, tracert augmente le TTL pour révéler chaque routeur.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#55748d"/></marker><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#12324f" flood-opacity=".12"/></filter><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#12324f}.t{font-size:46px;font-weight:760}.st{font-size:22px;fill:#526e87}.h{font-size:28px;font-weight:750}.b{font-size:19px}.w{fill:#fff}.arr{stroke:#55748d;stroke-width:6;marker-end:url(#a)}</style></defs><rect width="1600" height="900" rx="38" fill="#f7fafc"/><text x="800" y="75" text-anchor="middle" class="t">ICMP : vérifier la destination et révéler le chemin</text><text x="800" y="115" text-anchor="middle" class="st">Deux outils, deux lectures complémentaires</text><g transform="translate(90 185)" filter="url(#s)"><rect width="670" height="565" rx="32" fill="#fff" stroke="#d4e4ef" stroke-width="2"/><text x="335" y="62" text-anchor="middle" class="h">PING</text><rect x="90" y="120" width="200" height="85" rx="22" fill="#1769aa"/><text x="190" y="173" text-anchor="middle" class="h w">Source</text><rect x="380" y="120" width="200" height="85" rx="22" fill="#10a6a0"/><text x="480" y="173" text-anchor="middle" class="h w">Destination</text><line x1="290" y1="145" x2="370" y2="145" class="arr"/><line x1="380" y1="185" x2="300" y2="185" class="arr"/><text x="335" y="265" text-anchor="middle" class="b">Echo Request → Echo Reply</text><text x="335" y="330" text-anchor="middle" class="h">Résultat</text><text x="335" y="375" text-anchor="middle" class="b">joignabilité et temps aller-retour</text><text x="335" y="455" text-anchor="middle" class="b">ne valide pas un service applicatif précis</text></g><g transform="translate(840 185)" filter="url(#s)"><rect width="670" height="565" rx="32" fill="#fff" stroke="#d4e4ef" stroke-width="2"/><text x="335" y="62" text-anchor="middle" class="h">TRACERT</text><g transform="translate(45 125)"><circle cx="65" cy="65" r="55" fill="#1769aa"/><circle cx="245" cy="65" r="55" fill="#2388bd"/><circle cx="425" cy="65" r="55" fill="#10a6a0"/><circle cx="565" cy="65" r="55" fill="#7c55b5"/><text x="65" y="72" text-anchor="middle" class="b w">TTL 1</text><text x="245" y="72" text-anchor="middle" class="b w">TTL 2</text><text x="425" y="72" text-anchor="middle" class="b w">TTL 3</text><text x="565" y="72" text-anchor="middle" class="b w">Cible</text></g><text x="335" y="290" text-anchor="middle" class="b">Chaque expiration révèle un saut</text><text x="335" y="355" text-anchor="middle" class="h">Résultat</text><text x="335" y="400" text-anchor="middle" class="b">chemin, délai et point d'arrêt</text><text x="335" y="480" text-anchor="middle" class="b">utile pour repérer un détour ou une boucle</text></g><text x="800" y="835" text-anchor="middle" class="b">Un filtrage ICMP peut masquer des réponses sans couper le trafic utile.</text></svg>
