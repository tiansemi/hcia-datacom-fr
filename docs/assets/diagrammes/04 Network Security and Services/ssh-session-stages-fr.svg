<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Étapes d'une session SSH</title><desc id="desc">La session SSH passe par TCP, les négociations, l'échange de clés, l'authentification et le service chiffré.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fcff"/><stop offset="1" stop-color="#eef8f7"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#658096"/></marker></defs><rect width="1200" height="620" rx="28" fill="url(#bg)"/><text x="600" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#102a43">Établissement d'une session SSH</text><g font-family="Arial,sans-serif"><g transform="translate(55 125)"><rect width="240" height="125" rx="22" fill="#fff" stroke="#23a6a8" stroke-width="3"/><circle cx="42" cy="42" r="24" fill="#dff7f5"/><text x="42" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#128f91">1</text><text x="120" y="65" text-anchor="middle" font-size="22" font-weight="700" fill="#102a43">TCP</text><text x="120" y="96" text-anchor="middle" font-size="17" fill="#486581">connexion au serveur</text></g><path d="M305 187h70" stroke="#658096" stroke-width="5" marker-end="url(#a)"/><g transform="translate(390 125)"><rect width="240" height="125" rx="22" fill="#fff" stroke="#4f72c4" stroke-width="3"/><circle cx="42" cy="42" r="24" fill="#e8edff"/><text x="42" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#3d5da8">2</text><text x="120" y="62" text-anchor="middle" font-size="21" font-weight="700" fill="#102a43">Négociations</text><text x="120" y="94" text-anchor="middle" font-size="17" fill="#486581">version · algorithmes</text></g><path d="M640 187h70" stroke="#658096" stroke-width="5" marker-end="url(#a)"/><g transform="translate(725 125)"><rect width="420" height="125" rx="22" fill="#153f59"/><circle cx="45" cy="42" r="24" fill="#2a6079"/><text x="45" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#70e0d8">3</text><text x="220" y="62" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Échange de clés</text><text x="220" y="94" text-anchor="middle" font-size="17" fill="#d9f1f2">clé de session + authentification serveur</text></g><path d="M935 260v70" stroke="#658096" stroke-width="5" marker-end="url(#a)"/><g transform="translate(725 345)"><rect width="420" height="125" rx="22" fill="#fff" stroke="#f2994a" stroke-width="3"/><circle cx="45" cy="42" r="24" fill="#fff1df"/><text x="45" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#e47a1f">4</text><text x="220" y="62" text-anchor="middle" font-size="21" font-weight="700" fill="#102a43">Utilisateur authentifié</text><text x="220" y="94" text-anchor="middle" font-size="17" fill="#486581">mot de passe ou clé publique</text></g><path d="M715 407h-70" stroke="#658096" stroke-width="5" marker-end="url(#a)"/><g transform="translate(390 345)"><rect width="240" height="125" rx="22" fill="#fff" stroke="#4f72c4" stroke-width="3"/><circle cx="42" cy="42" r="24" fill="#e8edff"/><text x="42" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#3d5da8">5</text><text x="120" y="62" text-anchor="middle" font-size="21" font-weight="700" fill="#102a43">Service</text><text x="120" y="94" text-anchor="middle" font-size="17" fill="#486581">STelnet ou SFTP</text></g><path d="M380 407h-70" stroke="#658096" stroke-width="5" marker-end="url(#a)"/><g transform="translate(55 345)"><rect width="240" height="125" rx="22" fill="#fff" stroke="#23a6a8" stroke-width="3"/><circle cx="42" cy="42" r="24" fill="#dff7f5"/><text x="42" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#128f91">6</text><text x="120" y="62" text-anchor="middle" font-size="21" font-weight="700" fill="#102a43">Canal chiffré</text><text x="120" y="94" text-anchor="middle" font-size="17" fill="#486581">interaction sécurisée</text></g><rect x="300" y="525" width="600" height="54" rx="27" fill="#e6f5f3"/><text x="600" y="559" text-anchor="middle" font-size="19" font-weight="700" fill="#176b6d">Confidentialité · intégrité · authentification</text></g></svg>
