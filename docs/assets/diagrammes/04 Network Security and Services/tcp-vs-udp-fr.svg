<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc"><title id="title">Comparaison TCP et UDP</title><desc id="desc">TCP établit une connexion fiable tandis qu'UDP transmet directement avec peu de surcharge.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fcff"/><stop offset="1" stop-color="#eef8f7"/></linearGradient></defs><rect width="1200" height="580" rx="28" fill="url(#bg)"/><text x="600" y="60" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#102a43">TCP ou UDP : deux compromis de transport</text><g font-family="Arial,sans-serif"><rect x="65" y="115" width="500" height="380" rx="28" fill="#fff" stroke="#23a6a8" stroke-width="3"/><text x="315" y="175" text-anchor="middle" font-size="31" font-weight="700" fill="#128f91">TCP</text><text x="315" y="215" text-anchor="middle" font-size="20" fill="#334e68">Orienté connexion · fiable · ordonné</text><path d="M170 282h290M170 337h290M170 392h290" stroke="#8aa5b5" stroke-width="5" stroke-linecap="round"/><circle cx="185" cy="282" r="11" fill="#23a6a8"/><circle cx="445" cy="282" r="11" fill="#23a6a8"/><circle cx="185" cy="337" r="11" fill="#23a6a8"/><circle cx="445" cy="337" r="11" fill="#23a6a8"/><circle cx="185" cy="392" r="11" fill="#23a6a8"/><circle cx="445" cy="392" r="11" fill="#23a6a8"/><text x="315" y="458" text-anchor="middle" font-size="19" fill="#486581">Handshake · séquences · ACK · retransmission</text><rect x="635" y="115" width="500" height="380" rx="28" fill="#fff" stroke="#f2994a" stroke-width="3"/><text x="885" y="175" text-anchor="middle" font-size="31" font-weight="700" fill="#e47a1f">UDP</text><text x="885" y="215" text-anchor="middle" font-size="20" fill="#334e68">Sans connexion · best effort · faible latence</text><g fill="#f2994a"><path d="M755 274l55 18-55 18z"/><path d="M840 329l55 18-55 18z"/><path d="M925 384l55 18-55 18z"/></g><path d="M810 292h150M895 347h100M980 402h80" stroke="#9aaeb9" stroke-width="5" stroke-linecap="round"/><text x="885" y="458" text-anchor="middle" font-size="19" fill="#486581">Pas de handshake ni d'état de connexion</text></g></svg>
