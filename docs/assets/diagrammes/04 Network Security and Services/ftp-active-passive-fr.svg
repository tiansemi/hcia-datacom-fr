<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">FTP actif et FTP passif</title><desc id="desc">La connexion de contrôle va vers TCP 21. En actif le serveur ouvre la connexion de données, en passif le client l'ouvre.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fafcff"/><stop offset="1" stop-color="#eef8f7"/></linearGradient><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#4267b2"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#e47a1f"/></marker></defs><rect width="1200" height="620" rx="28" fill="url(#bg)"/><text x="600" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#102a43">FTP sépare contrôle et données</text><g font-family="Arial,sans-serif"><text x="300" y="112" text-anchor="middle" font-size="26" font-weight="700" fill="#102a43">Mode actif</text><rect x="60" y="150" width="180" height="130" rx="20" fill="#fff" stroke="#23a6a8" stroke-width="3"/><text x="150" y="206" text-anchor="middle" font-size="23" font-weight="700" fill="#102a43">Client</text><text x="150" y="239" text-anchor="middle" font-size="17" fill="#486581">ports dynamiques</text><rect x="360" y="150" width="180" height="130" rx="20" fill="#fff" stroke="#4f72c4" stroke-width="3"/><text x="450" y="206" text-anchor="middle" font-size="23" font-weight="700" fill="#102a43">Serveur</text><text x="450" y="239" text-anchor="middle" font-size="17" fill="#486581">TCP 21 / TCP 20</text><path d="M245 183h105" stroke="#4267b2" stroke-width="5" marker-end="url(#blue)"/><text x="298" y="169" text-anchor="middle" font-size="15" fill="#4267b2">contrôle → 21</text><path d="M350 249H245" stroke="#e47a1f" stroke-width="5" marker-end="url(#orange)"/><text x="300" y="317" text-anchor="middle" font-size="15" font-weight="700" fill="#e47a1f">données : serveur → client</text><text x="900" y="112" text-anchor="middle" font-size="26" font-weight="700" fill="#102a43">Mode passif</text><rect x="660" y="150" width="180" height="130" rx="20" fill="#fff" stroke="#23a6a8" stroke-width="3"/><text x="750" y="206" text-anchor="middle" font-size="23" font-weight="700" fill="#102a43">Client</text><text x="750" y="239" text-anchor="middle" font-size="17" fill="#486581">ports dynamiques</text><rect x="960" y="150" width="180" height="130" rx="20" fill="#fff" stroke="#4f72c4" stroke-width="3"/><text x="1050" y="206" text-anchor="middle" font-size="23" font-weight="700" fill="#102a43">Serveur</text><text x="1050" y="239" text-anchor="middle" font-size="17" fill="#486581">TCP 21 + port annoncé</text><path d="M845 183h105" stroke="#4267b2" stroke-width="5" marker-end="url(#blue)"/><text x="898" y="169" text-anchor="middle" font-size="15" fill="#4267b2">contrôle → 21</text><path d="M845 249h105" stroke="#e47a1f" stroke-width="5" marker-end="url(#orange)"/><text x="900" y="317" text-anchor="middle" font-size="15" font-weight="700" fill="#e47a1f">données : client → serveur</text><rect x="145" y="355" width="910" height="190" rx="25" fill="#fff" stroke="#c7d7e2" stroke-width="2"/><text x="600" y="408" text-anchor="middle" font-size="23" font-weight="700" fill="#102a43">Connexion de contrôle persistante, connexion de données séparée</text><text x="600" y="456" text-anchor="middle" font-size="19" fill="#486581">Actif : le serveur doit atteindre un port annoncé par le client.</text><text x="600" y="494" text-anchor="middle" font-size="19" fill="#486581">Passif : le client initie les deux connexions, souvent plus simple à filtrer.</text></g></svg>
