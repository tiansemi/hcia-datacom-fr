<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc"><title id="title">Types de source NAT</title><desc id="desc">No-PAT traduit seulement l'adresse, NAPT traduit adresse et port avec un pool, Easy IP utilise l'adresse de l'interface.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fafcff"/><stop offset="1" stop-color="#eef8f7"/></linearGradient></defs><rect width="1200" height="590" rx="28" fill="url(#bg)"/><text x="600" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#102a43">Trois façons de traduire la source</text><g font-family="Arial,sans-serif"><rect x="50" y="120" width="340" height="385" rx="25" fill="#fff" stroke="#23a6a8" stroke-width="3"/><text x="220" y="179" text-anchor="middle" font-size="28" font-weight="700" fill="#128f91">No-PAT</text><text x="220" y="225" text-anchor="middle" font-size="19" fill="#334e68">192.168.1.10:5000</text><text x="220" y="262" text-anchor="middle" font-size="28" fill="#829ab1">↓</text><text x="220" y="304" text-anchor="middle" font-size="19" font-weight="700" fill="#102a43">122.1.2.10:5000</text><text x="220" y="365" text-anchor="middle" font-size="18" fill="#486581">Adresse seule</text><text x="220" y="403" text-anchor="middle" font-size="18" fill="#486581">1 publique / hôte actif</text><rect x="430" y="120" width="340" height="385" rx="25" fill="#fff" stroke="#4f72c4" stroke-width="3"/><text x="600" y="179" text-anchor="middle" font-size="28" font-weight="700" fill="#3d5da8">NAPT</text><text x="600" y="225" text-anchor="middle" font-size="19" fill="#334e68">192.168.1.10:5000</text><text x="600" y="262" text-anchor="middle" font-size="28" fill="#829ab1">↓</text><text x="600" y="304" text-anchor="middle" font-size="19" font-weight="700" fill="#102a43">122.1.2.10:2048</text><text x="600" y="365" text-anchor="middle" font-size="18" fill="#486581">Adresse + port</text><text x="600" y="403" text-anchor="middle" font-size="18" fill="#486581">Adresse issue d'un pool</text><rect x="810" y="120" width="340" height="385" rx="25" fill="#fff" stroke="#f2994a" stroke-width="3"/><text x="980" y="179" text-anchor="middle" font-size="28" font-weight="700" fill="#e47a1f">Easy IP</text><text x="980" y="225" text-anchor="middle" font-size="19" fill="#334e68">192.168.1.10:5000</text><text x="980" y="262" text-anchor="middle" font-size="28" fill="#829ab1">↓</text><text x="980" y="304" text-anchor="middle" font-size="19" font-weight="700" fill="#102a43">WAN:2048</text><text x="980" y="365" text-anchor="middle" font-size="18" fill="#486581">Adresse + port</text><text x="980" y="403" text-anchor="middle" font-size="18" fill="#486581">Adresse de l'interface</text><text x="600" y="551" text-anchor="middle" font-size="20" font-weight="700" fill="#334e68">NAPT et Easy IP permettent à plusieurs hôtes de partager une adresse publique.</text></g></svg>
