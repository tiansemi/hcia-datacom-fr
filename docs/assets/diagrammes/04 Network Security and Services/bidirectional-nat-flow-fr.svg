<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Flux NAT bidirectionnel</title><desc id="desc">Le paquet reçu subit une traduction de destination par NAT Server et une traduction de source avant transmission au serveur privé.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fafcff"/><stop offset="1" stop-color="#eef8f7"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#637f94"/></marker></defs><rect width="1200" height="620" rx="28" fill="url(#bg)"/><text x="600" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#102a43">NAT bidirectionnelle = destination NAT + source NAT</text><g font-family="Arial,sans-serif"><rect x="50" y="145" width="300" height="145" rx="22" fill="#fff" stroke="#4f72c4" stroke-width="3"/><text x="200" y="191" text-anchor="middle" font-size="21" font-weight="700" fill="#102a43">Paquet reçu</text><text x="200" y="230" text-anchor="middle" font-size="17" fill="#3d5da8">S 200.1.2.3:2474</text><text x="200" y="260" text-anchor="middle" font-size="17" fill="#3d5da8">D 122.1.2.1:80</text><path d="M360 217h105" stroke="#637f94" stroke-width="5" marker-end="url(#a)"/><rect x="480" y="125" width="240" height="185" rx="24" fill="#fff" stroke="#f2994a" stroke-width="3"/><text x="600" y="177" text-anchor="middle" font-size="22" font-weight="700" fill="#102a43">1. NAT Server</text><text x="600" y="221" text-anchor="middle" font-size="17" fill="#486581">destination publique</text><text x="600" y="254" text-anchor="middle" font-size="20" font-weight="700" fill="#e47a1f">→ 192.168.1.1:80</text><path d="M730 217h105" stroke="#637f94" stroke-width="5" marker-end="url(#a)"/><rect x="850" y="125" width="300" height="185" rx="24" fill="#fff" stroke="#23a6a8" stroke-width="3"/><text x="1000" y="177" text-anchor="middle" font-size="22" font-weight="700" fill="#102a43">2. Source NAT</text><text x="1000" y="221" text-anchor="middle" font-size="17" fill="#486581">source externe</text><text x="1000" y="254" text-anchor="middle" font-size="20" font-weight="700" fill="#128f91">→ 192.168.1.10:2674</text><path d="M1000 325v70" stroke="#637f94" stroke-width="5" marker-end="url(#a)"/><rect x="700" y="410" width="450" height="125" rx="22" fill="#153f59"/><text x="925" y="455" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Paquet transmis</text><text x="925" y="493" text-anchor="middle" font-size="17" fill="#d9f1f2">S 192.168.1.10:2674 → D 192.168.1.1:80</text><path d="M690 472H365" stroke="#637f94" stroke-width="5" marker-end="url(#a)"/><rect x="50" y="395" width="300" height="155" rx="22" fill="#fff" stroke="#4f72c4" stroke-width="3"/><text x="200" y="442" text-anchor="middle" font-size="21" font-weight="700" fill="#102a43">3. Session</text><text x="200" y="481" text-anchor="middle" font-size="17" fill="#486581">mémorise les deux</text><text x="200" y="512" text-anchor="middle" font-size="17" fill="#486581">traductions pour le retour</text><text x="600" y="585" text-anchor="middle" font-size="19" font-weight="700" fill="#334e68">Le flux retour restaure simultanément source et destination.</text></g></svg>
