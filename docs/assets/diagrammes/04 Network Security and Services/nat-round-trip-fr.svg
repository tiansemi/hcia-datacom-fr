<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Aller-retour NAT</title><desc id="desc">Le routeur remplace la source privée par une adresse publique à l'aller et restaure la destination privée au retour.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fafcff"/><stop offset="1" stop-color="#eef8f7"/></linearGradient><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#e47a1f"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#4267b2"/></marker></defs><rect width="1200" height="560" rx="28" fill="url(#bg)"/><text x="600" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#102a43">NAT maintient une association aller-retour</text><g font-family="Arial,sans-serif"><rect x="55" y="170" width="245" height="185" rx="24" fill="#fff" stroke="#23a6a8" stroke-width="3"/><text x="178" y="225" text-anchor="middle" font-size="24" font-weight="700" fill="#102a43">Poste privé</text><text x="178" y="269" text-anchor="middle" font-size="21" fill="#128f91">192.168.1.10</text><text x="178" y="309" text-anchor="middle" font-size="17" fill="#486581">réseau interne</text><rect x="470" y="125" width="260" height="275" rx="30" fill="#153f59"/><text x="600" y="195" text-anchor="middle" font-size="29" font-weight="700" fill="#fff">Routeur NAT</text><text x="600" y="249" text-anchor="middle" font-size="18" fill="#d9f1f2">association dynamique</text><rect x="515" y="285" width="170" height="58" rx="14" fill="#2a6079"/><text x="600" y="321" text-anchor="middle" font-size="18" fill="#70e0d8">privé ⇄ public</text><rect x="900" y="170" width="245" height="185" rx="24" fill="#fff" stroke="#4f72c4" stroke-width="3"/><text x="1023" y="225" text-anchor="middle" font-size="24" font-weight="700" fill="#102a43">Internet</text><text x="1023" y="269" text-anchor="middle" font-size="21" fill="#3d5da8">200.1.2.3</text><text x="1023" y="309" text-anchor="middle" font-size="17" fill="#486581">serveur distant</text><path d="M305 205h150M745 205h140" stroke="#e47a1f" stroke-width="6" marker-end="url(#o)"/><text x="600" y="103" text-anchor="middle" font-size="19" fill="#b95c17">Aller : source 192.168.1.10 → 122.1.2.1</text><path d="M895 330H745M455 330H315" stroke="#4267b2" stroke-width="6" marker-end="url(#b)"/><text x="600" y="463" text-anchor="middle" font-size="19" fill="#345a9b">Retour : destination 122.1.2.1 → 192.168.1.10</text><text x="600" y="516" text-anchor="middle" font-size="19" font-weight="700" fill="#334e68">La table NAT permet de livrer la réponse au bon hôte.</text></g></svg>
