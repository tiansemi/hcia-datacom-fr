<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Les trois fonctions AAA</title><desc id="desc">Une session utilisateur passe par l'authentification, l'autorisation et l'accounting.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef7f7"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#123047" flood-opacity=".12"/></filter></defs><rect width="1200" height="520" rx="28" fill="url(#bg)"/><text x="600" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#102a43">AAA sécurise le cycle d'une session</text><g filter="url(#shadow)" font-family="Arial,sans-serif"><rect x="70" y="125" width="300" height="270" rx="24" fill="#fff" stroke="#23a6a8" stroke-width="3"/><circle cx="220" cy="194" r="42" fill="#dff7f5"/><path d="M220 164a23 23 0 1 0 0 46 23 23 0 0 0 0-46zm-42 99c8-30 76-30 84 0" fill="none" stroke="#138f91" stroke-width="10" stroke-linecap="round"/><text x="220" y="305" text-anchor="middle" font-size="25" font-weight="700" fill="#102a43">Authentification</text><text x="220" y="342" text-anchor="middle" font-size="20" fill="#486581">Qui êtes-vous ?</text><rect x="450" y="125" width="300" height="270" rx="24" fill="#fff" stroke="#f2994a" stroke-width="3"/><circle cx="600" cy="194" r="42" fill="#fff1df"/><path d="M575 194l18 18 35-41" fill="none" stroke="#e47a1f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="305" text-anchor="middle" font-size="25" font-weight="700" fill="#102a43">Autorisation</text><text x="600" y="342" text-anchor="middle" font-size="20" fill="#486581">Que pouvez-vous faire ?</text><rect x="830" y="125" width="300" height="270" rx="24" fill="#fff" stroke="#4f72c4" stroke-width="3"/><circle cx="980" cy="194" r="42" fill="#e8edff"/><path d="M958 169h44v52h-44zM968 183h24M968 195h24M968 207h16" fill="none" stroke="#3d5da8" stroke-width="6" stroke-linecap="round"/><text x="980" y="305" text-anchor="middle" font-size="25" font-weight="700" fill="#102a43">Accounting</text><text x="980" y="342" text-anchor="middle" font-size="20" fill="#486581">Qu'avez-vous utilisé ?</text></g><path d="M375 260h65M755 260h65" stroke="#829ab1" stroke-width="6" stroke-linecap="round"/><path d="M430 248l18 12-18 12M810 248l18 12-18 12" fill="none" stroke="#829ab1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="461" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#334e68">Identifier → attribuer les droits → conserver la trace d'usage</text></svg>
