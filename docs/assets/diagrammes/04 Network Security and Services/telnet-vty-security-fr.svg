<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc"><title id="title">Telnet, VTY et risque du trafic en clair</title><desc id="desc">Un client Telnet atteint le serveur et une interface VTY avec AAA, mais les identifiants et commandes restent lisibles sur le réseau.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fafcff"/><stop offset="1" stop-color="#fff5ef"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#d96b2b"/></marker></defs><rect width="1200" height="540" rx="28" fill="url(#bg)"/><text x="600" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#102a43">Telnet atteint une VTY, mais ne protège pas la session</text><g font-family="Arial,sans-serif"><rect x="70" y="155" width="235" height="210" rx="24" fill="#fff" stroke="#23a6a8" stroke-width="3"/><text x="188" y="216" text-anchor="middle" font-size="25" font-weight="700" fill="#102a43">Client Telnet</text><text x="188" y="258" text-anchor="middle" font-size="19" fill="#486581">connexion TCP 23</text><text x="188" y="302" text-anchor="middle" font-size="18" fill="#486581">administrateur</text><rect x="450" y="118" width="300" height="284" rx="26" fill="#fff" stroke="#e47a1f" stroke-width="3"/><text x="600" y="177" text-anchor="middle" font-size="24" font-weight="700" fill="#102a43">Réseau intermédiaire</text><path d="M498 241h204" stroke="#d96b2b" stroke-width="5" stroke-dasharray="12 10"/><text x="600" y="224" text-anchor="middle" font-size="18" fill="#b64e18">trafic en clair</text><text x="600" y="283" text-anchor="middle" font-size="20" fill="#8a3e17">nom · mot de passe · commandes</text><path d="M573 323h54v45h-54zM584 323v-16a16 16 0 0 1 32 0v16" fill="none" stroke="#d96b2b" stroke-width="6"/><path d="M310 260h125M765 260h125" stroke="#d96b2b" stroke-width="6" marker-end="url(#a)"/><rect x="905" y="130" width="235" height="260" rx="24" fill="#fff" stroke="#4f72c4" stroke-width="3"/><text x="1023" y="190" text-anchor="middle" font-size="25" font-weight="700" fill="#102a43">Serveur</text><rect x="950" y="222" width="145" height="60" rx="12" fill="#e8edff"/><text x="1023" y="260" text-anchor="middle" font-size="21" font-weight="700" fill="#3d5da8">VTY 0</text><rect x="950" y="304" width="145" height="50" rx="12" fill="#e7f6f3"/><text x="1023" y="336" text-anchor="middle" font-size="18" fill="#176b6d">AAA + privilège</text><text x="600" y="476" text-anchor="middle" font-size="21" font-weight="700" fill="#b64e18">Une ACL limite les sources ; seul SSH chiffre le contenu.</text></g></svg>
