<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Topologie du lab VLAN</title><desc id="desc">S1 et S2 sont reliés par un trunk. S3 et S4 appartiennent au VLAN 3, R1 au VLAN 10 via un port hybrid.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fcfd"/><stop offset="1" stop-color="#eaf6f8"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#102a43" flood-opacity=".13"/></filter></defs>
  <rect width="1200" height="650" rx="28" fill="url(#bg)"/><text x="55" y="58" font-family="Segoe UI,Arial" font-size="29" font-weight="700" fill="#102a43">Lab 02 — Segmentation VLAN</text><text x="55" y="90" font-family="Segoe UI,Arial" font-size="17" fill="#486581">Access, trunk, hybrid et affectation selon l’adresse MAC</text>
  <g stroke="#23a6a8" stroke-width="8"><path d="M310 210H855"/><path d="M310 250V450"/><path d="M855 250V450"/></g><path d="M855 250L1040 450" stroke="#f2994a" stroke-width="8"/>
  <g filter="url(#s)" font-family="Segoe UI,Arial"><g fill="#153f59"><rect x="225" y="150" width="170" height="100" rx="18"/><rect x="770" y="150" width="170" height="100" rx="18"/></g><g fill="#fff" font-size="24" font-weight="700" text-anchor="middle"><text x="310" y="205">S1</text><text x="855" y="205">S2</text></g>
  <g fill="#fff" stroke="#23a6a8" stroke-width="3"><rect x="205" y="450" width="210" height="125" rx="20"/><rect x="750" y="450" width="210" height="125" rx="20"/></g><rect x="975" y="450" width="190" height="125" rx="20" fill="#fff" stroke="#f2994a" stroke-width="3"/>
  <g text-anchor="middle" fill="#153f59"><text x="310" y="490" font-size="23" font-weight="700">S3</text><text x="310" y="521" font-size="17">192.168.1.3/24</text><text x="310" y="551" font-size="17" fill="#23a6a8">VLAN 3</text><text x="855" y="490" font-size="23" font-weight="700">S4 mobile</text><text x="855" y="521" font-size="17">192.168.1.4/24</text><text x="855" y="551" font-size="17" fill="#23a6a8">VLAN 3</text><text x="1070" y="490" font-size="23" font-weight="700">R1</text><text x="1070" y="521" font-size="17">192.168.1.251/24</text><text x="1070" y="551" font-size="17" fill="#f2994a">VLAN 10</text></g></g>
  <g font-family="Segoe UI,Arial" font-size="15" fill="#486581"><text x="535" y="190">GE1/0/10 — trunk VLAN 3, 10</text><text x="320" y="335">GE1/0/13</text><text x="865" y="335">GE1/0/14</text><text x="965" y="336">GE1/0/1 hybrid</text></g>
  <rect x="55" y="590" width="760" height="40" rx="14" fill="#fff"/><text x="75" y="616" font-family="Segoe UI,Arial" font-size="16" fill="#486581">Même préfixe IPv4, mais domaines de broadcast séparés : la segmentation vient des VLAN.</text>
</svg>
