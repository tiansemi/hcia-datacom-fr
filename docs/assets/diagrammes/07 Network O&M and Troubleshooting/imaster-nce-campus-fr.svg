<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Architecture et bénéfices iMaster NCE-Campus</title><desc id="desc">Trois couches montrent applications, gestion contrôle analyse et infrastructure. Des protocoles southbound relient le contrôleur aux équipements, tandis que des API northbound l’ouvrent aux applications.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fcfd"/><stop offset="1" stop-color="#edf7fa"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#102a43" flood-opacity=".14"/></filter><style>.title{font:700 30px Arial,sans-serif;fill:#102a43}.sub{font:400 16px Arial,sans-serif;fill:#486581}.h{font:700 18px Arial,sans-serif;fill:#102a43}.body{font:400 13px Arial,sans-serif;fill:#334e68}.white{font:700 17px Arial,sans-serif;fill:#fff}.pill{font:700 13px Arial,sans-serif;fill:#fff}</style></defs>
  <rect width="1200" height="650" rx="26" fill="url(#bg)"/><text x="60" y="62" class="title">iMaster NCE-Campus : gestion + contrôle + analyse</text><text x="60" y="92" class="sub">Une plateforme orchestre les protocoles, automatise le cycle de vie et ouvre les données aux applications.</text>
  <g transform="translate(70 130)" filter="url(#s)"><rect width="760" height="395" rx="22" fill="#fff"/><rect x="25" y="25" width="710" height="82" rx="16" fill="#eef2ff" stroke="#4f72c4"/><text x="48" y="55" class="h">Couche applications et services</text><text x="48" y="84" class="body">Santé réseau · actifs · O&amp;M intelligent · applications métier</text><rect x="535" y="45" width="170" height="38" rx="19" fill="#4f72c4"/><text x="620" y="70" text-anchor="middle" class="pill">API northbound</text><rect x="25" y="132" width="710" height="128" rx="16" fill="#e7f9f7" stroke="#23a6a8" stroke-width="2"/><text x="48" y="165" class="h">iMaster NCE-Campus</text><text x="48" y="195" class="body">Planification · déploiement · provisionnement · exploitation</text><g transform="translate(48 215)"><rect width="150" height="29" rx="14" fill="#23a6a8"/><text x="75" y="20" text-anchor="middle" class="pill">Gestion</text><rect x="165" width="150" height="29" rx="14" fill="#23a6a8"/><text x="240" y="20" text-anchor="middle" class="pill">Contrôle</text><rect x="330" width="150" height="29" rx="14" fill="#23a6a8"/><text x="405" y="20" text-anchor="middle" class="pill">Analyse</text></g><text x="620" y="225" text-anchor="middle" class="body">SNMP · NETCONF</text><text x="620" y="245" text-anchor="middle" class="body">HTTP · SSH</text><rect x="25" y="285" width="710" height="82" rx="16" fill="#fff7ed" stroke="#f2994a"/><text x="48" y="316" class="h">Infrastructure du campus</text><text x="48" y="345" class="body">Routeurs · switches · WAC · AP · sites distribués</text><text x="620" y="333" text-anchor="middle" class="body">protocoles southbound</text></g>
  <g transform="translate(870 130)" filter="url(#s)"><rect width="260" height="395" rx="22" fill="#fff"/><text x="130" y="38" text-anchor="middle" class="h">Bénéfices</text><rect x="25" y="65" width="210" height="82" rx="15" fill="#4f72c4"/><text x="130" y="94" text-anchor="middle" class="white">Simplifié</text><text x="130" y="120" text-anchor="middle" style="font:400 12px Arial,sans-serif;fill:#fff">planning · ZTP · O&amp;M</text><rect x="25" y="165" width="210" height="82" rx="15" fill="#23a6a8"/><text x="130" y="194" text-anchor="middle" class="white">Élastique</text><text x="130" y="220" text-anchor="middle" style="font:400 12px Arial,sans-serif;fill:#fff">sites · tenants · services</text><rect x="25" y="265" width="210" height="82" rx="15" fill="#f2994a"/><text x="130" y="294" text-anchor="middle" class="white">Ouvert</text><text x="130" y="320" text-anchor="middle" style="font:400 12px Arial,sans-serif;fill:#fff">données · API · partenaires</text></g>
  <rect x="70" y="570" width="1060" height="42" rx="15" fill="#153f59"/><text x="600" y="597" text-anchor="middle" style="font:700 15px Arial,sans-serif;fill:#fff">Automatiser à l’échelle exige des modèles validés, des droits limités et une plateforme hautement disponible</text>
</svg>
