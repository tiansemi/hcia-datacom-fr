<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Couches, session et datastores NETCONF</title><desc id="desc">À gauche, les quatre couches NETCONF. Au centre, le cycle SSH, hello, RPC et fermeture. À droite, candidate est commité vers running et startup est chargé au démarrage.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fcfd"/><stop offset="1" stop-color="#edf7fa"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#102a43" flood-opacity=".14"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#567687"/></marker><style>.title{font:700 30px Arial,sans-serif;fill:#102a43}.sub{font:400 16px Arial,sans-serif;fill:#486581}.h{font:700 18px Arial,sans-serif;fill:#102a43}.body{font:400 13px Arial,sans-serif;fill:#334e68}.small{font:400 12px Arial,sans-serif;fill:#486581}.white{font:700 16px Arial,sans-serif;fill:#fff}.mono{font:600 13px Consolas,monospace;fill:#334e68}</style></defs>
  <rect width="1200" height="650" rx="26" fill="url(#bg)"/><text x="60" y="62" class="title">NETCONF sépare transport, opérations et données</text><text x="60" y="92" class="sub">La session annonce ses capacités ; les datastores permettent de préparer et maîtriser les changements.</text>
  <g transform="translate(55 132)" filter="url(#s)"><rect width="300" height="385" rx="20" fill="#fff"/><text x="150" y="36" text-anchor="middle" class="h">4 couches conceptuelles</text><rect x="28" y="62" width="244" height="60" rx="12" fill="#4f72c4"/><text x="150" y="88" text-anchor="middle" class="white">Content</text><text x="150" y="109" text-anchor="middle" style="font:400 12px Arial,sans-serif;fill:#fff">XML · YANG · état/configuration</text><rect x="28" y="137" width="244" height="60" rx="12" fill="#5f83d4"/><text x="150" y="163" text-anchor="middle" class="white">Operations</text><text x="150" y="184" text-anchor="middle" style="font:400 12px Arial,sans-serif;fill:#fff">get · edit-config · lock</text><rect x="28" y="212" width="244" height="60" rx="12" fill="#23a6a8"/><text x="150" y="238" text-anchor="middle" class="white">Messages</text><text x="150" y="259" text-anchor="middle" style="font:400 12px Arial,sans-serif;fill:#fff">rpc · rpc-reply · notification</text><rect x="28" y="287" width="244" height="60" rx="12" fill="#153f59"/><text x="150" y="313" text-anchor="middle" class="white">Secure Transport</text><text x="150" y="334" text-anchor="middle" style="font:400 12px Arial,sans-serif;fill:#fff">SSH sur les équipements Huawei</text></g>
  <g transform="translate(405 132)" filter="url(#s)"><rect width="320" height="385" rx="20" fill="#fff"/><text x="160" y="36" text-anchor="middle" class="h">Cycle d’une session</text><path d="M68 80v250" stroke="#c4d7df" stroke-width="5"/><g class="body"><circle cx="68" cy="85" r="18" fill="#4f72c4"/><text x="68" y="90" text-anchor="middle" style="font:700 12px Arial,sans-serif;fill:#fff">1</text><text x="102" y="90">Connexion SSH</text><circle cx="68" cy="145" r="18" fill="#4f72c4"/><text x="68" y="150" text-anchor="middle" style="font:700 12px Arial,sans-serif;fill:#fff">2</text><text x="102" y="150">Échange des capacités hello</text><circle cx="68" cy="205" r="18" fill="#23a6a8"/><text x="68" y="210" text-anchor="middle" style="font:700 12px Arial,sans-serif;fill:#fff">3</text><text x="102" y="210">Requête RPC</text><circle cx="68" cy="265" r="18" fill="#23a6a8"/><text x="68" y="270" text-anchor="middle" style="font:700 12px Arial,sans-serif;fill:#fff">4</text><text x="102" y="270">Réponse RPC</text><circle cx="68" cy="325" r="18" fill="#f2994a"/><text x="68" y="330" text-anchor="middle" style="font:700 12px Arial,sans-serif;fill:#fff">5</text><text x="102" y="330">Fermeture propre</text></g></g>
  <g transform="translate(775 132)" filter="url(#s)"><rect width="370" height="385" rx="20" fill="#fff"/><text x="185" y="36" text-anchor="middle" class="h">Datastores standard</text><rect x="70" y="72" width="230" height="68" rx="14" fill="#fff7ed" stroke="#f2994a" stroke-width="2"/><text x="185" y="99" text-anchor="middle" class="mono">&lt;candidate/&gt;</text><text x="185" y="123" text-anchor="middle" class="small">préparé, pas encore actif</text><path d="M185 140v44" stroke="#567687" stroke-width="4" marker-end="url(#a)"/><text x="205" y="168" class="small">commit</text><rect x="70" y="190" width="230" height="68" rx="14" fill="#e7f9f7" stroke="#23a6a8" stroke-width="2"/><text x="185" y="217" text-anchor="middle" class="mono">&lt;running/&gt;</text><text x="185" y="241" text-anchor="middle" class="small">configuration effective</text><rect x="70" y="300" width="230" height="68" rx="14" fill="#eef2ff" stroke="#4f72c4" stroke-width="2"/><text x="185" y="327" text-anchor="middle" class="mono">&lt;startup/&gt;</text><text x="185" y="351" text-anchor="middle" class="small">chargé au démarrage</text><path d="M300 334h36V224h-30" fill="none" stroke="#567687" stroke-width="3" marker-end="url(#a)"/></g>
  <rect x="60" y="566" width="1080" height="48" rx="15" fill="#153f59"/><text x="600" y="588" text-anchor="middle" style="font:700 14px Arial,sans-serif;fill:#fff">hello annonce ce que le serveur sait faire</text><text x="600" y="606" text-anchor="middle" style="font:400 12px Arial,sans-serif;fill:#d7edf3">candidate, rollback, notifications et interleave dépendent des capacités déclarées</text>
</svg>
