<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Architecture SNMP, MIB et échanges</title><desc id="desc">Le NMS échange Get, Set et Response avec l’agent. L’agent envoie Trap ou Inform. La MIB arborescente relie les OID aux objets gérés.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fcfd"/><stop offset="1" stop-color="#edf7fa"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#102a43" flood-opacity=".14"/></filter><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#4f72c4"/></marker><marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#f2994a"/></marker><style>.title{font:700 30px Arial,sans-serif;fill:#102a43}.sub{font:400 16px Arial,sans-serif;fill:#486581}.h{font:700 19px Arial,sans-serif;fill:#102a43}.body{font:400 14px Arial,sans-serif;fill:#334e68}.small{font:400 12px Arial,sans-serif;fill:#486581}.white{font:700 17px Arial,sans-serif;fill:#fff}.mono{font:600 13px Consolas,monospace;fill:#334e68}</style></defs>
  <rect width="1200" height="650" rx="26" fill="url(#bg)"/><text x="60" y="62" class="title">SNMP : messages, agents et objets gérés</text><text x="60" y="92" class="sub">Le NMS interroge ou modifie ; l’agent répond et signale les événements à partir de sa MIB.</text>
  <g transform="translate(70 145)" filter="url(#s)"><rect width="285" height="190" rx="22" fill="#4f72c4"/><text x="142" y="45" text-anchor="middle" class="white">NMS</text><rect x="32" y="70" width="221" height="86" rx="15" fill="#fff" fill-opacity=".95"/><text x="142" y="105" text-anchor="middle" class="h">Processus de gestion</text><text x="142" y="132" text-anchor="middle" class="body">Vue globale et décisions</text></g>
  <g transform="translate(845 145)" filter="url(#s)"><rect width="285" height="190" rx="22" fill="#23a6a8"/><text x="142" y="45" text-anchor="middle" class="white">Équipement géré</text><rect x="32" y="70" width="221" height="86" rx="15" fill="#fff" fill-opacity=".95"/><text x="142" y="105" text-anchor="middle" class="h">Agent SNMP</text><text x="142" y="132" text-anchor="middle" class="body">Maintient et expose la MIB</text></g>
  <path d="M355 180H835" stroke="#4f72c4" stroke-width="4" marker-end="url(#ar)"/><text x="595" y="167" text-anchor="middle" class="h">Get · Get-Next · Get-Bulk · Set</text><path d="M845 238H365" stroke="#4f72c4" stroke-width="4" marker-end="url(#ar)"/><text x="605" y="266" text-anchor="middle" class="h">Response</text><path d="M845 302C680 385 505 385 355 302" fill="none" stroke="#f2994a" stroke-width="4" marker-end="url(#ao)"/><text x="600" y="363" text-anchor="middle" class="h">Trap · Inform + acquittement</text>
  <g transform="translate(105 415)" filter="url(#s)"><rect width="990" height="155" rx="20" fill="#fff"/><text x="35" y="38" class="h">MIB : arbre des objets gérés</text><circle cx="330" cy="50" r="22" fill="#153f59"/><text x="330" y="55" text-anchor="middle" style="font:700 12px Arial,sans-serif;fill:#fff">root</text><path d="M330 72v25M330 97H210M330 97H455" stroke="#7f98a5" stroke-width="3"/><rect x="135" y="105" width="150" height="32" rx="9" fill="#e8f0ff"/><text x="210" y="127" text-anchor="middle" class="mono">public MIB</text><rect x="380" y="105" width="150" height="32" rx="9" fill="#e7f9f7"/><text x="455" y="127" text-anchor="middle" class="mono">enterprise</text><path d="M530 121H630" stroke="#7f98a5" stroke-width="3" marker-end="url(#ar)"/><rect x="645" y="80" width="310" height="64" rx="13" fill="#fff7ed" stroke="#f2994a"/><text x="800" y="105" text-anchor="middle" class="body">OID Huawei entreprise</text><text x="800" y="130" text-anchor="middle" class="mono">1.3.6.1.4.1.2011</text></g>
  <rect x="60" y="600" width="1080" height="28" rx="14" fill="#153f59"/><text x="600" y="620" text-anchor="middle" style="font:700 14px Arial,sans-serif;fill:#fff">SNMPv3 = utilisateur + authentification + chiffrement + vues d’accès</text>
</svg>
