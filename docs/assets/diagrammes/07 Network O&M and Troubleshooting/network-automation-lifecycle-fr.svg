<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Décider et sécuriser une automatisation réseau</title><desc id="desc">Un filtre de décision vérifie répétition, volume, règles et contrôlabilité, puis un cycle relie inventaire, précontrôle, canari, déploiement, validation et journalisation.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fcfd"/><stop offset="1" stop-color="#edf7fa"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#102a43" flood-opacity=".14"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#567687"/></marker><style>.title{font:700 30px Arial,sans-serif;fill:#102a43}.sub{font:400 16px Arial,sans-serif;fill:#486581}.h{font:700 18px Arial,sans-serif;fill:#102a43}.body{font:400 13px Arial,sans-serif;fill:#334e68}.small{font:400 12px Arial,sans-serif;fill:#486581}.white{font:700 16px Arial,sans-serif;fill:#fff}.num{font:700 14px Arial,sans-serif;fill:#fff}</style></defs>
  <rect width="1200" height="650" rx="26" fill="url(#bg)"/><text x="60" y="62" class="title">Automatiser quand la règle est claire et le résultat vérifiable</text><text x="60" y="92" class="sub">Le gain vient du volume et de la répétition ; la sécurité vient des contrôles avant, pendant et après.</text>
  <g transform="translate(55 132)" filter="url(#s)"><rect width="330" height="370" rx="22" fill="#fff"/><text x="165" y="38" text-anchor="middle" class="h">Filtre de décision</text><g transform="translate(28 68)"><rect width="274" height="50" rx="12" fill="#eef2ff"/><text x="20" y="30" class="body">✓ Tâche répétitive ?</text><rect y="64" width="274" height="50" rx="12" fill="#eef2ff"/><text x="20" y="94" class="body">✓ Grand volume ou longue durée ?</text><rect y="128" width="274" height="50" rx="12" fill="#e7f9f7"/><text x="20" y="158" class="body">✓ Règles et entrées explicites ?</text><rect y="192" width="274" height="50" rx="12" fill="#e7f9f7"/><text x="20" y="222" class="body">✓ Résultat testable ?</text><rect y="256" width="274" height="50" rx="12" fill="#fff7ed"/><text x="20" y="286" class="body">✓ Rollback possible ?</text></g></g>
  <path d="M385 317H440" stroke="#567687" stroke-width="4" marker-end="url(#a)"/>
  <g transform="translate(450 132)" filter="url(#s)"><rect width="695" height="370" rx="22" fill="#fff"/><text x="347" y="38" text-anchor="middle" class="h">Cycle d’exécution maîtrisé</text><path d="M92 105H602M602 105v172M602 277H92M92 277v-122" fill="none" stroke="#c4d7df" stroke-width="5" marker-end="url(#a)"/><g><circle cx="92" cy="105" r="30" fill="#4f72c4"/><text x="92" y="110" text-anchor="middle" class="num">1</text><text x="92" y="153" text-anchor="middle" class="body">Inventaire</text><circle cx="262" cy="105" r="30" fill="#4f72c4"/><text x="262" y="110" text-anchor="middle" class="num">2</text><text x="262" y="153" text-anchor="middle" class="body">Précontrôles</text><circle cx="432" cy="105" r="30" fill="#23a6a8"/><text x="432" y="110" text-anchor="middle" class="num">3</text><text x="432" y="153" text-anchor="middle" class="body">Canari</text><circle cx="602" cy="105" r="30" fill="#23a6a8"/><text x="602" y="110" text-anchor="middle" class="num">4</text><text x="602" y="153" text-anchor="middle" class="body">Lots limités</text><circle cx="602" cy="277" r="30" fill="#f2994a"/><text x="602" y="282" text-anchor="middle" class="num">5</text><text x="602" y="325" text-anchor="middle" class="body">Validation</text><circle cx="432" cy="277" r="30" fill="#f2994a"/><text x="432" y="282" text-anchor="middle" class="num">6</text><text x="432" y="325" text-anchor="middle" class="body">Journal</text><circle cx="262" cy="277" r="30" fill="#9b6bb3"/><text x="262" y="282" text-anchor="middle" class="num">7</text><text x="262" y="325" text-anchor="middle" class="body">Rollback</text><circle cx="92" cy="277" r="30" fill="#153f59"/><text x="92" y="282" text-anchor="middle" class="num">8</text><text x="92" y="325" text-anchor="middle" class="body">Améliorer</text></g></g>
  <g transform="translate(90 545)"><rect width="1020" height="62" rx="18" fill="#153f59"/><text x="510" y="26" text-anchor="middle" class="white">L’automatisation amplifie l’action</text><text x="510" y="48" text-anchor="middle" style="font:400 13px Arial,sans-serif;fill:#d7edf3">limiter la portée · protéger les secrets · vérifier l’identité · arrêter sur erreur · conserver les preuves</text></g>
</svg>
