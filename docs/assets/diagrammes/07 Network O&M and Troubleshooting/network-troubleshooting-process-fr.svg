<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Procédure générale de troubleshooting réseau</title><desc id="desc">Une chaîne de cinq étapes va de la sévérité à la vérification. Un panneau inférieur relie collecte, hypothèses, tests discriminants et preuve de restauration.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fcfd"/><stop offset="1" stop-color="#edf7fa"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#102a43" flood-opacity=".14"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#567687"/></marker><style>.title{font:700 30px Arial,sans-serif;fill:#102a43}.sub{font:400 16px Arial,sans-serif;fill:#486581}.h{font:700 17px Arial,sans-serif;fill:#102a43}.body{font:400 13px Arial,sans-serif;fill:#334e68}.small{font:400 12px Arial,sans-serif;fill:#486581}.num{font:700 21px Arial,sans-serif;fill:#fff}.white{font:700 15px Arial,sans-serif;fill:#fff}</style></defs>
  <rect width="1200" height="650" rx="26" fill="url(#bg)"/><text x="60" y="62" class="title">Troubleshooter sans modifier à l’aveugle</text><text x="60" y="92" class="sub">L’impact fixe la priorité ; les faits réduisent les hypothèses ; la preuve permet de conclure.</text>
  <path d="M235 225H285M455 225H505M675 225H725M895 225H945" stroke="#567687" stroke-width="4" marker-end="url(#a)"/>
  <g transform="translate(55 145)" filter="url(#s)"><rect width="180" height="160" rx="20" fill="#fff"/><circle cx="45" cy="44" r="27" fill="#c95151"/><text x="45" y="51" text-anchor="middle" class="num">1</text><text x="90" y="40" class="h">Sévérité</text><text x="20" y="90" class="body">Qui est affecté ?</text><text x="20" y="116" class="body">Quelle étendue ?</text><text x="20" y="142" class="small">Critical → Warning</text></g>
  <g transform="translate(275 145)" filter="url(#s)"><rect width="180" height="160" rx="20" fill="#fff"/><circle cx="45" cy="44" r="27" fill="#4f72c4"/><text x="45" y="51" text-anchor="middle" class="num">2</text><text x="90" y="40" class="h">Collecte</text><text x="20" y="90" class="body">Topologie · heure</text><text x="20" y="116" class="body">états · logs · config</text><text x="20" y="142" class="small">avant tout changement</text></g>
  <g transform="translate(495 145)" filter="url(#s)"><rect width="180" height="160" rx="20" fill="#fff"/><circle cx="45" cy="44" r="27" fill="#23a6a8"/><text x="45" y="51" text-anchor="middle" class="num">3</text><text x="90" y="40" class="h">Localiser</text><text x="20" y="90" class="body">Hypothèses classées</text><text x="20" y="116" class="body">Tests discriminants</text><text x="20" y="142" class="small">observer · comparer</text></g>
  <g transform="translate(715 145)" filter="url(#s)"><rect width="180" height="160" rx="20" fill="#fff"/><circle cx="45" cy="44" r="27" fill="#f2994a"/><text x="45" y="51" text-anchor="middle" class="num">4</text><text x="90" y="40" class="h">Corriger</text><text x="20" y="90" class="body">Isoler le défaut</text><text x="20" y="116" class="body">agir sur la cause</text><text x="20" y="142" class="small">rollback préparé</text></g>
  <g transform="translate(935 145)" filter="url(#s)"><rect width="210" height="160" rx="20" fill="#fff"/><circle cx="45" cy="44" r="27" fill="#153f59"/><text x="45" y="51" text-anchor="middle" class="num">5</text><text x="90" y="40" class="h">Vérifier</text><text x="20" y="90" class="body">Service de bout en bout</text><text x="20" y="116" class="body">aucun nouveau défaut</text><text x="20" y="142" class="small">rapport et prévention</text></g>
  <g transform="translate(80 365)" filter="url(#s)"><rect width="1040" height="180" rx="22" fill="#fff"/><text x="35" y="40" class="h">Une boucle de raisonnement, pas une suite de commandes</text><rect x="35" y="68" width="200" height="72" rx="14" fill="#eef2ff"/><text x="135" y="96" text-anchor="middle" class="h">Fait observé</text><text x="135" y="122" text-anchor="middle" class="small">« VLANIF down »</text><path d="M235 104H310" stroke="#567687" stroke-width="4" marker-end="url(#a)"/><rect x="320" y="68" width="200" height="72" rx="14" fill="#e7f9f7"/><text x="420" y="96" text-anchor="middle" class="h">Hypothèse</text><text x="420" y="122" text-anchor="middle" class="small">aucun port actif du VLAN</text><path d="M520 104H595" stroke="#567687" stroke-width="4" marker-end="url(#a)"/><rect x="605" y="68" width="200" height="72" rx="14" fill="#fff7ed"/><text x="705" y="96" text-anchor="middle" class="h">Test</text><text x="705" y="122" text-anchor="middle" class="small">état ports + VLAN + STP</text><path d="M805 104H880" stroke="#567687" stroke-width="4" marker-end="url(#a)"/><rect x="890" y="68" width="115" height="72" rx="14" fill="#153f59"/><text x="947" y="96" text-anchor="middle" class="white">Preuve</text><text x="947" y="122" text-anchor="middle" style="font:400 11px Arial,sans-serif;fill:#fff">service rétabli</text></g>
  <rect x="60" y="590" width="1080" height="32" rx="14" fill="#153f59"/><text x="600" y="612" text-anchor="middle" style="font:700 14px Arial,sans-serif;fill:#fff">Collecter avant de modifier · tester une hypothèse à la fois · valider au-delà du symptôme initial</text>
</svg>
