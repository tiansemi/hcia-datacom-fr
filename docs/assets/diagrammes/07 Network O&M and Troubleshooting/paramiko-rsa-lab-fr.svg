<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Chaîne du lab Paramiko avec authentification RSA</title><desc id="desc">Le client génère une paire RSA, importe uniquement la clé publique sur le switch, vérifie la clé d’hôte, se connecte avec Paramiko, exécute des commandes et valide la sortie.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fcfd"/><stop offset="1" stop-color="#edf7fa"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#102a43" flood-opacity=".14"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#567687"/></marker><style>.title{font:700 30px Arial,sans-serif;fill:#102a43}.sub{font:400 16px Arial,sans-serif;fill:#486581}.h{font:700 18px Arial,sans-serif;fill:#102a43}.body{font:400 13px Arial,sans-serif;fill:#334e68}.small{font:400 12px Arial,sans-serif;fill:#486581}.white{font:700 16px Arial,sans-serif;fill:#fff}.mono{font:600 12px Consolas,monospace;fill:#334e68}</style></defs>
  <rect width="1200" height="650" rx="26" fill="url(#bg)"/><text x="60" y="62" class="title">Lab Paramiko : la clé privée reste sur le client</text><text x="60" y="92" class="sub">Seule la clé publique est importée sur le switch ; la clé d’hôte du switch est vérifiée séparément.</text>
  <g transform="translate(55 135)" filter="url(#s)"><rect width="350" height="330" rx="22" fill="#fff"/><rect width="350" height="58" rx="22" fill="#4f72c4"/><rect y="34" width="350" height="24" fill="#4f72c4"/><text x="175" y="39" text-anchor="middle" class="white">Client Python · 192.168.56.1</text><text x="30" y="95" class="h">1 · Générer RSA 4096</text><rect x="30" y="112" width="290" height="36" rx="10" fill="#eef2ff"/><text x="175" y="135" text-anchor="middle" class="mono">id_rsa + id_rsa.pub</text><text x="30" y="183" class="h">2 · Protéger</text><text x="30" y="210" class="body">clé privée + passphrase</text><text x="30" y="247" class="h">3 · Vérifier known_hosts</text><text x="30" y="274" class="body">empreinte du serveur STelnet</text><text x="30" y="309" class="small">Paramiko utilise ensuite id_rsa</text></g>
  <g transform="translate(795 135)" filter="url(#s)"><rect width="350" height="330" rx="22" fill="#fff"/><rect width="350" height="58" rx="22" fill="#23a6a8"/><rect y="34" width="350" height="24" fill="#23a6a8"/><text x="175" y="39" text-anchor="middle" class="white">Switch Huawei · 192.168.56.100</text><text x="30" y="95" class="h">4 · Préparer STelnet</text><text x="30" y="124" class="body">IP · AAA · VTY SSH · source</text><text x="30" y="164" class="h">5 · Importer id_rsa.pub</text><rect x="30" y="181" width="290" height="36" rx="10" fill="#e7f9f7"/><text x="175" y="204" text-anchor="middle" class="mono">rsa peer-public-key rsa01</text><text x="30" y="244" class="h">6 · Associer à l’utilisateur</text><text x="30" y="273" class="body">ssh user client assign rsa-key rsa01</text><text x="30" y="309" class="small">Aucune clé privée sur le switch</text></g>
  <path d="M405 210H785" stroke="#f2994a" stroke-width="5" stroke-dasharray="11 8" marker-end="url(#a)"/><text x="595" y="192" text-anchor="middle" class="h">clé publique uniquement</text><path d="M785 345H415" stroke="#4f72c4" stroke-width="5" marker-end="url(#a)"/><text x="600" y="375" text-anchor="middle" class="h">SSH : authentification et canal chiffré</text>
  <g transform="translate(210 505)" filter="url(#s)"><rect width="780" height="88" rx="20" fill="#153f59"/><text x="390" y="30" text-anchor="middle" class="white">7 · Script Paramiko</text><text x="390" y="56" text-anchor="middle" style="font:400 13px Arial,sans-serif;fill:#fff">connect → invoke_shell → désactiver pagination → display current-configuration → lire → close</text><text x="390" y="76" text-anchor="middle" style="font:400 12px Arial,sans-serif;fill:#d7edf3">preuve : sortie complète, identité vérifiée, aucun secret dans Git</text></g>
</svg>
