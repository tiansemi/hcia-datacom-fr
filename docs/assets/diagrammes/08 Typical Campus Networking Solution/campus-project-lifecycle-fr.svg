<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Cycle de vie d’un projet de réseau de campus</title>
  <desc id="desc">Quatre phases reliées en boucle : planification et conception, déploiement et implémentation, exploitation et maintenance, puis optimisation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fcfd"/><stop offset="1" stop-color="#e9f6f8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#102a43" flood-opacity=".13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#4f72c4"/></marker>
  </defs>
  <rect width="1200" height="650" rx="28" fill="url(#bg)"/>
  <text x="60" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#102a43">Cycle de vie d’un projet de campus</text>
  <text x="60" y="94" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#486581">Chaque phase produit les éléments nécessaires à la suivante</text>

  <g fill="none" stroke="#4f72c4" stroke-width="5" marker-end="url(#arrow)">
    <path d="M426 242C500 172 700 172 774 242"/>
    <path d="M894 323C940 374 940 443 894 493"/>
    <path d="M774 547C700 603 500 603 426 547"/>
    <path d="M306 493C260 443 260 374 306 323"/>
  </g>

  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="105" y="172" width="330" height="150" rx="24" fill="#fff" stroke="#23a6a8" stroke-width="3"/>
    <circle cx="155" cy="218" r="26" fill="#23a6a8"/><text x="155" y="227" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">1</text>
    <text x="196" y="213" font-size="22" font-weight="700" fill="#153f59">Planifier et concevoir</text>
    <text x="137" y="256" font-size="16" fill="#486581">Architecture, topologies, VLAN, IP</text>
    <text x="137" y="284" font-size="16" fill="#486581">routage, WLAN, sécurité, O&amp;M</text>

    <rect x="765" y="172" width="330" height="150" rx="24" fill="#fff" stroke="#4f72c4" stroke-width="3"/>
    <circle cx="815" cy="218" r="26" fill="#4f72c4"/><text x="815" y="227" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">2</text>
    <text x="856" y="213" font-size="22" font-weight="700" fill="#153f59">Déployer et valider</text>
    <text x="797" y="256" font-size="16" fill="#486581">Installer, configurer, tester</text>
    <text x="797" y="284" font-size="16" fill="#486581">basculer, former et recetter</text>

    <rect x="765" y="452" width="330" height="150" rx="24" fill="#fff" stroke="#f2994a" stroke-width="3"/>
    <circle cx="815" cy="498" r="26" fill="#f2994a"/><text x="815" y="507" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">3</text>
    <text x="856" y="493" font-size="22" font-weight="700" fill="#153f59">Exploiter et maintenir</text>
    <text x="797" y="536" font-size="16" fill="#486581">Superviser, sauvegarder, changer</text>
    <text x="797" y="564" font-size="16" fill="#486581">dépanner et prévenir la récidive</text>

    <rect x="105" y="452" width="330" height="150" rx="24" fill="#fff" stroke="#153f59" stroke-width="3"/>
    <circle cx="155" cy="498" r="26" fill="#153f59"/><text x="155" y="507" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">4</text>
    <text x="196" y="493" font-size="22" font-weight="700" fill="#153f59">Optimiser</text>
    <text x="137" y="536" font-size="16" fill="#486581">Performance, capacité, ressources</text>
    <text x="137" y="564" font-size="16" fill="#486581">et expérience utilisateur</text>
  </g>

  <circle cx="600" cy="390" r="120" fill="#153f59"/>
  <text x="600" y="365" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">Exigences</text>
  <text x="600" y="396" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#d8edf4">→ choix documentés</text>
  <text x="600" y="427" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#d8edf4">→ preuves mesurables</text>
  <path d="M543 447h114" stroke="#23a6a8" stroke-width="5" stroke-linecap="round"/>
  <text x="600" y="475" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#fff">amélioration continue</text>
</svg>
