<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Rôle du système d'exploitation d'un équipement réseau</title>
  <desc id="desc">L'administrateur utilise la CLI ou le web, le système YunShan OS ou VRP coordonne les fonctions réseau et les ressources matérielles.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#eef5fa"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#18364f" flood-opacity=".14"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#50718a"/></marker><style>.t{font:700 44px Arial,sans-serif;fill:#13293d}.sub{font:400 21px Arial,sans-serif;fill:#526a80}.light{font:400 21px Arial,sans-serif;fill:#eaf5ff}.h{font:700 25px Arial,sans-serif;fill:#102a43}.b{font:400 19px Arial,sans-serif;fill:#38536b}.white{font:700 26px Arial,sans-serif;fill:#fff}.line{stroke:#50718a;stroke-width:5;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/><text x="800" y="70" text-anchor="middle" class="t">Le système d'exploitation, cerveau de l'équipement</text><text x="800" y="108" text-anchor="middle" class="sub">YunShan OS ou VRP coordonne l'administration, les fonctions réseau et le matériel</text>
  <g filter="url(#s)"><rect x="610" y="150" width="380" height="90" rx="24" fill="#d8ecff"/><text x="800" y="190" text-anchor="middle" class="h">Administrateur</text><text x="800" y="218" text-anchor="middle" class="b">configuration · supervision · maintenance</text></g>
  <path d="M800 240V286" class="line"/>
  <g filter="url(#s)"><rect x="350" y="300" width="360" height="100" rx="24" fill="#e2f5e6"/><text x="530" y="343" text-anchor="middle" class="h">CLI</text><text x="530" y="372" text-anchor="middle" class="b">commandes et vues</text><rect x="890" y="300" width="360" height="100" rx="24" fill="#e2f5e6"/><text x="1070" y="343" text-anchor="middle" class="h">Interface web</text><text x="1070" y="372" text-anchor="middle" class="b">gestion graphique</text></g>
  <path d="M530 400V445H720" class="line"/><path d="M1070 400V445H880" class="line"/>
  <g filter="url(#s)"><rect x="480" y="460" width="640" height="130" rx="32" fill="#22577a"/><text x="800" y="515" text-anchor="middle" class="white">YunShan OS / VRP</text><text x="800" y="555" text-anchor="middle" class="light">gestion et contrôle centralisés de l'équipement</text></g>
  <path d="M800 590V635" class="line"/>
  <g filter="url(#s)"><rect x="100" y="650" width="260" height="120" rx="24" fill="#fff2c9"/><text x="230" y="700" text-anchor="middle" class="h">Transfert</text><text x="230" y="732" text-anchor="middle" class="b">commutation · routage</text><rect x="390" y="650" width="260" height="120" rx="24" fill="#ffe8de"/><text x="520" y="700" text-anchor="middle" class="h">Protocoles</text><text x="520" y="732" text-anchor="middle" class="b">services et contrôle</text><rect x="680" y="650" width="260" height="120" rx="24" fill="#eee3f8"/><text x="810" y="700" text-anchor="middle" class="h">Sécurité</text><text x="810" y="732" text-anchor="middle" class="b">accès et protection</text><rect x="970" y="650" width="260" height="120" rx="24" fill="#d8ecff"/><text x="1100" y="700" text-anchor="middle" class="h">Ressources</text><text x="1100" y="732" text-anchor="middle" class="b">CPU · mémoire · fichiers</text><rect x="1260" y="650" width="240" height="120" rx="24" fill="#dfe7ed"/><text x="1380" y="700" text-anchor="middle" class="h">Matériel</text><text x="1380" y="732" text-anchor="middle" class="b">ports · cartes · stockage</text></g>
  <rect x="390" y="820" width="820" height="48" rx="24" fill="#fff" stroke="#cad8e4" stroke-width="2"/><text x="800" y="851" text-anchor="middle" class="b">La version et la plateforme déterminent les fonctions et commandes réellement disponibles.</text>
</svg>
