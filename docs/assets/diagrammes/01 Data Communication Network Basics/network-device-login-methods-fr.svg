<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Méthodes de connexion à un équipement réseau Huawei</title>
  <desc id="desc">Comparaison de la console locale, de Telnet et STelnet à distance, et de l'interface web HTTPS.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#edf4f9"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#19364f" flood-opacity=".14"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#4c6f88"/></marker><style>.t{font:700 44px Arial,sans-serif;fill:#13293d}.sub{font:400 21px Arial,sans-serif;fill:#526a80}.h{font:700 27px Arial,sans-serif;fill:#102a43}.b{font:400 19px Arial,sans-serif;fill:#38536b}.tag{font:700 17px Arial,sans-serif;fill:#fff}.line{stroke:#4c6f88;stroke-width:5;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/><text x="800" y="70" text-anchor="middle" class="t">Choisir le bon mode de connexion</text><text x="800" y="108" text-anchor="middle" class="sub">Accès local, terminal distant ou administration graphique</text>
  <g filter="url(#s)"><rect x="620" y="365" width="360" height="180" rx="32" fill="#22577a"/><text x="800" y="430" text-anchor="middle" class="tag" font-size="28">ÉQUIPEMENT HUAWEI</text><text x="800" y="475" text-anchor="middle" class="tag">YunShan OS / VRP</text><text x="800" y="512" text-anchor="middle" class="tag">CLI + serveur web</text></g>
  <g filter="url(#s)"><rect x="80" y="190" width="400" height="230" rx="30" fill="#d8ecff" stroke="#83b9e3" stroke-width="3"/><rect x="200" y="220" width="160" height="40" rx="20" fill="#3b82b8"/><text x="280" y="246" text-anchor="middle" class="tag">LOCAL</text><text x="280" y="307" text-anchor="middle" class="h">Console</text><text x="280" y="345" text-anchor="middle" class="b">port série · câble console</text><text x="280" y="378" text-anchor="middle" class="b">première mise en service</text>
  <rect x="80" y="500" width="400" height="230" rx="30" fill="#e2f5e6" stroke="#85c596" stroke-width="3"/><rect x="180" y="530" width="200" height="40" rx="20" fill="#37975a"/><text x="280" y="556" text-anchor="middle" class="tag">DISTANT · CLI</text><text x="280" y="617" text-anchor="middle" class="h">Telnet / STelnet</text><text x="280" y="655" text-anchor="middle" class="b">connectivité IP · interfaces VTY</text><text x="280" y="688" text-anchor="middle" class="b">STelnet est le choix plus sûr</text>
  <rect x="1120" y="345" width="400" height="230" rx="30" fill="#fff2c9" stroke="#e4b74f" stroke-width="3"/><rect x="1220" y="375" width="200" height="40" rx="20" fill="#d69a18"/><text x="1320" y="401" text-anchor="middle" class="tag">DISTANT · GUI</text><text x="1320" y="462" text-anchor="middle" class="h">Web HTTPS</text><text x="1320" y="500" text-anchor="middle" class="b">adresse de management</text><text x="1320" y="533" text-anchor="middle" class="b">navigateur · compte administrateur</text></g>
  <path d="M480 330H590V415H620" class="line"/><path d="M480 615H590V500H620" class="line"/><path d="M1120 460H990" class="line"/>
  <rect x="320" y="790" width="960" height="62" rx="31" fill="#fff" stroke="#cad8e4" stroke-width="2"/><text x="800" y="818" text-anchor="middle" class="b">Pas de connectivité IP ? Utiliser la console.</text><text x="800" y="843" text-anchor="middle" class="b">Accès distant ? Préférer STelnet ou HTTPS selon le besoin et la plateforme.</text>
</svg>
