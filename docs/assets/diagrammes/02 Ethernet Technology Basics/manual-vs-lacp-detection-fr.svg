<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Comparaison du contrôle manuel et de LACP</title><desc id="desc">Le mode manuel dépend de la configuration et de l'état physique, tandis que LACP échange des LACPDU et valide le pair.</desc><defs><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#12324f" flood-opacity=".12"/></filter><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#12324f}.t{font-size:46px;font-weight:760}.st{font-size:22px;fill:#526e87}.h{font-size:30px;font-weight:750}.b{font-size:20px}.sm{font-size:18px}.w{fill:#fff}.card{fill:#fff;stroke:#d4e4ef;stroke-width:2}</style></defs><rect width="1600" height="900" rx="38" fill="#f7fafc"/><text x="800" y="75" text-anchor="middle" class="t">Mode manuel ou LACP : qui vérifie le lien ?</text><text x="800" y="115" text-anchor="middle" class="st">Même objectif d'agrégation, niveau de contrôle différent</text><g transform="translate(90 190)" filter="url(#s)"><rect width="670" height="560" rx="32" class="card"/><rect width="670" height="100" rx="32" fill="#6b7f91"/><text x="335" y="63" text-anchor="middle" class="h w">Mode manuel</text><text x="335" y="165" text-anchor="middle" class="b">Aucun paquet de négociation</text><rect x="85" y="215" width="500" height="65" rx="18" fill="#eef3f6"/><text x="335" y="257" text-anchor="middle" class="b">Contrôle : état physique Up/Down</text><rect x="85" y="310" width="500" height="65" rx="18" fill="#fff0e6"/><text x="335" y="352" text-anchor="middle" class="b">Câblage erroné : non détecté automatiquement</text><rect x="85" y="405" width="500" height="65" rx="18" fill="#fff0e6"/><text x="335" y="447" text-anchor="middle" class="b">Lien Up sans transfert : risque de pertes</text><text x="335" y="520" text-anchor="middle" class="sm">utile si le pair ne prend pas en charge LACP</text></g><g transform="translate(840 190)" filter="url(#s)"><rect width="670" height="560" rx="32" class="card"/><rect width="670" height="100" rx="32" fill="#10a6a0"/><text x="335" y="63" text-anchor="middle" class="h w">Mode LACP</text><text x="335" y="165" text-anchor="middle" class="b">Échange de LACPDU</text><rect x="85" y="215" width="500" height="65" rx="18" fill="#e5f7f5"/><text x="335" y="257" text-anchor="middle" class="b">Valide système, groupe et interfaces</text><rect x="85" y="310" width="500" height="65" rx="18" fill="#e5f7f5"/><text x="335" y="352" text-anchor="middle" class="b">Élit les membres actifs et de secours</text><rect x="85" y="405" width="500" height="65" rx="18" fill="#e5f7f5"/><text x="335" y="447" text-anchor="middle" class="b">Suit la décision de l'Actor</text><text x="335" y="520" text-anchor="middle" class="sm">recommandé lorsque les deux pairs le supportent</text></g><text x="800" y="825" text-anchor="middle" class="b">Dans les deux modes, la cohérence des deux extrémités reste indispensable.</text></svg>
