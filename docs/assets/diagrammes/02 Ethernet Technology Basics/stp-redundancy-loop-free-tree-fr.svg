<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">STP transforme une topologie redondante en arbre logique</title><desc id="desc">Trois switchs en triangle conservent leurs liens physiques, mais STP bloque un port pour supprimer la boucle.</desc><defs><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#12324f" flood-opacity=".12"/></filter><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#12324f}.t{font-size:46px;font-weight:760}.st{font-size:22px;fill:#526e87}.h{font-size:28px;font-weight:740}.b{font-size:20px}.w{fill:#fff}.line{stroke:#55748d;stroke-width:12;stroke-linecap:round}</style></defs><rect width="1600" height="900" rx="38" fill="#f7fafc"/><text x="800" y="75" text-anchor="middle" class="t">Redondance physique, arbre logique sans boucle</text><text x="800" y="115" text-anchor="middle" class="st">STP bloque un chemin, sans supprimer la liaison de secours</text><path d="M800 270 L360 650 M800 270 L1240 650 M360 650 L1240 650" class="line"/><path d="M800 270 L360 650 M800 270 L1240 650" stroke="#10a6a0" stroke-width="14"/><path d="M360 650 L790 650" stroke="#10a6a0" stroke-width="14"/><path d="M810 650 L1240 650" stroke="#ef7f45" stroke-width="14" stroke-dasharray="18 14"/><g filter="url(#s)"><rect x="630" y="195" width="340" height="130" rx="28" fill="#1769aa"/><text x="800" y="250" text-anchor="middle" class="h w">SW1 · Root</text><text x="800" y="288" text-anchor="middle" class="b w">ports designated</text><rect x="190" y="590" width="340" height="130" rx="28" fill="#fff" stroke="#10a6a0" stroke-width="3"/><text x="360" y="645" text-anchor="middle" class="h">SW2</text><text x="360" y="683" text-anchor="middle" class="b">root + designated</text><rect x="1070" y="590" width="340" height="130" rx="28" fill="#fff" stroke="#ef7f45" stroke-width="3"/><text x="1240" y="645" text-anchor="middle" class="h">SW3</text><text x="1240" y="683" text-anchor="middle" class="b">root + alternate</text></g><rect x="760" y="615" width="120" height="70" rx="20" fill="#ef7f45"/><text x="820" y="645" text-anchor="middle" class="b w">port</text><text x="820" y="672" text-anchor="middle" class="b w">bloqué</text><rect x="420" y="795" width="760" height="55" rx="27" fill="#e8f1f7"/><text x="800" y="831" text-anchor="middle" class="b">En cas de panne, STP peut réactiver le chemin redondant.</text></svg>
