<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Ordre de comparaison d'une BPDU STP</title><desc id="desc">STP compare Root ID, Root Path Cost, Bridge ID puis Port ID, du critère le plus important au dernier départage.</desc><defs><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#12324f" flood-opacity=".12"/></filter><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#12324f}.t{font-size:46px;font-weight:760}.st{font-size:22px;fill:#526e87}.n{font-size:42px;font-weight:800}.h{font-size:28px;font-weight:740}.b{font-size:20px}.w{fill:#fff}</style></defs><rect width="1600" height="900" rx="38" fill="#f7fafc"/><text x="800" y="75" text-anchor="middle" class="t">Comparer les BPDU : le premier champ différent décide</text><text x="800" y="115" text-anchor="middle" class="st">Toujours rechercher la plus petite valeur, dans cet ordre strict</text><g transform="translate(120 210)"><g filter="url(#s)"><rect width="290" height="430" rx="30" fill="#1769aa"/><circle cx="145" cy="85" r="48" fill="#fff"/><text x="145" y="100" text-anchor="middle" class="n">1</text><text x="145" y="185" text-anchor="middle" class="h w">Root ID</text><text x="145" y="225" text-anchor="middle" class="b w">racine annoncée</text><text x="145" y="320" text-anchor="middle" class="b w">critère principal</text></g><g transform="translate(350)" filter="url(#s)"><rect width="290" height="430" rx="30" fill="#2388bd"/><circle cx="145" cy="85" r="48" fill="#fff"/><text x="145" y="100" text-anchor="middle" class="n">2</text><text x="145" y="185" text-anchor="middle" class="h w">RPC</text><text x="145" y="225" text-anchor="middle" class="b w">coût vers la racine</text><text x="145" y="320" text-anchor="middle" class="b w">meilleur chemin</text></g><g transform="translate(700)" filter="url(#s)"><rect width="290" height="430" rx="30" fill="#10a6a0"/><circle cx="145" cy="85" r="48" fill="#fff"/><text x="145" y="100" text-anchor="middle" class="n">3</text><text x="145" y="185" text-anchor="middle" class="h w">Bridge ID</text><text x="145" y="225" text-anchor="middle" class="b w">switch émetteur</text><text x="145" y="320" text-anchor="middle" class="b w">départage suivant</text></g><g transform="translate(1050)" filter="url(#s)"><rect width="290" height="430" rx="30" fill="#7c55b5"/><circle cx="145" cy="85" r="48" fill="#fff"/><text x="145" y="100" text-anchor="middle" class="n">4</text><text x="145" y="185" text-anchor="middle" class="h w">Port ID</text><text x="145" y="225" text-anchor="middle" class="b w">port émetteur</text><text x="145" y="320" text-anchor="middle" class="b w">dernier départage</text></g></g><rect x="360" y="720" width="880" height="70" rx="35" fill="#e8f1f7"/><text x="800" y="764" text-anchor="middle" class="h">Le plus petit Root ID → RPC → BID → PID gagne</text></svg>
