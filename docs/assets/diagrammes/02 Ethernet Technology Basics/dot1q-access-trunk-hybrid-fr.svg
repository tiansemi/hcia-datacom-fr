<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Tag IEEE 802.1Q et interfaces VLAN</title><desc id="desc">Structure du tag 802.1Q et synthèse du comportement access, trunk et hybrid.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#12324f" flood-opacity=".12"/></filter><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#12324f}.t{font-size:46px;font-weight:760}.st{font-size:21px;fill:#526e87}.h{font-size:27px;font-weight:740}.b{font-size:20px}.sm{font-size:17px}.w{fill:#fff}.card{fill:#fff;stroke:#d4e4ef;stroke-width:2}</style></defs>
  <rect width="1600" height="900" rx="38" fill="#f7fafc"/><text x="800" y="70" text-anchor="middle" class="t">IEEE 802.1Q : identifier et transporter les VLAN</text><text x="800" y="108" text-anchor="middle" class="st">Un tag de 4 octets inséré après la MAC source</text>
  <g transform="translate(90 155)" filter="url(#s)"><rect width="1420" height="220" rx="28" class="card"/><text x="40" y="54" class="h">Trame taguée</text><g transform="translate(40 85)"><rect width="250" height="88" rx="14" fill="#1769aa"/><rect x="260" width="250" height="88" rx="14" fill="#2787bd"/><rect x="520" width="420" height="88" rx="14" fill="#10a6a0"/><rect x="950" width="210" height="88" rx="14" fill="#e8f4f2"/><rect x="1170" width="170" height="88" rx="14" fill="#f6c85f"/><text x="125" y="52" text-anchor="middle" class="h w">DMAC</text><text x="385" y="52" text-anchor="middle" class="h w">SMAC</text><text x="730" y="38" text-anchor="middle" class="h w">Tag 802.1Q</text><text x="730" y="68" text-anchor="middle" class="sm w">TPID · PRI · CFI · VID</text><text x="1055" y="52" text-anchor="middle" class="h">Type</text><text x="1255" y="52" text-anchor="middle" class="h">Données</text></g></g>
  <g transform="translate(90 430)"><g filter="url(#s)"><rect width="440" height="320" rx="28" class="card"/><text x="220" y="50" text-anchor="middle" class="h">Access</text><text x="220" y="84" text-anchor="middle" class="st">un seul VLAN</text><rect x="85" y="120" width="270" height="58" rx="16" fill="#e8f3fb"/><text x="220" y="157" text-anchor="middle" class="b">Entrée : ajoute le PVID</text><rect x="85" y="195" width="270" height="58" rx="16" fill="#e8f3fb"/><text x="220" y="232" text-anchor="middle" class="b">Sortie : retire le tag</text><text x="220" y="288" text-anchor="middle" class="sm">terminal PC ou serveur</text></g>
  <g transform="translate(490)" filter="url(#s)"><rect width="440" height="320" rx="28" class="card"/><text x="220" y="50" text-anchor="middle" class="h">Trunk</text><text x="220" y="84" text-anchor="middle" class="st">plusieurs VLAN autorisés</text><rect x="65" y="120" width="310" height="58" rx="16" fill="#e5f7f5"/><text x="220" y="157" text-anchor="middle" class="b">VID = PVID : non tagué</text><rect x="65" y="195" width="310" height="58" rx="16" fill="#e5f7f5"/><text x="220" y="232" text-anchor="middle" class="b">Autre VID autorisé : tagué</text><text x="220" y="288" text-anchor="middle" class="sm">liaison entre équipements</text></g>
  <g transform="translate(980)" filter="url(#s)"><rect width="440" height="320" rx="28" class="card"/><text x="220" y="50" text-anchor="middle" class="h">Hybrid</text><text x="220" y="84" text-anchor="middle" class="st">listes tagged et untagged</text><rect x="65" y="120" width="310" height="58" rx="16" fill="#fff0e6"/><text x="220" y="157" text-anchor="middle" class="b">Liste untagged : retire</text><rect x="65" y="195" width="310" height="58" rx="16" fill="#fff0e6"/><text x="220" y="232" text-anchor="middle" class="b">Liste tagged : conserve</text><text x="220" y="288" text-anchor="middle" class="sm">comportement flexible par VLAN</text></g></g>
  <text x="800" y="825" text-anchor="middle" class="b">VID utilisables : 1 à 4094 · TPID standard présenté : 0x8100</text>
</svg>
