<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">WLAN, Wi-Fi et IEEE 802.11</title><desc id="desc">WLAN est la catégorie, Wi-Fi la technologie courante et IEEE 802.11 la famille de normes MAC et PHY.</desc><rect width="1200" height="520" rx="28" fill="#f5fafc"/><text x="600" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#102a43">Trois termes à ne pas confondre</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="70" y="125" width="1060" height="320" rx="42" fill="#e7f6f3" stroke="#23a6a8" stroke-width="3"/><text x="205" y="185" font-size="28" font-weight="700" fill="#128f91">WLAN</text><text x="205" y="220" font-size="18" fill="#486581">catégorie de réseau</text><rect x="330" y="175" width="730" height="220" rx="35" fill="#e8edff" stroke="#4f72c4" stroke-width="3"/><text x="455" y="235" font-size="28" font-weight="700" fill="#3d5da8">Wi-Fi</text><text x="455" y="270" font-size="18" fill="#486581">technologie et marque</text><rect x="590" y="225" width="400" height="120" rx="28" fill="#153f59"/><text x="790" y="276" font-size="27" font-weight="700" fill="#70e0d8">IEEE 802.11</text><text x="790" y="312" font-size="18" fill="#fff">spécifications MAC et PHY</text><text x="600" y="482" font-size="19" font-weight="700" fill="#334e68">Le parcours Huawei traite les WLAN fondés sur Wi-Fi.</text></g></svg>
