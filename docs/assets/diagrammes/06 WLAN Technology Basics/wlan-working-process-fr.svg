<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Chaîne de fonctionnement d’un WLAN centralisé</title>
  <desc id="desc">Trois phases relient la mise en ligne du Fit AP, l’accès de la station et le transfert des données, avec leurs principales sous-étapes.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fcfd"/><stop offset="1" stop-color="#edf7fa"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#102a43" flood-opacity=".14"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#698595"/></marker><style>.title{font:700 30px Arial,sans-serif;fill:#102a43}.sub{font:400 16px Arial,sans-serif;fill:#486581}.num{font:700 22px Arial,sans-serif;fill:#fff}.h{font:700 20px Arial,sans-serif;fill:#102a43}.body{font:400 14px Arial,sans-serif;fill:#334e68}.small{font:400 12px Arial,sans-serif;fill:#486581}</style></defs>
  <rect width="1200" height="650" rx="26" fill="url(#bg)"/><text x="60" y="62" class="title">Un service WLAN opérationnel se construit en trois phases</text><text x="60" y="92" class="sub">Une défaillance en amont empêche les étapes suivantes : diagnostiquer dans l’ordre.</text>
  <path d="M380 320H425M775 320H820" stroke="#698595" stroke-width="4" marker-end="url(#a)"/>
  <g transform="translate(45 135)" filter="url(#s)"><rect width="335" height="385" rx="22" fill="#fff"/><rect width="335" height="72" rx="22" fill="#4f72c4"/><rect y="48" width="335" height="24" fill="#4f72c4"/><circle cx="42" cy="36" r="22" fill="#fff" fill-opacity=".22"/><text x="42" y="44" text-anchor="middle" class="num">1</text><text x="78" y="43" class="num">Mise en ligne AP</text><text x="25" y="111" class="h">Préparer et joindre le WAC</text><g class="body"><text x="28" y="151">1. Adresse IP : DHCP, statique ou SLAAC</text><text x="28" y="184">2. Découverte : DHCP, DNS ou broadcast</text><text x="28" y="217">3. Établissement des tunnels CAPWAP</text><text x="28" y="250">4. Admission : MAC, SN ou no-auth</text><text x="28" y="283">5. Alignement de la version logicielle</text><text x="28" y="316">6. État initial et configuration</text><text x="28" y="349">7. Echo, Keepalive et mises à jour</text></g></g>
  <g transform="translate(425 135)" filter="url(#s)"><rect width="350" height="385" rx="22" fill="#fff"/><rect width="350" height="72" rx="22" fill="#23a6a8"/><rect y="48" width="350" height="24" fill="#23a6a8"/><circle cx="42" cy="36" r="22" fill="#fff" fill-opacity=".22"/><text x="42" y="44" text-anchor="middle" class="num">2</text><text x="78" y="43" class="num">Accès de la station</text><text x="25" y="111" class="h">Découvrir et négocier</text><circle cx="175" cy="178" r="54" fill="#e7f9f7" stroke="#23a6a8" stroke-width="3"/><path d="M143 175q32-34 64 0M154 187q21-22 42 0M171 199h8" fill="none" stroke="#23a6a8" stroke-width="5" stroke-linecap="round"/><text x="175" y="255" text-anchor="middle" class="body">Scanning actif ou passif</text><text x="175" y="292" text-anchor="middle" class="body">Authentification de lien</text><text x="175" y="329" text-anchor="middle" class="body">Association et contrôle d’accès</text><text x="175" y="363" text-anchor="middle" class="small">Probe / Beacon → Authentication → Association</text></g>
  <g transform="translate(820 135)" filter="url(#s)"><rect width="335" height="385" rx="22" fill="#fff"/><rect width="335" height="72" rx="22" fill="#f2994a"/><rect y="48" width="335" height="24" fill="#f2994a"/><circle cx="42" cy="36" r="22" fill="#fff" fill-opacity=".22"/><text x="42" y="44" text-anchor="middle" class="num">3</text><text x="78" y="43" class="num">Transfert des données</text><text x="25" y="111" class="h">Choisir le chemin</text><rect x="25" y="137" width="285" height="92" rx="14" fill="#fff7ed" stroke="#f2994a"/><text x="45" y="168" class="h">Direct</text><text x="45" y="195" class="body">AP → réseau supérieur</text><text x="45" y="216" class="small">Charge WAC réduite</text><rect x="25" y="249" width="285" height="105" rx="14" fill="#eef2ff" stroke="#4f72c4"/><text x="45" y="280" class="h">Tunnel</text><text x="45" y="307" class="body">AP → CAPWAP → WAC</text><text x="45" y="330" class="small">Contrôle centralisé du trafic</text></g>
  <rect x="60" y="570" width="1080" height="42" rx="15" fill="#153f59"/><text x="600" y="597" text-anchor="middle" style="font:700 16px Arial,sans-serif;fill:#fff">AP normal → VAP actif → STA associée → adresse obtenue → données transférées</text>
</svg>
