<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Arbre de décision pour une architecture WLAN</title>
  <desc id="desc">Un arbre simple oriente vers Fat AP, Leader AP ou WAC plus Fit AP selon le nombre d’AP, le roaming, la centralisation et l’échelle multisite.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fcfd"/><stop offset="1" stop-color="#edf7fa"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#173b4d" flood-opacity=".15"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#5d7786"/></marker>
    <style>.title{font:700 30px Arial,sans-serif;fill:#102a43}.sub{font:400 16px Arial,sans-serif;fill:#486581}.q{font:700 17px Arial,sans-serif;fill:#102a43}.body{font:400 14px Arial,sans-serif;fill:#334e68}.white{font:700 20px Arial,sans-serif;fill:#fff}.label{font:700 13px Arial,sans-serif;fill:#486581}.small{font:400 12px Arial,sans-serif;fill:#486581}</style>
  </defs>
  <rect width="1200" height="650" rx="26" fill="url(#bg)"/>
  <text x="60" y="62" class="title">Choisir l’architecture à partir du besoin</text>
  <text x="60" y="92" class="sub">L’échelle, le roaming et la centralisation déterminent le modèle — pas l’inverse.</text>

  <g filter="url(#shadow)"><rect x="420" y="126" width="360" height="76" rx="18" fill="#fff" stroke="#b9d7df" stroke-width="2"/></g>
  <text x="600" y="156" text-anchor="middle" class="q">Un seul petit espace, peu de stations</text>
  <text x="600" y="181" text-anchor="middle" class="body">et aucun besoin de roaming ?</text>

  <path d="M420 164H236V250" fill="none" stroke="#5d7786" stroke-width="3" marker-end="url(#arrow)"/><text x="300" y="151" class="label">OUI</text>
  <path d="M600 202V250" fill="none" stroke="#5d7786" stroke-width="3" marker-end="url(#arrow)"/><text x="615" y="232" class="label">NON</text>

  <g filter="url(#shadow)"><rect x="80" y="256" width="310" height="126" rx="20" fill="#fff"/><rect x="80" y="256" width="310" height="47" rx="20" fill="#f2994a"/><rect x="80" y="282" width="310" height="21" fill="#f2994a"/></g>
  <text x="235" y="287" text-anchor="middle" class="white">Fat AP</text>
  <text x="235" y="329" text-anchor="middle" class="body">Autonome · simple · économique</text>
  <text x="235" y="354" text-anchor="middle" class="small">Boutique, café, micro-site</text>

  <g filter="url(#shadow)"><rect x="420" y="256" width="360" height="76" rx="18" fill="#fff" stroke="#b9d7df" stroke-width="2"/></g>
  <text x="600" y="286" text-anchor="middle" class="q">Plusieurs AP avec roaming, mais</text>
  <text x="600" y="311" text-anchor="middle" class="body">petite échelle et budget contrôlé ?</text>

  <path d="M420 294H366V438" fill="none" stroke="#5d7786" stroke-width="3" marker-end="url(#arrow)"/><text x="375" y="418" class="label">OUI</text>
  <path d="M600 332V408" fill="none" stroke="#5d7786" stroke-width="3" marker-end="url(#arrow)"/><text x="615" y="378" class="label">NON</text>

  <g filter="url(#shadow)"><rect x="210" y="444" width="310" height="126" rx="20" fill="#fff"/><rect x="210" y="444" width="310" height="47" rx="20" fill="#23a6a8"/><rect x="210" y="470" width="310" height="21" fill="#23a6a8"/></g>
  <text x="365" y="475" text-anchor="middle" class="white">Leader AP + Fit AP</text>
  <text x="365" y="517" text-anchor="middle" class="body">Gestion groupée · roaming · sans WAC</text>
  <text x="365" y="542" text-anchor="middle" class="small">Petite entreprise multi-AP</text>

  <g filter="url(#shadow)"><rect x="545" y="414" width="575" height="156" rx="20" fill="#fff"/><rect x="545" y="414" width="575" height="47" rx="20" fill="#4f72c4"/><rect x="545" y="440" width="575" height="21" fill="#4f72c4"/></g>
  <text x="833" y="445" text-anchor="middle" class="white">WAC + Fit AP</text>
  <text x="833" y="487" text-anchor="middle" class="body">Gestion centralisée · sécurité · extension à l’échelle</text>
  <text x="833" y="516" text-anchor="middle" class="body">Siège + agences : décider où sort le trafic et où placer les WAC</text>
  <text x="833" y="545" text-anchor="middle" class="small">Entreprise/campus moyen ou grand · réseau multisite</text>

  <rect x="60" y="598" width="1080" height="30" rx="15" fill="#153f59"/>
  <text x="600" y="619" text-anchor="middle" style="font:700 14px Arial,sans-serif;fill:#fff">Toujours vérifier : couverture · stations · roaming · filaire · WAN · chemin du trafic · exploitation</text>
</svg>

