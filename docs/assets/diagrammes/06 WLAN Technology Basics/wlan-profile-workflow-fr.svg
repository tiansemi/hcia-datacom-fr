<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Relations entre profils et ordre de configuration WLAN</title><desc id="desc">Le réseau et la mise en ligne des AP précèdent la création des profils réglementaire, SSID et sécurité. Ceux-ci alimentent le VAP profile lié au groupe AP et à ses radios.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fcfd"/><stop offset="1" stop-color="#edf7fa"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#102a43" flood-opacity=".13"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#527384"/></marker><style>.title{font:700 30px Arial,sans-serif;fill:#102a43}.sub{font:400 16px Arial,sans-serif;fill:#486581}.h{font:700 18px Arial,sans-serif;fill:#102a43}.body{font:400 13px Arial,sans-serif;fill:#334e68}.white{font:700 18px Arial,sans-serif;fill:#fff}.num{font:700 15px Arial,sans-serif;fill:#fff}</style></defs>
  <rect width="1200" height="650" rx="26" fill="url(#bg)"/><text x="60" y="62" class="title">Construire le service, puis l’appliquer aux radios</text><text x="60" y="92" class="sub">Les profils sont réutilisables : le VAP profile assemble le SSID, la sécurité, le VLAN et le transfert.</text>
  <g filter="url(#s)"><rect x="60" y="132" width="230" height="98" rx="18" fill="#fff" stroke="#b9d7df"/><circle cx="91" cy="160" r="18" fill="#4f72c4"/><text x="91" y="166" text-anchor="middle" class="num">1</text><text x="120" y="164" class="h">Connectivité</text><text x="85" y="198" class="body">VLAN · routage · DHCP</text></g>
  <path d="M290 181H354" stroke="#527384" stroke-width="4" marker-end="url(#a)"/>
  <g filter="url(#s)"><rect x="360" y="132" width="245" height="98" rx="18" fill="#fff" stroke="#b9d7df"/><circle cx="391" cy="160" r="18" fill="#4f72c4"/><text x="391" y="166" text-anchor="middle" class="num">2</text><text x="420" y="164" class="h">Mise en ligne AP</text><text x="385" y="198" class="body">Groupe · CAPWAP · admission</text></g>

  <g transform="translate(670 120)" filter="url(#s)"><rect width="470" height="270" rx="22" fill="#fff"/><rect width="470" height="52" rx="22" fill="#23a6a8"/><rect y="28" width="470" height="24" fill="#23a6a8"/><text x="235" y="34" text-anchor="middle" class="white">3 · Créer les profils</text><rect x="25" y="80" width="195" height="67" rx="13" fill="#effafa" stroke="#23a6a8"/><text x="122" y="106" text-anchor="middle" class="h">Regulatory domain</text><text x="122" y="130" text-anchor="middle" class="body">Pays · canaux · puissance</text><rect x="250" y="80" width="195" height="67" rx="13" fill="#effafa" stroke="#23a6a8"/><text x="347" y="106" text-anchor="middle" class="h">SSID profile</text><text x="347" y="130" text-anchor="middle" class="body">Nom visible du WLAN</text><rect x="25" y="172" width="195" height="67" rx="13" fill="#effafa" stroke="#23a6a8"/><text x="122" y="198" text-anchor="middle" class="h">Security profile</text><text x="122" y="222" text-anchor="middle" class="body">Accès · chiffrement</text><rect x="250" y="172" width="195" height="67" rx="13" fill="#fff7ed" stroke="#f2994a" stroke-width="2"/><text x="347" y="198" text-anchor="middle" class="h">VAP profile</text><text x="347" y="222" text-anchor="middle" class="body">Transfert · VLAN · références</text></g>
  <path d="M605 181H664" stroke="#527384" stroke-width="4" marker-end="url(#a)"/>
  <path d="M792 267v79h225v-79" fill="none" stroke="#f2994a" stroke-width="3" marker-end="url(#a)"/>

  <g transform="translate(360 438)" filter="url(#s)"><rect width="480" height="112" rx="20" fill="#fff" stroke="#4f72c4" stroke-width="2"/><circle cx="38" cy="34" r="18" fill="#4f72c4"/><text x="38" y="40" text-anchor="middle" class="num">4</text><text x="68" y="39" class="h">Lier le VAP profile au groupe AP</text><text x="68" y="70" class="body">Le groupe livre le même service à toutes les radios ciblées.</text><text x="68" y="94" class="body">Une configuration spécifique à l’AP reste prioritaire.</text></g>
  <path d="M905 390v70H846" fill="none" stroke="#527384" stroke-width="4" marker-end="url(#a)"/>
  <path d="M360 494H296" stroke="#527384" stroke-width="4" marker-end="url(#a)"/>
  <g transform="translate(60 438)" filter="url(#s)"><rect width="230" height="112" rx="20" fill="#153f59"/><text x="115" y="38" text-anchor="middle" class="white">5 · Vérifier</text><text x="115" y="69" text-anchor="middle" style="font:400 13px Arial,sans-serif;fill:#fff">AP → VAP → STA → IP</text><text x="115" y="92" text-anchor="middle" style="font:400 12px Arial,sans-serif;fill:#cfe8ef">display ap / vap / station</text></g>
  <rect x="60" y="590" width="1080" height="30" rx="15" fill="#dcebef"/><text x="600" y="611" text-anchor="middle" class="body">Le dépannage suit le même ordre que la construction : ne pas chercher le SSID tant que l’AP n’est pas en ligne.</text>
</svg>
