<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc"><title id="title">Leviers de performance WLAN</title><desc id="desc">QAM, OFDM, largeur de canal et MIMO augmentent la capacité tandis que CSMA CA organise l'accès partagé.</desc><rect width="1200" height="590" rx="28" fill="#f5fafc"/><text x="600" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#102a43">Quatre leviers de capacité, un canal toujours partagé</text><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#fff" stroke-width="3"><rect x="50" y="125" width="250" height="265" rx="24" stroke="#f2994a"/><rect x="335" y="125" width="250" height="265" rx="24" stroke="#4f72c4"/><rect x="620" y="125" width="250" height="265" rx="24" stroke="#23a6a8"/><rect x="905" y="125" width="250" height="265" rx="24" stroke="#153f59"/></g><text x="175" y="185" font-size="27" font-weight="700" fill="#e47a1f">QAM</text><text x="175" y="235" font-size="19" fill="#334e68">plus de bits</text><text x="175" y="272" font-size="19" fill="#334e68">par symbole</text><text x="175" y="335" font-size="18" fill="#486581">amplitude + phase</text><text x="460" y="185" font-size="27" font-weight="700" fill="#3d5da8">OFDM</text><text x="460" y="235" font-size="19" fill="#334e68">plusieurs</text><text x="460" y="272" font-size="19" fill="#334e68">sous-porteuses</text><text x="460" y="335" font-size="18" fill="#486581">orthogonales</text><text x="745" y="185" font-size="27" font-weight="700" fill="#128f91">Canal</text><text x="745" y="235" font-size="19" fill="#334e68">40 · 80 · 160</text><text x="745" y="272" font-size="19" fill="#334e68">jusqu'à 320 MHz</text><text x="745" y="335" font-size="18" fill="#486581">plus de spectre</text><text x="1030" y="185" font-size="27" font-weight="700" fill="#153f59">MIMO</text><text x="1030" y="235" font-size="19" fill="#334e68">plusieurs</text><text x="1030" y="272" font-size="19" fill="#334e68">flux spatiaux</text><text x="1030" y="335" font-size="18" fill="#486581">plusieurs antennes</text><rect x="270" y="440" width="660" height="90" rx="24" fill="#153f59"/><text x="600" y="479" font-size="23" font-weight="700" fill="#70e0d8">CSMA/CA organise l'accès au médium</text><text x="600" y="510" font-size="17" fill="#fff">écoute · IFS · backoff · trame · ACK</text></g></svg>
