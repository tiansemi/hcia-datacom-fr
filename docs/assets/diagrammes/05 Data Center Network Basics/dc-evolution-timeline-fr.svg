<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Évolution des data centers</title><desc id="desc">Une chronologie va du superordinateur au cloud et au calcul intelligent.</desc><rect width="1200" height="520" rx="28" fill="#f5fafc"/><text x="600" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#102a43">Du superordinateur au cloud et à l'IA</text><path d="M130 260h940" stroke="#8aa5b5" stroke-width="8"/><g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(155 260)"><circle r="36" fill="#23a6a8"/><text y="8" font-size="22" font-weight="700" fill="#fff">1940</text><text y="-78" font-size="21" font-weight="700" fill="#102a43">Superordinateur</text><text y="78" font-size="17" fill="#486581">un équipement</text></g><g transform="translate(450 260)"><circle r="36" fill="#4f72c4"/><text y="8" font-size="22" font-weight="700" fill="#fff">1960</text><text y="-78" font-size="21" font-weight="700" fill="#102a43">Serveurs regroupés</text><text y="78" font-size="17" fill="#486581">même salle</text></g><g transform="translate(745 260)"><circle r="36" fill="#f2994a"/><text y="8" font-size="22" font-weight="700" fill="#fff">1990</text><text y="-78" font-size="21" font-weight="700" fill="#102a43">Serveurs en réseau</text><text y="78" font-size="17" fill="#486581">client / serveur</text></g><g transform="translate(1040 260)"><circle r="36" fill="#153f59"/><text y="8" font-size="22" font-weight="700" fill="#fff">2010</text><text y="-78" font-size="21" font-weight="700" fill="#102a43">Cloud et IA</text><text y="78" font-size="17" fill="#486581">très grande échelle</text></g><text x="600" y="430" font-size="21" font-weight="700" fill="#334e68">Miniaturisation → réseau → virtualisation → services cloud → calcul intelligent</text></g></svg>
