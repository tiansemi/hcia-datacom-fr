<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Architecture dual-track de data center</title><desc id="desc">Les réseaux de calcul général et intelligent sont séparés au-dessus d'une infrastructure et d'une orchestration partagées.</desc><rect width="1200" height="600" rx="28" fill="#f5fafc"/><text x="600" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#102a43">Deux fabrics spécialisées, un data center coordonné</text><g font-family="Arial,sans-serif"><rect x="80" y="120" width="460" height="270" rx="28" fill="#fff" stroke="#4f72c4" stroke-width="3"/><text x="310" y="180" text-anchor="middle" font-size="27" font-weight="700" fill="#3d5da8">Calcul général</text><text x="310" y="228" text-anchor="middle" font-size="20" fill="#102a43">Web · bases · cloud</text><text x="310" y="282" text-anchor="middle" font-size="18" fill="#486581">Spine-leaf · M-LAG · VXLAN</text><text x="310" y="330" text-anchor="middle" font-size="18" fill="#486581">souplesse · isolation · disponibilité</text><rect x="660" y="120" width="460" height="270" rx="28" fill="#153f59"/><text x="890" y="180" text-anchor="middle" font-size="27" font-weight="700" fill="#70e0d8">Calcul intelligent</text><text x="890" y="228" text-anchor="middle" font-size="20" fill="#fff">IA · HPC · GPU</text><text x="890" y="282" text-anchor="middle" font-size="18" fill="#d9f1f2">Spine-leaf / dragonfly · PFC · ECN</text><text x="890" y="330" text-anchor="middle" font-size="18" fill="#d9f1f2">débit · zéro perte · faible latence</text><rect x="150" y="440" width="900" height="105" rx="24" fill="#e7f6f3" stroke="#23a6a8" stroke-width="2"/><text x="600" y="481" text-anchor="middle" font-size="22" font-weight="700" fill="#176b6d">Infrastructure et orchestration partagées</text><text x="600" y="519" text-anchor="middle" font-size="18" fill="#486581">bâtiment · énergie · refroidissement · planification des ressources</text><path d="M310 400v30M890 400v30" stroke="#658096" stroke-width="6"/><path d="M585 255h30" stroke="#d96b2b" stroke-width="5" stroke-dasharray="8 8"/><text x="600" y="416" text-anchor="middle" font-size="17" font-weight="700" fill="#b64e18">plans réseau séparés</text></g></svg>
