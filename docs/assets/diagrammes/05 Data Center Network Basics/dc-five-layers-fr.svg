<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Cinq niveaux d'un data center</title><desc id="desc">Les niveaux vont du bâtiment aux applications en passant par l'infrastructure, le matériel et les plateformes.</desc><rect width="1200" height="600" rx="28" fill="#f5fafc"/><text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#102a43">Du bâtiment aux applications</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="120" y="90" width="960" height="82" rx="18" fill="#153f59"/><text x="180" y="141" font-size="24" font-weight="700" fill="#70e0d8">L4</text><text x="620" y="141" font-size="23" fill="#fff">Applications et services métier</text><rect x="160" y="184" width="880" height="82" rx="18" fill="#2a6079"/><text x="215" y="235" font-size="24" font-weight="700" fill="#8ce9e1">L3</text><text x="620" y="235" font-size="22" fill="#fff">Virtualisation · cloud · bases de données · OS</text><rect x="200" y="278" width="800" height="82" rx="18" fill="#e8edff" stroke="#4f72c4" stroke-width="2"/><text x="255" y="329" font-size="24" font-weight="700" fill="#3d5da8">L2</text><text x="620" y="329" font-size="22" fill="#102a43">Calcul · stockage · réseau</text><rect x="240" y="372" width="720" height="82" rx="18" fill="#e7f6f3" stroke="#23a6a8" stroke-width="2"/><text x="295" y="423" font-size="24" font-weight="700" fill="#128f91">L1</text><text x="620" y="423" font-size="22" fill="#102a43">Alimentation · refroidissement · salle IT</text><rect x="280" y="466" width="640" height="82" rx="18" fill="#fff1df" stroke="#f2994a" stroke-width="2"/><text x="335" y="517" font-size="24" font-weight="700" fill="#e47a1f">L0</text><text x="620" y="517" font-size="22" fill="#102a43">Bâtiment · campus · raccordements</text></g></svg>
