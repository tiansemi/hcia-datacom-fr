<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Parcours HCIA-Datacom V2.0 en huit domaines</title><desc id="d">Une progression des fondations vers Ethernet, IP, services, data center, WLAN, exploitation et solution campus.</desc><rect width="1200" height="720" rx="28" fill="#eef8fa"/><g font-family="Segoe UI,Arial" font-size="29" font-weight="700" fill="#102a43"><text x="55" y="58">HCIA-Datacom V2.0</text><text x="355" y="58"> — progression officielle</text></g><path d="M150 180H1050M1050 180V510M1050 510H150" fill="none" stroke="#8ab4c7" stroke-width="8"/><g font-family="Segoe UI,Arial" text-anchor="middle"><g transform="translate(55 125)"><rect width="230" height="130" rx="20" fill="#153f59"/><text x="115" y="50" font-size="20" font-weight="700" fill="#fff">1. Fondations</text><text x="115" y="86" font-size="15" fill="#d9edf2">communication + VRP</text></g><g transform="translate(330 125)"><rect width="230" height="130" rx="20" fill="#4f72c4"/><text x="115" y="50" font-size="20" font-weight="700" fill="#fff">2. Ethernet</text><text x="115" y="86" font-size="15" fill="#fff">VLAN + STP + Eth-Trunk</text></g><g transform="translate(605 125)"><rect width="230" height="130" rx="20" fill="#4f72c4"/><text x="115" y="50" font-size="20" font-weight="700" fill="#fff">3. IP</text><text x="115" y="86" font-size="15" fill="#fff">IPv4/IPv6 + OSPF</text></g><g transform="translate(880 125)"><rect width="230" height="130" rx="20" fill="#f2994a"/><text x="115" y="50" font-size="20" font-weight="700" fill="#fff">4. Services</text><text x="115" y="86" font-size="15" fill="#fff">ACL + AAA + NAT</text></g><g transform="translate(880 445)"><rect width="230" height="130" rx="20" fill="#23a6a8"/><text x="115" y="50" font-size="20" font-weight="700" fill="#fff">5. Data center</text><text x="115" y="86" font-size="15" fill="#fff">architectures DCN</text></g><g transform="translate(605 445)"><rect width="230" height="130" rx="20" fill="#23a6a8"/><text x="115" y="50" font-size="20" font-weight="700" fill="#fff">6. WLAN</text><text x="115" y="86" font-size="15" fill="#fff">802.11 + WAC + Fit AP</text></g><g transform="translate(330 445)"><rect width="230" height="130" rx="20" fill="#167d80"/><text x="115" y="50" font-size="20" font-weight="700" fill="#fff">7. Exploitation</text><text x="115" y="86" font-size="15" fill="#fff">O&amp;M + automatisation</text></g><g transform="translate(55 445)"><rect width="230" height="130" rx="20" fill="#153f59"/><text x="115" y="50" font-size="20" font-weight="700" fill="#fff">8. Campus</text><text x="115" y="86" font-size="15" fill="#d9edf2">intégration de bout en bout</text></g></g><text x="600" y="655" text-anchor="middle" font-family="Segoe UI,Arial" font-size="19" font-weight="700" fill="#167d80">84 unités théoriques → 17 labs → preuves de maîtrise</text><text x="600" y="687" text-anchor="middle" font-family="Segoe UI,Arial" font-size="16" fill="#486581">Comprendre, configurer, vérifier, dépanner, intégrer</text></svg>
