<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc"><title id="title">Chaîne de communication radio WLAN</title><desc id="desc">L'information est codée, modulée, transmise dans l'air, puis démodulée et décodée.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#658096"/></marker></defs><rect width="1200" height="570" rx="28" fill="#f5fafc"/><text x="600" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#102a43">De l'information aux ondes, puis retour</text><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#fff" stroke-width="3"><rect x="35" y="190" width="150" height="120" rx="20" stroke="#23a6a8"/><rect x="230" y="190" width="160" height="120" rx="20" stroke="#4f72c4"/><rect x="435" y="190" width="160" height="120" rx="20" stroke="#f2994a"/><rect x="640" y="160" width="170" height="180" rx="26" stroke="#153f59"/><rect x="855" y="190" width="160" height="120" rx="20" stroke="#f2994a"/><rect x="1055" y="190" width="110" height="120" rx="20" stroke="#23a6a8"/></g><text x="110" y="260" font-size="21" font-weight="700" fill="#102a43">Source</text><text x="310" y="247" font-size="21" font-weight="700" fill="#102a43">Codage</text><text x="310" y="276" font-size="16" fill="#486581">efficacité + fiabilité</text><text x="515" y="260" font-size="21" font-weight="700" fill="#102a43">Modulation</text><text x="725" y="223" font-size="22" font-weight="700" fill="#102a43">Air</text><path d="M683 270q42-48 84 0q-42 48-84 0" fill="none" stroke="#23a6a8" stroke-width="6"/><text x="725" y="315" font-size="16" fill="#b64e18">interférences</text><text x="935" y="260" font-size="21" font-weight="700" fill="#102a43">Démodulation</text><text x="1110" y="247" font-size="20" font-weight="700" fill="#102a43">Décodage</text><text x="1110" y="276" font-size="16" fill="#486581">destination</text><g stroke="#658096" stroke-width="5" marker-end="url(#a)"><path d="M190 250h30"/><path d="M395 250h30"/><path d="M600 250h30"/><path d="M815 250h30"/><path d="M1020 250h25"/></g><text x="600" y="430" font-size="20" font-weight="700" fill="#334e68">L'interface air est le canal invisible entre émetteur et récepteur.</text><text x="600" y="475" font-size="18" fill="#486581">Fréquence · longueur d'onde · amplitude · phase</text></g></svg>
