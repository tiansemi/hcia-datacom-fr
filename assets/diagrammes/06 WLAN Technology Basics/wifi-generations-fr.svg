<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Générations Wi-Fi 4 à Wi-Fi 7</title><desc id="desc">Les générations augmentent modulation, largeur de canal, bandes et efficacité multi-utilisateur.</desc><rect width="1200" height="600" rx="28" fill="#f5fafc"/><text x="600" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#102a43">Wi-Fi 4 → Wi-Fi 7 : davantage de capacité et d'efficacité</text><g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(50 120)"><rect width="250" height="380" rx="25" fill="#fff" stroke="#8aa5b5" stroke-width="3"/><text x="125" y="58" font-size="27" font-weight="700" fill="#102a43">Wi-Fi 4</text><text x="125" y="94" font-size="17" fill="#486581">802.11n · 2009</text><text x="125" y="155" font-size="21" font-weight="700" fill="#3d5da8">2,4 / 5 GHz</text><text x="125" y="205" font-size="17" fill="#334e68">64-QAM · 40 MHz</text><text x="125" y="255" font-size="17" fill="#334e68">MIMO</text><text x="125" y="327" font-size="25" font-weight="700" fill="#102a43">600 Mbit/s</text></g><g transform="translate(335 120)"><rect width="250" height="380" rx="25" fill="#fff" stroke="#4f72c4" stroke-width="3"/><text x="125" y="58" font-size="27" font-weight="700" fill="#3d5da8">Wi-Fi 5</text><text x="125" y="94" font-size="17" fill="#486581">802.11ac · 2013–2015</text><text x="125" y="155" font-size="21" font-weight="700" fill="#3d5da8">5 GHz</text><text x="125" y="205" font-size="17" fill="#334e68">256-QAM · 160 MHz</text><text x="125" y="255" font-size="17" fill="#334e68">DL MU-MIMO</text><text x="125" y="327" font-size="25" font-weight="700" fill="#102a43">6,9 Gbit/s</text></g><g transform="translate(620 120)"><rect width="250" height="380" rx="25" fill="#fff" stroke="#23a6a8" stroke-width="3"/><text x="125" y="58" font-size="27" font-weight="700" fill="#128f91">Wi-Fi 6</text><text x="125" y="94" font-size="17" fill="#486581">802.11ax · 2019</text><text x="125" y="155" font-size="21" font-weight="700" fill="#128f91">2,4 / 5 GHz</text><text x="125" y="205" font-size="17" fill="#334e68">1024-QAM · 160 MHz</text><text x="125" y="255" font-size="17" fill="#334e68">OFDMA · UL/DL MU-MIMO</text><text x="125" y="327" font-size="25" font-weight="700" fill="#102a43">9,6 Gbit/s</text></g><g transform="translate(905 120)"><rect width="250" height="380" rx="25" fill="#153f59"/><text x="125" y="58" font-size="27" font-weight="700" fill="#70e0d8">Wi-Fi 7</text><text x="125" y="94" font-size="17" fill="#d9f1f2">802.11be · 2024</text><text x="125" y="155" font-size="21" font-weight="700" fill="#70e0d8">2,4 / 5 / 6 GHz</text><text x="125" y="205" font-size="17" fill="#fff">4096-QAM · 320 MHz</text><text x="125" y="255" font-size="17" fill="#fff">MRU · MLO</text><text x="125" y="327" font-size="25" font-weight="700" fill="#fff">23,05 Gbit/s</text></g><text x="600" y="555" font-size="17" font-weight="700" fill="#334e68">Débits maximaux théoriques du support, pas débits d'accès garantis.</text></g></svg>
