<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Comparaison des architectures WLAN Huawei</title>
  <desc id="desc">Trois cartes comparent WAC plus Fit AP, Fat AP et Leader AP selon le contrôle, la mise en réseau et l’échelle de déploiement.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbfd"/><stop offset="1" stop-color="#edf6fa"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#102a43" flood-opacity=".14"/></filter>
    <style>.title{font:700 30px Arial,sans-serif;fill:#102a43}.sub{font:400 16px Arial,sans-serif;fill:#486581}.cardh{font:700 22px Arial,sans-serif;fill:#fff}.h{font:700 17px Arial,sans-serif;fill:#102a43}.body{font:400 14px Arial,sans-serif;fill:#334e68}.small{font:400 12px Arial,sans-serif;fill:#486581}.pill{font:700 13px Arial,sans-serif;fill:#fff}</style>
  </defs>
  <rect width="1200" height="650" rx="26" fill="url(#bg)"/>
  <text x="60" y="62" class="title">Quel niveau de centralisation pour le WLAN ?</text>
  <text x="60" y="92" class="sub">La taille augmente de gauche à droite ; la gestion passe de l’autonomie au contrôle centralisé.</text>

  <g transform="translate(55 130)" filter="url(#shadow)">
    <rect width="335" height="420" rx="22" fill="#fff"/>
    <path d="M0 22Q0 0 22 0h291q22 0 22 22v68H0z" fill="#f2994a"/>
    <text x="167" y="42" text-anchor="middle" class="cardh">Fat AP</text>
    <text x="167" y="68" text-anchor="middle" class="pill">AUTONOME</text>
    <g transform="translate(116 112)"><rect width="104" height="54" rx="12" fill="#fff7ed" stroke="#f2994a" stroke-width="2"/><path d="M31 31q21-22 42 0M41 39q11-12 22 0" fill="none" stroke="#f2994a" stroke-width="4" stroke-linecap="round"/><circle cx="52" cy="45" r="3" fill="#f2994a"/></g>
    <text x="24" y="205" class="h">Contrôle</text><text x="24" y="230" class="body">Chaque AP se configure seul.</text>
    <text x="24" y="270" class="h">Atout</text><text x="24" y="295" class="body">Simple, rapide, économique.</text>
    <text x="24" y="335" class="h">Limite</text><text x="24" y="360" class="body">Peu évolutif, pas de pilotage global.</text>
    <rect x="24" y="382" width="287" height="25" rx="12" fill="#fff1e6"/><text x="167" y="400" text-anchor="middle" class="small">Très petit site · un ou peu d’AP</text>
  </g>

  <g transform="translate(433 130)" filter="url(#shadow)">
    <rect width="335" height="420" rx="22" fill="#fff"/>
    <path d="M0 22Q0 0 22 0h291q22 0 22 22v68H0z" fill="#23a6a8"/>
    <text x="167" y="42" text-anchor="middle" class="cardh">Leader AP</text>
    <text x="167" y="68" text-anchor="middle" class="pill">CENTRALISATION LÉGÈRE</text>
    <g transform="translate(47 112)"><circle cx="120" cy="25" r="27" fill="#127b80"/><text x="120" y="31" text-anchor="middle" class="pill">Leader</text><path d="M120 52v22M120 74H45M120 74h75" fill="none" stroke="#23a6a8" stroke-width="3"/><circle cx="45" cy="90" r="19" fill="#dff7f5" stroke="#23a6a8" stroke-width="2"/><circle cx="195" cy="90" r="19" fill="#dff7f5" stroke="#23a6a8" stroke-width="2"/></g>
    <text x="24" y="238" class="h">Contrôle</text><text x="24" y="263" class="body">Un Fat AP pilote plusieurs Fit AP.</text>
    <text x="24" y="303" class="h">Atout</text><text x="24" y="328" class="body">Gestion unifiée et roaming sans WAC.</text>
    <text x="24" y="368" class="h">Limite</text><text x="24" y="393" class="body">Capacité du leader plus restreinte.</text>
    <rect x="24" y="407" width="287" height="25" rx="12" fill="#e7f9f7"/><text x="167" y="425" text-anchor="middle" class="small">Micro et petite entreprise</text>
  </g>

  <g transform="translate(811 130)" filter="url(#shadow)">
    <rect width="335" height="420" rx="22" fill="#fff"/>
    <path d="M0 22Q0 0 22 0h291q22 0 22 22v68H0z" fill="#4f72c4"/>
    <text x="167" y="42" text-anchor="middle" class="cardh">WAC + Fit AP</text>
    <text x="167" y="68" text-anchor="middle" class="pill">CONTRÔLE CENTRAL</text>
    <g transform="translate(47 112)"><rect x="77" width="86" height="43" rx="10" fill="#4f72c4"/><text x="120" y="27" text-anchor="middle" class="pill">WAC</text><path d="M120 43v31M120 74H35M120 74h85" fill="none" stroke="#4f72c4" stroke-width="3"/><circle cx="35" cy="90" r="19" fill="#e7edff" stroke="#4f72c4" stroke-width="2"/><circle cx="120" cy="90" r="19" fill="#e7edff" stroke="#4f72c4" stroke-width="2"/><circle cx="205" cy="90" r="19" fill="#e7edff" stroke="#4f72c4" stroke-width="2"/></g>
    <text x="24" y="238" class="h">Contrôle</text><text x="24" y="263" class="body">WAC gère et configure les Fit AP.</text>
    <text x="24" y="303" class="h">Atout</text><text x="24" y="328" class="body">Sécurité, extension et upgrades unifiés.</text>
    <text x="24" y="368" class="h">Limite</text><text x="24" y="393" class="body">Conception et exploitation plus exigeantes.</text>
    <rect x="24" y="407" width="287" height="25" rx="12" fill="#edf1ff"/><text x="167" y="425" text-anchor="middle" class="small">Entreprise ou campus moyen/grand</text>
  </g>

  <path d="M190 591H1010" stroke="#c4d7df" stroke-width="7" stroke-linecap="round"/>
  <circle cx="190" cy="591" r="10" fill="#f2994a"/><circle cx="600" cy="591" r="10" fill="#23a6a8"/><circle cx="1010" cy="591" r="10" fill="#4f72c4"/>
  <text x="190" y="620" text-anchor="middle" class="small">Autonomie</text><text x="600" y="620" text-anchor="middle" class="small">Gestion locale groupée</text><text x="1010" y="620" text-anchor="middle" class="small">Centralisation à l’échelle</text>
</svg>

