<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Topologie et plan de données du lab WAC plus Fit AP</title><desc id="desc">Un WAC connecté en ligne à un switch et un Fit AP. Le VLAN 100 porte la gestion et CAPWAP, le VLAN 101 dessert les stations par transfert tunnel.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fcfd"/><stop offset="1" stop-color="#edf7fa"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#102a43" flood-opacity=".14"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#4f72c4"/></marker><style>.title{font:700 30px Arial,sans-serif;fill:#102a43}.sub{font:400 16px Arial,sans-serif;fill:#486581}.h{font:700 19px Arial,sans-serif;fill:#102a43}.body{font:400 14px Arial,sans-serif;fill:#334e68}.small{font:400 12px Arial,sans-serif;fill:#486581}.white{font:700 15px Arial,sans-serif;fill:#fff}.mono{font:600 13px Consolas,monospace;fill:#334e68}</style></defs>
  <rect width="1200" height="650" rx="26" fill="url(#bg)"/><text x="60" y="62" class="title">Lab centralisé : Layer 2 in-path et transfert par tunnel</text><text x="60" y="92" class="sub">Le WAC centralise l’adressage, le contrôle CAPWAP et les données du SSID « employee ».</text>
  <rect x="50" y="128" width="1100" height="370" rx="24" fill="#fff" stroke="#c6dde5" stroke-width="2" filter="url(#s)"/>
  <g transform="translate(100 225)"><rect width="210" height="116" rx="18" fill="#eef2ff" stroke="#4f72c4" stroke-width="2"/><rect width="210" height="38" rx="18" fill="#4f72c4"/><rect y="20" width="210" height="18" fill="#4f72c4"/><text x="105" y="26" text-anchor="middle" class="white">WAC</text><text x="22" y="70" class="mono">Vlanif100 10.1.100.1/24</text><text x="22" y="94" class="mono">Vlanif101 10.1.101.1/24</text></g>
  <g transform="translate(480 235)"><rect width="190" height="95" rx="18" fill="#effafa" stroke="#23a6a8" stroke-width="2"/><text x="95" y="36" text-anchor="middle" class="h">Switch</text><path d="M35 60h120M45 71h100" stroke="#23a6a8" stroke-width="5" stroke-linecap="round"/></g>
  <g transform="translate(840 215)"><rect width="210" height="135" rx="18" fill="#fff7ed" stroke="#f2994a" stroke-width="2"/><text x="105" y="34" text-anchor="middle" class="h">Fit AP</text><path d="M60 77q45-50 90 0M78 91q27-30 54 0M101 105h8" fill="none" stroke="#f2994a" stroke-width="6" stroke-linecap="round"/></g>
  <path d="M310 283H480M670 283H840" stroke="#4f72c4" stroke-width="5" marker-end="url(#a)"/><text x="395" y="265" text-anchor="middle" class="small">in-path</text><text x="755" y="265" text-anchor="middle" class="small">VLAN 100</text>
  <path d="M205 360C400 455 760 455 945 365" fill="none" stroke="#f2994a" stroke-width="5" stroke-dasharray="11 8" marker-end="url(#a)"/><text x="575" y="445" text-anchor="middle" class="h">Données VLAN 101 encapsulées dans le tunnel CAPWAP</text>
  <g transform="translate(880 520)"><circle cx="50" cy="34" r="22" fill="#23a6a8"/><path d="M33 36q17-18 34 0M40 43q10-10 20 0" fill="none" stroke="#fff" stroke-width="3"/><rect x="22" y="62" width="56" height="34" rx="7" fill="#dff7f5" stroke="#23a6a8" stroke-width="2"/><text x="50" y="118" text-anchor="middle" class="small">STA 10.1.101.x</text></g>
  <path d="M945 350v165" stroke="#23a6a8" stroke-width="3" marker-end="url(#a)"/>
  <g transform="translate(80 530)"><rect width="690" height="78" rx="16" fill="#153f59"/><text x="25" y="30" style="font:700 15px Arial,sans-serif;fill:#fff">Plan de service</text><text x="25" y="56" style="font:400 13px Arial,sans-serif;fill:#fff">Groupe ap-group1 · SSID employee · tunnel forwarding · sécurité WPA/WPA2-PSK + AES</text></g>
</svg>
