<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Topologie du lab Eth-Trunk</title><desc id="desc">Trois liens GE parallèles entre S1 et S2 sont regroupés dans Eth-Trunk1 ; deux deviennent actifs et un reste en secours.</desc>
