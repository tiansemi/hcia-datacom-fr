  <g font-family="Segoe UI,Arial" font-size="16" font-weight="700"><text x="420" y="202" fill="#b56a22">GE1/0/10 — secours</text><text x="420" y="252" fill="#167d80">GE1/0/11 — actif</text><text x="420" y="302" fill="#167d80">GE1/0/12 — actif</text></g>
