  <rect width="1200" height="520" rx="28" fill="url(#bg)"/><text x="55" y="58" font-family="Segoe UI,Arial" font-size="29" font-weight="700" fill="#102a43">Lab 04 — Eth-Trunk1 entre S1 et S2</text><text x="55" y="90" font-family="Segoe UI,Arial" font-size="17" fill="#486581">Trois liens physiques, une interface logique, deux membres actifs et un secours</text>
  <g filter="url(#s)"><rect x="85" y="180" width="210" height="170" rx="24" fill="#153f59"/><rect x="905" y="180" width="210" height="170" rx="24" fill="#153f59"/></g><g font-family="Segoe UI,Arial" text-anchor="middle" fill="#fff"><text x="190" y="252" font-size="34" font-weight="700">S1</text><text x="190" y="290" font-size="17">Actor LACP</text><text x="1010" y="252" font-size="34" font-weight="700">S2</text><text x="1010" y="290" font-size="17">Partner</text></g>
