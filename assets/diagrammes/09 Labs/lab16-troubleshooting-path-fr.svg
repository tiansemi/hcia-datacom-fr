<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Parcours de dépannage du lab 16</title><desc id="d">Quatre cartes relient symptômes, points de contrôle, causes et preuves finales.</desc><rect width="1200" height="560" rx="28" fill="#eef8fa"/><text x="55" y="58" font-family="Segoe UI,Arial" font-size="29" font-weight="700" fill="#102a43">Lab 16 — Du symptôme à la preuve</text><path d="M165 280H1035" stroke="#8ab4c7" stroke-width="6"/><g font-family="Segoe UI,Arial" text-anchor="middle"><g transform="translate(55 145)"><rect width="240" height="270" rx="22" fill="#153f59"/><text x="120" y="55" font-size="21" font-weight="700" fill="#fff">DHCP filaire</text><text x="120" y="105" font-size="16" fill="#d9edf2">Vlanif101 shutdown</text><text x="120" y="155" font-size="16" fill="#d9edf2">undo shutdown</text><text x="120" y="220" font-size="16" font-weight="700" fill="#8ee3dc">Bail + ping</text></g><g transform="translate(340 145)"><rect width="240" height="270" rx="22" fill="#4f72c4"/><text x="120" y="55" font-size="21" font-weight="700" fill="#fff">Routage</text><text x="120" y="105" font-size="16" fill="#fff">Loopback non annoncée</text><text x="120" y="155" font-size="16" fill="#fff">network OSPF</text><text x="120" y="220" font-size="16" font-weight="700" fill="#fff">Route + ping</text></g><g transform="translate(625 145)"><rect width="240" height="270" rx="22" fill="#23a6a8"/><text x="120" y="55" font-size="21" font-weight="700" fill="#fff">AP offline</text><text x="120" y="105" font-size="16" fill="#fff">MAC non autorisée</text><text x="120" y="155" font-size="16" fill="#fff">Importer AP1</text><text x="120" y="220" font-size="16" font-weight="700" fill="#fff">État nor</text></g><g transform="translate(910 145)"><rect width="240" height="270" rx="22" fill="#f2994a"/><text x="120" y="55" font-size="21" font-weight="700" fill="#fff">SSID invisible</text><text x="120" y="105" font-size="16" fill="#fff">Profil non lié</text><text x="120" y="155" font-size="16" fill="#fff">Lier SSID au VAP</text><text x="120" y="220" font-size="16" font-weight="700" fill="#fff">VAP correct</text></g></g><text x="600" y="500" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" fill="#486581">Observer → localiser → corriger une cause → retester → conserver la preuve</text></svg>
