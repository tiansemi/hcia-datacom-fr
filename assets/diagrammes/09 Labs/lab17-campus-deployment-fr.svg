<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Architecture fonctionnelle du campus du lab 17</title><desc id="d">R1, Core1, WAC1, commutateurs d’accès, AP et terminaux, accompagnés de l’ordre de déploiement.</desc><rect width="1200" height="620" rx="28" fill="#eef8fa"/><g font-family="Segoe UI,Arial" font-size="29" font-weight="700" fill="#102a43"><text x="55" y="58">Lab 17</text><text x="145" y="58"> — Campus intégré</text></g><g stroke="#4f72c4" stroke-width="7" fill="none"><path d="M600 180V275M600 275H285V385M600 275H915V385M600 275V385"/><path d="M600 180H970V275"/></g><g font-family="Segoe UI,Arial" text-anchor="middle"><rect x="500" y="90" width="200" height="90" rx="18" fill="#153f59"/><text x="600" y="145" font-size="26" font-weight="700" fill="#fff">Core1</text><rect x="870" y="90" width="200" height="90" rx="18" fill="#f2994a"/><text x="970" y="145" font-size="26" font-weight="700" fill="#fff">R1 + NAT</text><rect x="185" y="385" width="200" height="100" rx="18" fill="#4f72c4"/><text x="285" y="430" font-size="24" font-weight="700" fill="#fff">ACC1 / ACC2</text><text x="285" y="458" font-size="15" fill="#fff">PC2 — VLAN 101</text><rect x="500" y="385" width="200" height="100" rx="18" fill="#23a6a8"/><text x="600" y="430" font-size="24" font-weight="700" fill="#fff">WAC1</text><text x="600" y="458" font-size="15" fill="#fff">CAPWAP</text><rect x="815" y="385" width="200" height="100" rx="18" fill="#23a6a8"/><text x="915" y="430" font-size="24" font-weight="700" fill="#fff">AP1 + PC1</text><text x="915" y="458" font-size="15" fill="#fff">SSID — VLAN 100</text></g><text x="600" y="552" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" font-weight="700" fill="#167d80">VLAN → STP → IP → DHCP → OSPF → WLAN → NAT → SSH → sauvegarde</text><text x="600" y="585" text-anchor="middle" font-family="Segoe UI,Arial" font-size="16" fill="#486581">Valider chaque dépendance avant d’activer le service suivant</text></svg>
