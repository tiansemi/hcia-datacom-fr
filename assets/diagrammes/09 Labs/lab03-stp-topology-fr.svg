<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Topologie redondante du lab STP</title><desc id="desc">Quatre commutateurs reliés par huit liens physiques afin d’observer les rôles STP et les chemins de secours.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fcfd"/><stop offset="1" stop-color="#eaf6f8"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#102a43" flood-opacity=".13"/></filter></defs>
  <rect width="1200" height="650" rx="28" fill="url(#bg)"/><text x="55" y="58" font-family="Segoe UI,Arial" font-size="29" font-weight="700" fill="#102a43">Lab 03 — Topologie redondante STP/RSTP</text><text x="55" y="90" font-family="Segoe UI,Arial" font-size="17" fill="#486581">Les ports bloqués suppriment les boucles tout en conservant des chemins de secours</text>
  <g stroke="#4f72c4" stroke-width="5" fill="none"><path d="M320 210H880"/><path d="M320 235H880"/><path d="M320 250V480"/><path d="M880 250V480"/><path d="M320 480H880"/><path d="M320 505H880"/><path d="M320 250L880 480"/><path d="M880 250L320 480"/></g>
  <g filter="url(#s)" font-family="Segoe UI,Arial" text-anchor="middle"><g fill="#153f59"><rect x="235" y="155" width="170" height="95" rx="18"/><rect x="795" y="155" width="170" height="95" rx="18"/><rect x="235" y="455" width="170" height="95" rx="18"/><rect x="795" y="455" width="170" height="95" rx="18"/></g><g fill="#fff" font-size="25" font-weight="700"><text x="320" y="212">S1</text><text x="880" y="212">S2</text><text x="320" y="512">S3</text><text x="880" y="512">S4</text></g></g>
  <g font-family="Segoe UI,Arial" font-size="14" fill="#486581"><text x="515" y="201">GE1/0/11</text><text x="515" y="257">GE1/0/12</text><text x="160" y="365">GE1/0/13 ↔ GE1/0/1</text><text x="920" y="365">GE1/0/14 ↔ GE1/0/2</text><text x="510" y="469">GE1/0/3</text><text x="510" y="535">liaison parallèle</text></g>
  <rect x="80" y="580" width="1040" height="42" rx="14" fill="#fff"/><text x="600" y="607" text-anchor="middle" font-family="Segoe UI,Arial" font-size="16" fill="#486581">S1 racine principale • S2 racine secondaire • coût de S4 GE1/0/1 augmenté pour préférer GE1/0/2</text>
