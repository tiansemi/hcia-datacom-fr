  <path d="M415 280H785" stroke="#f2994a" stroke-width="8" stroke-dasharray="16 12"/><circle cx="415" cy="280" r="10" fill="#f2994a"/><circle cx="785" cy="280" r="10" fill="#f2994a"/><rect x="500" y="230" width="200" height="55" rx="18" fill="#fff" stroke="#f2994a" stroke-width="2"/><text x="600" y="265" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#153f59">Câble console</text><text x="935" y="205" text-anchor="middle" font-family="Segoe UI,Arial" font-size="16" fill="#486581">Port console</text>
