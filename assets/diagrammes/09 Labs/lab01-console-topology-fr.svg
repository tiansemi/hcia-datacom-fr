  <rect width="1200" height="520" rx="28" fill="url(#bg)"/><text x="60" y="62" font-family="Segoe UI,Arial" font-size="30" font-weight="700" fill="#102a43">Lab 01 — Accès console hors bande</text><text x="60" y="94" font-family="Segoe UI,Arial" font-size="17" fill="#486581">Initialiser le routeur sans dépendre de sa configuration réseau</text>
