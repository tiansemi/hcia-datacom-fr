<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Liaison des composants AAA par un domaine</title><desc id="desc">Le nom utilisateur et domaine sélectionne un domaine qui associe schémas, serveur et informations d'autorisation.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#edf7f8"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#54738b"/></marker></defs><rect width="1200" height="600" rx="28" fill="url(#bg)"/><text x="600" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#102a43">Le domaine sélectionne la politique AAA</text><g font-family="Arial,sans-serif"><rect x="55" y="225" width="260" height="125" rx="22" fill="#fff" stroke="#23a6a8" stroke-width="3"/><text x="185" y="278" text-anchor="middle" font-size="25" font-weight="700" fill="#102a43">alice@datacom</text><text x="185" y="316" text-anchor="middle" font-size="19" fill="#486581">utilisateur @ domaine</text><path d="M320 287h135" stroke="#54738b" stroke-width="5" marker-end="url(#arrow)"/><rect x="470" y="185" width="280" height="205" rx="28" fill="#153f59"/><text x="610" y="247" text-anchor="middle" font-size="29" font-weight="700" fill="#fff">Domaine</text><text x="610" y="291" text-anchor="middle" font-size="27" fill="#70e0d8">datacom</text><text x="610" y="337" text-anchor="middle" font-size="18" fill="#d9f1f2">point d'association</text><path d="M755 287h105" stroke="#54738b" stroke-width="5" marker-end="url(#arrow)"/><rect x="875" y="88" width="270" height="100" rx="18" fill="#fff" stroke="#23a6a8" stroke-width="3"/><text x="1010" y="130" text-anchor="middle" font-size="22" font-weight="700" fill="#102a43">Schémas AAA</text><text x="1010" y="160" text-anchor="middle" font-size="17" fill="#486581">auth. · autor. · accounting</text><rect x="875" y="237" width="270" height="100" rx="18" fill="#fff" stroke="#f2994a" stroke-width="3"/><text x="1010" y="279" text-anchor="middle" font-size="22" font-weight="700" fill="#102a43">Modèle serveur</text><text x="1010" y="309" text-anchor="middle" font-size="17" fill="#486581">RADIUS / HWTACACS</text><rect x="875" y="386" width="270" height="100" rx="18" fill="#fff" stroke="#4f72c4" stroke-width="3"/><text x="1010" y="428" text-anchor="middle" font-size="22" font-weight="700" fill="#102a43">Droits du domaine</text><text x="1010" y="458" text-anchor="middle" font-size="17" fill="#486581">attributs complémentaires</text><path d="M800 287v-149h65M800 287h65M800 287v149h65" fill="none" stroke="#54738b" stroke-width="4" marker-end="url(#arrow)"/><text x="600" y="544" text-anchor="middle" font-size="20" fill="#334e68">Sans domaine explicite : default_admin pour un administrateur, default pour un utilisateur ordinaire</text></g></svg>
