<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Interprétation d'une wildcard ACL</title><desc id="desc">Le zéro impose une correspondance exacte, le un ignore le bit. Exemples pour un hôte, un sous-réseau et les adresses impaires.</desc><defs><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#12324f" flood-opacity=".12"/></filter><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#12324f}.t{font-size:46px;font-weight:760}.st{font-size:22px;fill:#526e87}.h{font-size:25px;font-weight:750}.b{font-size:18px}.bit{font-size:26px;font-weight:760}.w{fill:#fff}</style></defs><rect width="1600" height="900" rx="38" fill="#f7fafc"/><text x="800" y="75" text-anchor="middle" class="t">Wildcard : 0 vérifie, 1 ignore</text><text x="800" y="115" text-anchor="middle" class="st">Les bits peuvent être non contigus, contrairement à un masque de sous-réseau</text><g filter="url(#s)"><rect x="80" y="210" width="1440" height="190" rx="30" fill="#fff" stroke="#d4e4ef" stroke-width="2"/><rect x="80" y="450" width="430" height="260" rx="30" fill="#1c70b0"/><rect x="585" y="450" width="430" height="260" rx="30" fill="#10a6a0"/><rect x="1090" y="450" width="430" height="260" rx="30" fill="#7d56b3"/></g><text x="250" y="280" class="h">Adresse : 192.168.1.</text><g><rect x="510" y="245" width="80" height="80" rx="14" fill="#e7f2fa"/><rect x="600" y="245" width="80" height="80" rx="14" fill="#e7f2fa"/><rect x="690" y="245" width="80" height="80" rx="14" fill="#e7f2fa"/><rect x="780" y="245" width="80" height="80" rx="14" fill="#e7f2fa"/><rect x="870" y="245" width="80" height="80" rx="14" fill="#fff1d5"/><rect x="960" y="245" width="80" height="80" rx="14" fill="#fff1d5"/><rect x="1050" y="245" width="80" height="80" rx="14" fill="#fff1d5"/><rect x="1140" y="245" width="80" height="80" rx="14" fill="#1c70b0"/></g><text x="550" y="296" text-anchor="middle" class="bit">x</text><text x="640" y="296" text-anchor="middle" class="bit">x</text><text x="730" y="296" text-anchor="middle" class="bit">x</text><text x="820" y="296" text-anchor="middle" class="bit">x</text><text x="910" y="296" text-anchor="middle" class="bit">x</text><text x="1000" y="296" text-anchor="middle" class="bit">x</text><text x="1090" y="296" text-anchor="middle" class="bit">x</text><text x="1180" y="296" text-anchor="middle" class="bit w">1</text><text x="1340" y="278" text-anchor="middle" class="h">0.0.0.254</text><text x="1340" y="318" text-anchor="middle" class="b">impaires du /24</text><text x="295" y="520" text-anchor="middle" class="h w">Hôte exact</text><text x="295" y="575" text-anchor="middle" class="b w">192.168.1.1 0</text><text x="295" y="630" text-anchor="middle" class="b w">tous les bits contrôlés</text><text x="800" y="520" text-anchor="middle" class="h w">Sous-réseau /24</text><text x="800" y="575" text-anchor="middle" class="b w">192.168.1.0 0.0.0.255</text><text x="800" y="630" text-anchor="middle" class="b w">dernier octet ignoré</text><text x="1305" y="520" text-anchor="middle" class="h w">Toutes les adresses</text><text x="1305" y="575" text-anchor="middle" class="b w">any</text><text x="1305" y="630" text-anchor="middle" class="b w">255.255.255.255</text><rect x="360" y="790" width="880" height="62" rx="31" fill="#e8f1f7"/><text x="800" y="829" text-anchor="middle" class="h">La wildcard décrit une comparaison, pas un réseau à configurer</text></svg>
