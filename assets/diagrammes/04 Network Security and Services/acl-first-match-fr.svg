<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Première correspondance dans une ACL</title><desc id="desc">Un paquet est comparé aux règles par ID croissant et le traitement s'arrête dès qu'une règle correspond.</desc><defs><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#12324f" flood-opacity=".12"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#5a7891"/></marker><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#12324f}.t{font-size:46px;font-weight:760}.st{font-size:22px;fill:#526e87}.h{font-size:24px;font-weight:750}.b{font-size:18px}.w{fill:#fff}</style></defs><rect width="1600" height="900" rx="38" fill="#f7fafc"/><text x="800" y="75" text-anchor="middle" class="t">La première règle correspondante gagne</text><text x="800" y="115" text-anchor="middle" class="st">En ordre config, les Rule ID sont examinés du plus petit au plus grand</text><path d="M315 400H410 M690 400H785 M1065 400H1160 M1440 400H1510" stroke="#5a7891" stroke-width="8" marker-end="url(#a)"/><g filter="url(#s)"><rect x="70" y="300" width="260" height="200" rx="28" fill="#fff" stroke="#d4e4ef" stroke-width="2"/><rect x="410" y="270" width="300" height="260" rx="28" fill="#1c70b0"/><rect x="785" y="270" width="300" height="260" rx="28" fill="#10a6a0"/><rect x="1160" y="270" width="300" height="260" rx="28" fill="#7d56b3"/></g><text x="200" y="375" text-anchor="middle" class="h">Paquet source</text><text x="200" y="420" text-anchor="middle" class="b">192.168.1.10</text><text x="560" y="340" text-anchor="middle" class="h w">Rule 5</text><text x="560" y="390" text-anchor="middle" class="b w">deny 192.168.1.0/24</text><text x="560" y="450" text-anchor="middle" class="h w">correspond</text><text x="935" y="340" text-anchor="middle" class="h w">Rule 10</text><text x="935" y="390" text-anchor="middle" class="b w">permit 192.168.1.10</text><text x="935" y="450" text-anchor="middle" class="h w">jamais évaluée</text><text x="1310" y="340" text-anchor="middle" class="h w">Rule 15</text><text x="1310" y="390" text-anchor="middle" class="b w">permit any</text><text x="1310" y="450" text-anchor="middle" class="h w">jamais évaluée</text><rect x="370" y="650" width="860" height="125" rx="32" fill="#fff1d5"/><text x="800" y="700" text-anchor="middle" class="h">Pour autoriser l'exception, placez l'hôte exact avant le /24 général</text><text x="800" y="745" text-anchor="middle" class="b">Une règle plus générale trop tôt masque toutes les règles plus précises suivantes.</text></svg>
