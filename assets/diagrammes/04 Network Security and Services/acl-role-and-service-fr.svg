<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Rôle d'une ACL et du module de service</title><desc id="desc">Le paquet traverse les règles ACL, produit un résultat de correspondance puis un module de service applique le traitement final.</desc><defs><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#12324f" flood-opacity=".12"/></filter><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5 0 11Z" fill="#5a7891"/></marker><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#12324f}.t{font-size:46px;font-weight:760}.st{font-size:22px;fill:#526e87}.h{font-size:25px;font-weight:750}.b{font-size:18px}.w{fill:#fff}</style></defs><rect width="1600" height="900" rx="38" fill="#f7fafc"/><text x="800" y="75" text-anchor="middle" class="t">L'ACL reconnaît ; le module de service agit</text><text x="800" y="115" text-anchor="middle" class="st">Une ACL non invoquée ne modifie aucun trafic</text><path d="M350 420H500 M840 420H990 M1330 420H1450" stroke="#5a7891" stroke-width="9" marker-end="url(#a)"/><g filter="url(#s)"><rect x="80" y="300" width="290" height="240" rx="30" fill="#fff" stroke="#d4e4ef" stroke-width="2"/><rect x="500" y="245" width="360" height="350" rx="30" fill="#1c70b0"/><rect x="990" y="245" width="360" height="350" rx="30" fill="#10a6a0"/><rect x="1450" y="320" width="100" height="200" rx="28" fill="#7d56b3"/></g><text x="225" y="380" text-anchor="middle" class="h">Paquet</text><text x="225" y="425" text-anchor="middle" class="b">source · destination</text><text x="225" y="460" text-anchor="middle" class="b">protocole · port</text><text x="680" y="320" text-anchor="middle" class="h w">ACL ordonnée</text><text x="680" y="375" text-anchor="middle" class="b w">règle 5</text><text x="680" y="420" text-anchor="middle" class="b w">règle 10</text><text x="680" y="465" text-anchor="middle" class="b w">première correspondance</text><text x="680" y="520" text-anchor="middle" class="h w">permit / deny / aucune</text><text x="1170" y="320" text-anchor="middle" class="h w">Module de service</text><text x="1170" y="375" text-anchor="middle" class="b w">MQC · Telnet · FTP</text><text x="1170" y="420" text-anchor="middle" class="b w">QoS · autre fonction</text><text x="1170" y="500" text-anchor="middle" class="h w">traitement final</text><text x="1500" y="380" text-anchor="middle" class="h w" transform="rotate(90 1500 380)">Effet</text><rect x="270" y="700" width="1060" height="100" rx="30" fill="#e8f1f7"/><text x="800" y="742" text-anchor="middle" class="h">Toujours documenter : règle + service appelant + interface + direction</text><text x="800" y="777" text-anchor="middle" class="b">Le mot permit n'a de sens opérationnel qu'avec le contexte d'invocation.</text></svg>
