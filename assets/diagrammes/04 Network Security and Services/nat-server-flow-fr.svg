<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc"><title id="title">Flux NAT Server</title><desc id="desc">Une adresse et un port publics sont traduits vers l'adresse et le port d'un serveur privé.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fafcff"/><stop offset="1" stop-color="#eef8f7"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#e47a1f"/></marker></defs><rect width="1200" height="570" rx="28" fill="url(#bg)"/><text x="600" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#102a43">NAT Server publie un service interne</text><g font-family="Arial,sans-serif"><rect x="55" y="165" width="250" height="200" rx="24" fill="#fff" stroke="#4f72c4" stroke-width="3"/><text x="180" y="222" text-anchor="middle" font-size="24" font-weight="700" fill="#102a43">Client Internet</text><text x="180" y="269" text-anchor="middle" font-size="20" fill="#3d5da8">200.1.2.3:2474</text><text x="180" y="314" text-anchor="middle" font-size="17" fill="#486581">initie la connexion</text><rect x="465" y="115" width="270" height="300" rx="30" fill="#153f59"/><text x="600" y="179" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">NAT Server</text><rect x="505" y="225" width="190" height="86" rx="15" fill="#2a6079"/><text x="600" y="260" text-anchor="middle" font-size="17" fill="#d9f1f2">1.1.1.1:8080</text><text x="600" y="291" text-anchor="middle" font-size="18" font-weight="700" fill="#70e0d8">→ 192.168.1.1:80</text><text x="600" y="359" text-anchor="middle" font-size="17" fill="#d9f1f2">association persistante</text><rect x="895" y="165" width="250" height="200" rx="24" fill="#fff" stroke="#23a6a8" stroke-width="3"/><text x="1020" y="222" text-anchor="middle" font-size="24" font-weight="700" fill="#102a43">Serveur privé</text><text x="1020" y="269" text-anchor="middle" font-size="20" fill="#128f91">192.168.1.1:80</text><text x="1020" y="314" text-anchor="middle" font-size="17" fill="#486581">service HTTP</text><path d="M310 265h140M750 265h130" stroke="#e47a1f" stroke-width="6" marker-end="url(#a)"/><text x="600" y="482" text-anchor="middle" font-size="20" fill="#334e68">La réponse suit la session inverse et reprend l'identité publique.</text><text x="600" y="524" text-anchor="middle" font-size="19" font-weight="700" fill="#b95c17">Publier uniquement le protocole et le port nécessaires.</text></g></svg>
