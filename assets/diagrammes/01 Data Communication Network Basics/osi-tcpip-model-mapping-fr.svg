<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Correspondance entre les modèles OSI, TCP/IP et TCP/IP équivalent</title>
  <desc id="desc">Comparaison des sept couches OSI, des quatre couches TCP/IP et des cinq couches du modèle équivalent utilisé par Huawei.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef5fb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#16324f" flood-opacity=".13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#7890a8"/></marker>
    <style>
      .title{font:700 46px Arial,sans-serif;fill:#13293d}.subtitle{font:400 23px Arial,sans-serif;fill:#526a80}
      .head{font:700 27px Arial,sans-serif;fill:#fff}.layer{font:700 22px Arial,sans-serif;fill:#102a43}.small{font:400 17px Arial,sans-serif;fill:#38536b}
      .card{filter:url(#shadow);stroke:#fff;stroke-width:3}.link{fill:none;stroke:#7890a8;stroke-width:4;opacity:.8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <text x="800" y="72" text-anchor="middle" class="title">Trois modèles, une même communication</text>
  <text x="800" y="110" text-anchor="middle" class="subtitle">Huawei poursuit le cours avec le modèle TCP/IP équivalent à cinq couches</text>

  <g>
    <rect x="90" y="150" width="380" height="62" rx="18" fill="#22577a"/><text x="280" y="190" text-anchor="middle" class="head">OSI - 7 couches</text>
    <rect x="90" y="230" width="380" height="72" rx="15" fill="#cfe8ff" class="card"/><text x="115" y="275" class="layer">7. Application</text>
    <rect x="90" y="308" width="380" height="72" rx="15" fill="#cfe8ff" class="card"/><text x="115" y="353" class="layer">6. Présentation</text>
    <rect x="90" y="386" width="380" height="72" rx="15" fill="#cfe8ff" class="card"/><text x="115" y="431" class="layer">5. Session</text>
    <rect x="90" y="464" width="380" height="72" rx="15" fill="#d8f3dc" class="card"/><text x="115" y="509" class="layer">4. Transport</text>
    <rect x="90" y="542" width="380" height="72" rx="15" fill="#fff0bd" class="card"/><text x="115" y="587" class="layer">3. Réseau</text>
    <rect x="90" y="620" width="380" height="72" rx="15" fill="#ffe2d5" class="card"/><text x="115" y="665" class="layer">2. Liaison de données</text>
    <rect x="90" y="698" width="380" height="72" rx="15" fill="#eadcf8" class="card"/><text x="115" y="743" class="layer">1. Physique</text>
  </g>

  <g>
    <rect x="610" y="150" width="380" height="62" rx="18" fill="#2f6f73"/><text x="800" y="190" text-anchor="middle" class="head">TCP/IP - 4 couches</text>
    <rect x="610" y="230" width="380" height="228" rx="18" fill="#cfe8ff" class="card"/>
    <text x="800" y="324" text-anchor="middle" class="layer">Application</text><text x="800" y="357" text-anchor="middle" class="small">regroupe OSI 5 à 7</text>
    <rect x="610" y="464" width="380" height="72" rx="15" fill="#d8f3dc" class="card"/><text x="800" y="509" text-anchor="middle" class="layer">Transport</text>
    <rect x="610" y="542" width="380" height="72" rx="15" fill="#fff0bd" class="card"/><text x="800" y="587" text-anchor="middle" class="layer">Internet</text>
    <rect x="610" y="620" width="380" height="150" rx="18" fill="#f5dddf" class="card"/>
    <text x="800" y="677" text-anchor="middle" class="layer">Interface réseau</text><text x="800" y="710" text-anchor="middle" class="small">regroupe liaison et physique</text>
  </g>

  <g>
    <rect x="1130" y="150" width="380" height="62" rx="18" fill="#c43d3d"/><text x="1320" y="190" text-anchor="middle" class="head">Équivalent - 5 couches</text>
    <rect x="1130" y="230" width="380" height="228" rx="18" fill="#cfe8ff" class="card"/><text x="1320" y="335" text-anchor="middle" class="layer">Application</text>
    <rect x="1130" y="464" width="380" height="72" rx="15" fill="#d8f3dc" class="card"/><text x="1320" y="509" text-anchor="middle" class="layer">Transport</text>
    <rect x="1130" y="542" width="380" height="72" rx="15" fill="#fff0bd" class="card"/><text x="1320" y="587" text-anchor="middle" class="layer">Réseau</text>
    <rect x="1130" y="620" width="380" height="72" rx="15" fill="#ffe2d5" class="card"/><text x="1320" y="665" text-anchor="middle" class="layer">Liaison de données</text>
    <rect x="1130" y="698" width="380" height="72" rx="15" fill="#eadcf8" class="card"/><text x="1320" y="743" text-anchor="middle" class="layer">Physique</text>
  </g>

  <path d="M482 344H598" class="link"/><path d="M1002 344H1118" class="link"/>
  <path d="M482 500H598" class="link"/><path d="M1002 500H1118" class="link"/>
  <path d="M482 578H598" class="link"/><path d="M1002 578H1118" class="link"/>
  <path d="M482 695H598" class="link"/><path d="M1002 656H1118" class="link"/><path d="M1002 734H1118" class="link"/>

  <rect x="404" y="810" width="792" height="54" rx="27" fill="#fff" stroke="#cad8e4" stroke-width="2"/>
  <text x="800" y="844" text-anchor="middle" class="small">Cadre utilisé dans la suite du cours : Application · Transport · Réseau · Liaison · Physique</text>
</svg>
