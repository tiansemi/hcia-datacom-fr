<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc"><title id="title">Exigences du DCN de calcul intelligent</title><desc id="desc">Le réseau IA combine très haut débit, absence de perte et faible latence grâce à PFC, ECN et RDMA.</desc><rect width="1200" height="570" rx="28" fill="#f5fafc"/><text x="600" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#102a43">Le réseau devient une partie de la puissance de calcul</text><g font-family="Arial,sans-serif"><rect x="60" y="130" width="320" height="315" rx="25" fill="#fff" stroke="#4f72c4" stroke-width="3"/><text x="220" y="192" text-anchor="middle" font-size="27" font-weight="700" fill="#3d5da8">Très haut débit</text><text x="220" y="260" text-anchor="middle" font-size="37" font-weight="700" fill="#102a43">400 / 800GE</text><text x="220" y="320" text-anchor="middle" font-size="19" fill="#486581">synchronisation rapide</text><text x="220" y="358" text-anchor="middle" font-size="19" fill="#486581">des GPU</text><rect x="440" y="130" width="320" height="315" rx="25" fill="#fff" stroke="#23a6a8" stroke-width="3"/><text x="600" y="192" text-anchor="middle" font-size="27" font-weight="700" fill="#128f91">Réseau sans perte</text><text x="600" y="260" text-anchor="middle" font-size="34" font-weight="700" fill="#102a43">PFC + ECN</text><text x="600" y="320" text-anchor="middle" font-size="19" fill="#486581">freiner localement</text><text x="600" y="358" text-anchor="middle" font-size="19" fill="#486581">et notifier la source</text><rect x="820" y="130" width="320" height="315" rx="25" fill="#fff" stroke="#f2994a" stroke-width="3"/><text x="980" y="192" text-anchor="middle" font-size="27" font-weight="700" fill="#e47a1f">Très faible latence</text><text x="980" y="260" text-anchor="middle" font-size="37" font-weight="700" fill="#102a43">RDMA / RoCE</text><text x="980" y="320" text-anchor="middle" font-size="19" fill="#486581">mémoire à mémoire</text><text x="980" y="358" text-anchor="middle" font-size="19" fill="#486581">sans détour par le noyau</text><text x="600" y="516" text-anchor="middle" font-size="21" font-weight="700" fill="#334e68">Moins d'attente réseau = meilleure utilisation du cluster GPU.</text></g></svg>
