<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Cycle de révision TianSemi</title><desc id="d">Le rappel conduit à la compréhension, la pratique, la preuve, la correction des lacunes puis une nouvelle tentative espacée.</desc><rect width="1200" height="620" rx="28" fill="#eef8fa"/><text x="55" y="58" font-family="Segoe UI,Arial" font-size="29" font-weight="700" fill="#102a43">Cycle TianSemi — maîtriser plutôt que relire</text><g fill="none" stroke="#8ab4c7" stroke-width="7"><path d="M250 220H470M730 220H950M950 220V430H730M470 430H250M250 430V220"/><path d="M600 160V95M600 495V550"/></g><g font-family="Segoe UI,Arial" text-anchor="middle"><g transform="translate(120 155)"><rect width="260" height="130" rx="22" fill="#153f59"/><text x="130" y="55" font-size="23" font-weight="700" fill="#fff">1. Rappeler</text><text x="130" y="91" font-size="16" fill="#d9edf2">sans consulter la note</text></g><g transform="translate(470 155)"><rect width="260" height="130" rx="22" fill="#4f72c4"/><text x="130" y="55" font-size="23" font-weight="700" fill="#fff">2. Comprendre</text><text x="130" y="91" font-size="16" fill="#fff">expliquer le mécanisme</text></g><g transform="translate(820 155)"><rect width="260" height="130" rx="22" fill="#23a6a8"/><text x="130" y="55" font-size="23" font-weight="700" fill="#fff">3. Pratiquer</text><text x="130" y="91" font-size="16" fill="#fff">lab ou scénario</text></g><g transform="translate(820 365)"><rect width="260" height="130" rx="22" fill="#167d80"/><text x="130" y="55" font-size="23" font-weight="700" fill="#fff">4. Prouver</text><text x="130" y="91" font-size="16" fill="#fff">sortie ou résultat</text></g><g transform="translate(470 365)"><rect width="260" height="130" rx="22" fill="#f2994a"/><text x="130" y="55" font-size="23" font-weight="700" fill="#fff">5. Corriger</text><text x="130" y="91" font-size="16" fill="#fff">une lacune précise</text></g><g transform="translate(120 365)"><rect width="260" height="130" rx="22" fill="#153f59"/><text x="130" y="55" font-size="23" font-weight="700" fill="#fff">6. Espacer</text><text x="130" y="91" font-size="16" fill="#d9edf2">retenter plus tard</text></g></g><text x="600" y="575" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" font-weight="700" fill="#167d80">Une erreur documentée devient le prochain objectif de révision</text></svg>
