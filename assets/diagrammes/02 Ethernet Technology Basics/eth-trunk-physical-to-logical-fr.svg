<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Plusieurs liens physiques regroupés en Eth-Trunk</title><desc id="desc">Quatre liens entre deux switchs sont traités comme une interface logique qui apporte bande passante et redondance.</desc><defs><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#12324f" flood-opacity=".12"/></filter><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#12324f}.t{font-size:46px;font-weight:760}.st{font-size:22px;fill:#526e87}.h{font-size:29px;font-weight:750}.b{font-size:20px}.w{fill:#fff}</style></defs><rect width="1600" height="900" rx="38" fill="#f7fafc"/><text x="800" y="75" text-anchor="middle" class="t">Eth-Trunk : plusieurs liens, une interface logique</text><text x="800" y="115" text-anchor="middle" class="st">Les membres actifs partagent les flux et assurent la continuité</text><g filter="url(#s)"><rect x="100" y="315" width="340" height="230" rx="32" fill="#1769aa"/><text x="270" y="405" text-anchor="middle" class="h w">SW1</text><text x="270" y="450" text-anchor="middle" class="b w">Eth-Trunk 1</text><rect x="1160" y="315" width="340" height="230" rx="32" fill="#1769aa"/><text x="1330" y="405" text-anchor="middle" class="h w">SW2</text><text x="1330" y="450" text-anchor="middle" class="b w">Eth-Trunk 1</text></g><g stroke="#10a6a0" stroke-width="18" stroke-linecap="round"><line x1="440" y1="355" x2="1160" y2="355"/><line x1="440" y1="405" x2="1160" y2="405"/><line x1="440" y1="455" x2="1160" y2="455"/><line x1="440" y1="505" x2="1160" y2="505"/></g><rect x="585" y="240" width="430" height="75" rx="24" fill="#e5f7f5"/><text x="800" y="287" text-anchor="middle" class="h">Interface logique unique</text><g><rect x="300" y="650" width="300" height="90" rx="24" fill="#e8f3fb"/><text x="450" y="690" text-anchor="middle" class="h">Bande passante</text><text x="450" y="720" text-anchor="middle" class="b">plusieurs liens actifs</text><rect x="650" y="650" width="300" height="90" rx="24" fill="#e5f7f5"/><text x="800" y="690" text-anchor="middle" class="h">Répartition</text><text x="800" y="720" text-anchor="middle" class="b">par flux</text><rect x="1000" y="650" width="300" height="90" rx="24" fill="#fff0e6"/><text x="1150" y="690" text-anchor="middle" class="h">Redondance</text><text x="1150" y="720" text-anchor="middle" class="b">sur panne d'un membre</text></g><text x="800" y="835" text-anchor="middle" class="b">STP et les VLAN voient l'Eth-Trunk, pas quatre chemins indépendants.</text></svg>
