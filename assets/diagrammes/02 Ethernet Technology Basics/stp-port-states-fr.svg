<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">États de port STP</title><desc id="desc">Progression Blocking, Listening, Learning, Forwarding et état Disabled, avec traitement BPDU, apprentissage MAC et trafic utilisateur.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#55748d"/></marker><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#12324f" flood-opacity=".12"/></filter><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#12324f}.t{font-size:46px;font-weight:760}.st{font-size:22px;fill:#526e87}.h{font-size:25px;font-weight:740}.b{font-size:18px}.w{fill:#fff}.arr{stroke:#55748d;stroke-width:6;marker-end:url(#a)}</style></defs><rect width="1600" height="900" rx="38" fill="#f7fafc"/><text x="800" y="85" text-anchor="middle" class="t">États d'un port STP classique</text><text x="800" y="125" text-anchor="middle" class="st">Les états transitoires empêchent une boucle pendant la convergence</text><g transform="translate(85 255)"><g filter="url(#s)"><rect width="270" height="330" rx="28" fill="#6b7f91"/><text x="135" y="65" text-anchor="middle" class="h w">Blocking</text><text x="135" y="125" text-anchor="middle" class="b w">reçoit BPDU</text><text x="135" y="175" text-anchor="middle" class="b w">pas d'apprentissage</text><text x="135" y="225" text-anchor="middle" class="b w">pas de trafic</text></g><line x1="285" y1="165" x2="370" y2="165" class="arr"/><g transform="translate(385)" filter="url(#s)"><rect width="270" height="330" rx="28" fill="#2388bd"/><text x="135" y="65" text-anchor="middle" class="h w">Listening</text><text x="135" y="125" text-anchor="middle" class="b w">émet/reçoit BPDU</text><text x="135" y="175" text-anchor="middle" class="b w">pas d'apprentissage</text><text x="135" y="225" text-anchor="middle" class="b w">pas de trafic</text><text x="135" y="285" text-anchor="middle" class="b w">Forward Delay</text></g><line x1="670" y1="165" x2="755" y2="165" class="arr"/><g transform="translate(770)" filter="url(#s)"><rect width="270" height="330" rx="28" fill="#10a6a0"/><text x="135" y="65" text-anchor="middle" class="h w">Learning</text><text x="135" y="125" text-anchor="middle" class="b w">traite BPDU</text><text x="135" y="175" text-anchor="middle" class="b w">apprend les MAC</text><text x="135" y="225" text-anchor="middle" class="b w">pas de trafic</text><text x="135" y="285" text-anchor="middle" class="b w">Forward Delay</text></g><line x1="1055" y1="165" x2="1140" y2="165" class="arr"/><g transform="translate(1155)" filter="url(#s)"><rect width="270" height="330" rx="28" fill="#1769aa"/><text x="135" y="65" text-anchor="middle" class="h w">Forwarding</text><text x="135" y="125" text-anchor="middle" class="b w">émet/reçoit BPDU</text><text x="135" y="175" text-anchor="middle" class="b w">apprend les MAC</text><text x="135" y="225" text-anchor="middle" class="b w">transmet le trafic</text></g></g><rect x="550" y="685" width="500" height="105" rx="28" fill="#fff" stroke="#c9dce8" stroke-width="3"/><text x="800" y="730" text-anchor="middle" class="h">Disabled / Down</text><text x="800" y="764" text-anchor="middle" class="b">ni BPDU, ni apprentissage, ni trafic</text><text x="800" y="850" text-anchor="middle" class="b">Seuls root port et designated port peuvent atteindre Forwarding.</text></svg>
