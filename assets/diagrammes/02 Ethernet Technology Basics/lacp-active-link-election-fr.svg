<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Élection des liens actifs LACP</title><desc id="desc">LACP élit l'Actor par priorité système et MAC, puis sélectionne les liens par priorité et numéro d'interface.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#55748d"/></marker><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#12324f" flood-opacity=".12"/></filter><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#12324f}.t{font-size:46px;font-weight:760}.st{font-size:22px;fill:#526e87}.h{font-size:27px;font-weight:750}.b{font-size:20px}.sm{font-size:17px}.w{fill:#fff}.arr{stroke:#55748d;stroke-width:7;marker-end:url(#a)}</style></defs><rect width="1600" height="900" rx="38" fill="#f7fafc"/><text x="800" y="75" text-anchor="middle" class="t">LACP : de l'Actor aux liens actifs</text><text x="800" y="115" text-anchor="middle" class="st">Les valeurs les plus faibles ont la priorité</text><g filter="url(#s)"><rect x="470" y="165" width="660" height="115" rx="28" fill="#1769aa"/><text x="800" y="211" text-anchor="middle" class="h w">1 · Élire l'Actor</text><text x="800" y="248" text-anchor="middle" class="b w">priorité système → adresse MAC</text><line x1="800" y1="280" x2="800" y2="335" class="arr"/><rect x="470" y="345" width="660" height="115" rx="28" fill="#e5f7f5"/><text x="800" y="391" text-anchor="middle" class="h">2 · Classer les interfaces de l'Actor</text><text x="800" y="428" text-anchor="middle" class="b">priorité LACP → numéro d'interface</text><line x1="800" y1="460" x2="800" y2="515" class="arr"/><rect x="470" y="525" width="660" height="115" rx="28" fill="#fff0e6"/><text x="800" y="571" text-anchor="middle" class="h">3 · Respecter le maximum d'actifs</text><text x="800" y="608" text-anchor="middle" class="b">les autres membres deviennent secours</text></g><g transform="translate(325 700)"><rect width="270" height="80" rx="22" fill="#10a6a0"/><text x="135" y="48" text-anchor="middle" class="h w">Lien 1 · actif</text><rect x="335" width="270" height="80" rx="22" fill="#10a6a0"/><text x="470" y="48" text-anchor="middle" class="h w">Lien 2 · actif</text><rect x="670" width="270" height="80" rx="22" fill="#cfdbe4"/><text x="805" y="48" text-anchor="middle" class="h">Lien 3 · secours</text></g><text x="800" y="850" text-anchor="middle" class="b">Si un actif tombe, le secours de meilleure priorité le remplace.</text></svg>
