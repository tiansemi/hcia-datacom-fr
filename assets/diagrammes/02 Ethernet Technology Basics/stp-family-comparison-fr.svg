<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Comparaison STP RSTP VBST MSTP</title><desc id="desc">Comparaison selon convergence et relation entre VLAN et arbres spanning tree.</desc><defs><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#12324f" flood-opacity=".12"/></filter><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#12324f}.t{font-size:46px;font-weight:760}.st{font-size:22px;fill:#526e87}.h{font-size:29px;font-weight:760}.b{font-size:19px}.w{fill:#fff}.card{fill:#fff;stroke:#d4e4ef;stroke-width:2}</style></defs><rect width="1600" height="900" rx="38" fill="#f7fafc"/><text x="800" y="74" text-anchor="middle" class="t">De STP à MSTP : convergence et utilisation des liens</text><text x="800" y="113" text-anchor="middle" class="st">Choisir combien d'arbres servent les VLAN</text><g transform="translate(75 195)"><g filter="url(#s)"><rect width="340" height="500" rx="30" class="card"/><rect width="340" height="90" rx="30" fill="#6b7f91"/><text x="170" y="57" text-anchor="middle" class="h w">STP</text><text x="170" y="145" text-anchor="middle" class="b">convergence lente</text><text x="170" y="205" text-anchor="middle" class="h">1 arbre</text><text x="170" y="245" text-anchor="middle" class="b">pour tous les VLAN</text><text x="170" y="355" text-anchor="middle" class="b">simple</text><text x="170" y="395" text-anchor="middle" class="b">pas d'équilibrage inter-VLAN</text></g><g transform="translate(370)" filter="url(#s)"><rect width="340" height="500" rx="30" class="card"/><rect width="340" height="90" rx="30" fill="#2388bd"/><text x="170" y="57" text-anchor="middle" class="h w">RSTP</text><text x="170" y="145" text-anchor="middle" class="b">convergence rapide</text><text x="170" y="205" text-anchor="middle" class="h">1 arbre</text><text x="170" y="245" text-anchor="middle" class="b">pour tous les VLAN</text><text x="170" y="355" text-anchor="middle" class="b">rôles et états optimisés</text><text x="170" y="395" text-anchor="middle" class="b">toujours pas d'équilibrage</text></g><g transform="translate(740)" filter="url(#s)"><rect width="340" height="500" rx="30" class="card"/><rect width="340" height="90" rx="30" fill="#10a6a0"/><text x="170" y="57" text-anchor="middle" class="h w">VBST</text><text x="170" y="145" text-anchor="middle" class="b">solution Huawei</text><text x="170" y="205" text-anchor="middle" class="h">1 arbre / VLAN</text><text x="170" y="245" text-anchor="middle" class="b">chemins indépendants</text><text x="170" y="355" text-anchor="middle" class="b">équilibrage précis</text><text x="170" y="395" text-anchor="middle" class="b">plus de ressources</text></g><g transform="translate(1110)" filter="url(#s)"><rect width="340" height="500" rx="30" class="card"/><rect width="340" height="90" rx="30" fill="#7c55b5"/><text x="170" y="57" text-anchor="middle" class="h w">MSTP</text><text x="170" y="145" text-anchor="middle" class="b">convergence rapide</text><text x="170" y="205" text-anchor="middle" class="h">1 arbre / MSTI</text><text x="170" y="245" text-anchor="middle" class="b">plusieurs VLAN par instance</text><text x="170" y="355" text-anchor="middle" class="b">équilibrage</text><text x="170" y="395" text-anchor="middle" class="b">charge maîtrisée</text></g></g><rect x="405" y="770" width="790" height="58" rx="29" fill="#e8f1f7"/><text x="800" y="808" text-anchor="middle" class="b">MSTP mutualise un arbre entre les VLAN qui partagent la même topologie.</text></svg>
