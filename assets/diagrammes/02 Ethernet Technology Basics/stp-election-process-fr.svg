<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Séquence de calcul STP</title><desc id="desc">Quatre étapes : élire le root bridge, un root port par switch non racine, un designated port par lien, puis bloquer les ports alternatifs.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#55748d"/></marker><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#12324f" flood-opacity=".12"/></filter><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#12324f}.t{font-size:46px;font-weight:760}.st{font-size:22px;fill:#526e87}.h{font-size:27px;font-weight:740}.b{font-size:20px}.w{fill:#fff}.arr{stroke:#55748d;stroke-width:7;marker-end:url(#a)}</style></defs><rect width="1600" height="900" rx="38" fill="#f7fafc"/><text x="800" y="74" text-anchor="middle" class="t">Les quatre décisions qui construisent l'arbre STP</text><text x="800" y="113" text-anchor="middle" class="st">Chaque étape réduit la topologie jusqu'à supprimer la boucle logique</text><g filter="url(#s)"><rect x="525" y="155" width="550" height="115" rx="28" fill="#1769aa"/><text x="800" y="201" text-anchor="middle" class="h w">1 · Élire le root bridge</text><text x="800" y="238" text-anchor="middle" class="b w">plus petit BID</text><line x1="800" y1="270" x2="800" y2="320" class="arr"/><rect x="525" y="330" width="550" height="115" rx="28" fill="#dcedf9"/><text x="800" y="376" text-anchor="middle" class="h">2 · Élire les root ports</text><text x="800" y="413" text-anchor="middle" class="b">un par switch non racine</text><line x1="800" y1="445" x2="800" y2="495" class="arr"/><rect x="525" y="505" width="550" height="115" rx="28" fill="#e3f6f4"/><text x="800" y="551" text-anchor="middle" class="h">3 · Élire les designated ports</text><text x="800" y="588" text-anchor="middle" class="b">un par segment</text><line x1="800" y1="620" x2="800" y2="670" class="arr"/><rect x="525" y="680" width="550" height="115" rx="28" fill="#fff0e6"/><text x="800" y="726" text-anchor="middle" class="h">4 · Bloquer les alternate ports</text><text x="800" y="763" text-anchor="middle" class="b">arbre logique sans boucle</text></g><text x="800" y="852" text-anchor="middle" class="b">Root et designated transmettent ; alternate reste disponible comme secours.</text></svg>
