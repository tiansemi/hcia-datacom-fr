<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Planification VLAN dans un campus</title><desc id="desc">Trois bâtiments reliés à un cœur de réseau transportent les VLAN Bureaux, Finance, Classes et Gestion.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#12324f" flood-opacity=".12"/></filter><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#12324f}.t{font-size:46px;font-weight:760}.st{font-size:21px;fill:#526e87}.h{font-size:25px;font-weight:740}.b{font-size:19px}.w{fill:#fff}.card{fill:#fff;stroke:#d4e4ef;stroke-width:2}</style></defs>
  <rect width="1600" height="900" rx="38" fill="#f7fafc"/><text x="800" y="72" text-anchor="middle" class="t">Planifier les VLAN selon les usages, pas les bâtiments</text><text x="800" y="110" text-anchor="middle" class="st">Un même service conserve le même domaine logique à travers le campus</text>
  <rect x="610" y="155" width="380" height="105" rx="28" fill="#1769aa" filter="url(#s)"/><text x="800" y="199" text-anchor="middle" class="h w">Cœur de réseau</text><text x="800" y="232" text-anchor="middle" class="b w">transport des VLAN 1, 2, 3 et 100</text>
  <path d="M800 260 L800 330 M800 330 L310 395 M800 330 L800 395 M800 330 L1290 395" stroke="#55748d" stroke-width="7" fill="none"/>
  <g transform="translate(80 395)" filter="url(#s)"><rect width="455" height="330" rx="28" class="card"/><text x="227" y="48" text-anchor="middle" class="h">Administration</text><rect x="55" y="90" width="345" height="55" rx="15" fill="#e8f3fb"/><text x="227" y="125" text-anchor="middle" class="b">VLAN 1 · Bureaux</text><rect x="55" y="160" width="345" height="55" rx="15" fill="#e5f7f5"/><text x="227" y="195" text-anchor="middle" class="b">VLAN 2 · Finance</text><rect x="55" y="230" width="345" height="55" rx="15" fill="#eee7f8"/><text x="227" y="265" text-anchor="middle" class="b">VLAN 3 · Classes</text></g>
  <g transform="translate(572 395)" filter="url(#s)"><rect width="455" height="330" rx="28" class="card"/><text x="227" y="48" text-anchor="middle" class="h">Enseignement</text><rect x="55" y="110" width="345" height="55" rx="15" fill="#e8f3fb"/><text x="227" y="145" text-anchor="middle" class="b">VLAN 1 · Bureaux</text><rect x="55" y="185" width="345" height="55" rx="15" fill="#eee7f8"/><text x="227" y="220" text-anchor="middle" class="b">VLAN 3 · Classes</text></g>
  <g transform="translate(1065 395)" filter="url(#s)"><rect width="455" height="330" rx="28" class="card"/><text x="227" y="48" text-anchor="middle" class="h">Bureaux</text><rect x="55" y="110" width="345" height="55" rx="15" fill="#e8f3fb"/><text x="227" y="145" text-anchor="middle" class="b">VLAN 1 · Bureaux</text><rect x="55" y="185" width="345" height="55" rx="15" fill="#e5f7f5"/><text x="227" y="220" text-anchor="middle" class="b">VLAN 2 · Finance</text></g>
  <rect x="505" y="780" width="590" height="58" rx="29" fill="#fff0e6"/><text x="800" y="817" text-anchor="middle" class="b">VLAN 100 · gestion des équipements du campus</text>
</svg>
