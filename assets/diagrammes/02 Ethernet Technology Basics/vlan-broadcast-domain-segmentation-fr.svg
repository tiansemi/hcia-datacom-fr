<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Segmentation d'un domaine de broadcast avec des VLAN</title><desc id="desc">Un grand domaine de broadcast est divisé en trois domaines logiques VLAN Finance, Technique et Invités.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#12324f" flood-opacity=".12"/></filter><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#12324f}.t{font-size:46px;font-weight:760}.st{font-size:22px;fill:#526e87}.h{font-size:28px;font-weight:740}.b{font-size:20px}.w{fill:#fff}.card{fill:#fff;stroke:#d4e4ef;stroke-width:2}</style></defs>
  <rect width="1600" height="900" rx="38" fill="#f7fafc"/><text x="800" y="72" text-anchor="middle" class="t">Un réseau physique, plusieurs domaines de broadcast</text><text x="800" y="112" text-anchor="middle" class="st">Le VLAN segmente logiquement la couche 2</text>
  <rect x="570" y="160" width="460" height="100" rx="26" fill="#1769aa" filter="url(#s)"/><text x="800" y="218" text-anchor="middle" class="h w">Infrastructure commutée partagée</text>
  <path d="M800 260 L800 330 M800 330 L310 390 M800 330 L800 390 M800 330 L1290 390" stroke="#55748d" stroke-width="7" fill="none"/>
  <g transform="translate(90 390)" filter="url(#s)"><rect width="440" height="340" rx="30" fill="#e8f3fb" stroke="#1769aa" stroke-width="3"/><text x="220" y="55" text-anchor="middle" class="h">VLAN 10 · Finance</text><circle cx="135" cy="155" r="42" fill="#1769aa"/><circle cx="305" cy="155" r="42" fill="#1769aa"/><text x="220" y="245" text-anchor="middle" class="b">Broadcasts confinés au VLAN 10</text><text x="220" y="285" text-anchor="middle" class="st">domaine logique indépendant</text></g>
  <g transform="translate(580 390)" filter="url(#s)"><rect width="440" height="340" rx="30" fill="#e5f7f5" stroke="#10a6a0" stroke-width="3"/><text x="220" y="55" text-anchor="middle" class="h">VLAN 20 · Technique</text><circle cx="135" cy="155" r="42" fill="#10a6a0"/><circle cx="305" cy="155" r="42" fill="#10a6a0"/><text x="220" y="245" text-anchor="middle" class="b">Broadcasts confinés au VLAN 20</text><text x="220" y="285" text-anchor="middle" class="st">domaine logique indépendant</text></g>
  <g transform="translate(1070 390)" filter="url(#s)"><rect width="440" height="340" rx="30" fill="#fff0e6" stroke="#ef7f45" stroke-width="3"/><text x="220" y="55" text-anchor="middle" class="h">VLAN 30 · Invités</text><circle cx="135" cy="155" r="42" fill="#ef7f45"/><circle cx="305" cy="155" r="42" fill="#ef7f45"/><text x="220" y="245" text-anchor="middle" class="b">Broadcasts confinés au VLAN 30</text><text x="220" y="285" text-anchor="middle" class="st">domaine logique indépendant</text></g>
  <rect x="360" y="785" width="880" height="60" rx="30" fill="#e9f1f7"/><text x="800" y="824" text-anchor="middle" class="b">La communication entre VLAN nécessite une fonction de couche 3.</text>
</svg>
