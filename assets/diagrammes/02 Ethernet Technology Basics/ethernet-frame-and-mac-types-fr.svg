<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Structure d'une trame Ethernet II et types d'adresses MAC</title>
  <desc id="desc">Schéma présentant les champs DMAC, SMAC, Type, données et FCS, puis les trois modes unicast, broadcast et multicast.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#143754" flood-opacity=".13"/></filter>
    <style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#12324f}.title{font-size:47px;font-weight:760}.sub{font-size:22px;fill:#506c85}.h{font-size:29px;font-weight:740}.body{font-size:21px}.small{font-size:18px}.white{fill:#fff}.card{fill:#fff;stroke:#d7e4ed;stroke-width:2}</style>
  </defs>
  <rect width="1600" height="900" rx="38" fill="#f7fafc"/>
  <text x="800" y="72" text-anchor="middle" class="title">Trame Ethernet II et adressage MAC</text>
  <text x="800" y="112" text-anchor="middle" class="sub">La DMAC guide la livraison locale ; la SMAC identifie l'émetteur</text>

  <g transform="translate(90 165)" filter="url(#shadow)">
    <rect width="1420" height="235" rx="30" class="card"/>
    <text x="45" y="55" class="h">Structure de la trame</text>
    <g transform="translate(45 88)">
      <rect width="235" height="93" rx="16" fill="#1769aa"/><rect x="245" width="235" height="93" rx="16" fill="#2382bd"/>
      <rect x="490" width="175" height="93" rx="16" fill="#10a6a0"/><rect x="675" width="485" height="93" rx="16" fill="#e5f5f3"/>
      <rect x="1170" width="160" height="93" rx="16" fill="#f6c85f"/>
      <text x="117" y="40" text-anchor="middle" class="h white">DMAC</text><text x="117" y="70" text-anchor="middle" class="small white">6 octets</text>
      <text x="362" y="40" text-anchor="middle" class="h white">SMAC</text><text x="362" y="70" text-anchor="middle" class="small white">6 octets</text>
      <text x="577" y="40" text-anchor="middle" class="h white">Type</text><text x="577" y="70" text-anchor="middle" class="small white">2 octets</text>
      <text x="917" y="40" text-anchor="middle" class="h">Données</text><text x="917" y="70" text-anchor="middle" class="small">46 à 1500 octets</text>
      <text x="1250" y="40" text-anchor="middle" class="h">FCS</text><text x="1250" y="70" text-anchor="middle" class="small">4 octets</text>
    </g>
    <text x="710" y="215" text-anchor="middle" class="small">Longueur totale présentée par Huawei : 64 à 1518 octets</text>
  </g>

  <g transform="translate(90 445)">
    <g transform="translate(0 0)" filter="url(#shadow)">
      <rect width="435" height="325" rx="28" class="card"/>
      <circle cx="217" cy="90" r="48" fill="#dcedf9"/><circle cx="217" cy="90" r="19" fill="#1769aa"/>
      <path d="M217 142 L217 190" stroke="#1769aa" stroke-width="7"/><path d="M217 190 L340 190" stroke="#1769aa" stroke-width="7" marker-end="url(#none)"/>
      <text x="217" y="238" text-anchor="middle" class="h">Unicast</text><text x="217" y="271" text-anchor="middle" class="body">un émetteur → un destinataire</text><text x="217" y="303" text-anchor="middle" class="small">Ex. 00-1E-10-DD-DD-02</text>
    </g>
    <g transform="translate(492 0)" filter="url(#shadow)">
      <rect width="435" height="325" rx="28" class="card"/>
      <circle cx="217" cy="90" r="48" fill="#fff0df"/><circle cx="217" cy="90" r="19" fill="#ef7f45"/>
      <path d="M217 142 L217 180 M217 180 L100 205 M217 180 L217 215 M217 180 L334 205" stroke="#ef7f45" stroke-width="7" fill="none"/>
      <text x="217" y="238" text-anchor="middle" class="h">Broadcast</text><text x="217" y="271" text-anchor="middle" class="body">un émetteur → tous les nœuds</text><text x="217" y="303" text-anchor="middle" class="small">FF-FF-FF-FF-FF-FF</text>
    </g>
    <g transform="translate(984 0)" filter="url(#shadow)">
      <rect width="435" height="325" rx="28" class="card"/>
      <circle cx="217" cy="90" r="48" fill="#e8def7"/><circle cx="217" cy="90" r="19" fill="#7c55b5"/>
      <path d="M217 142 L217 180 M217 180 L125 205 M217 180 L309 205" stroke="#7c55b5" stroke-width="7" fill="none"/>
      <text x="217" y="238" text-anchor="middle" class="h">Multicast</text><text x="217" y="271" text-anchor="middle" class="body">un émetteur → un groupe</text><text x="217" y="303" text-anchor="middle" class="small">Ex. 01-80-C2-00-00-01</text>
    </g>
  </g>
  <text x="800" y="835" text-anchor="middle" class="body">OUI : 24 premiers bits attribués par l'IEEE · Adresse MAC complète : 48 bits</text>
</svg>
