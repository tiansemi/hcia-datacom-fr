<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">En-tête de base IPv6 et extensions</title><desc id="desc">L'en-tête fixe de 40 octets contient huit champs et le champ Next Header chaîne les extensions vers le protocole supérieur.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#12324f" flood-opacity=".12"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#5a7891"/></marker><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#12324f}.t{font-size:46px;font-weight:760}.st{font-size:22px;fill:#526e87}.h{font-size:23px;font-weight:750}.b{font-size:17px}.w{fill:#fff}</style></defs><rect width="1600" height="900" rx="38" fill="#f7fafc"/><text x="800" y="75" text-anchor="middle" class="t">40 octets fixes, puis une chaîne extensible</text><text x="800" y="115" text-anchor="middle" class="st">Next Header indique l'élément suivant à interpréter</text>
  <g filter="url(#s)"><rect x="90" y="190" width="1420" height="390" rx="30" fill="#fff" stroke="#d4e4ef" stroke-width="2"/></g><g transform="translate(140 245)"><rect width="180" height="90" rx="16" fill="#1c70b0"/><text x="90" y="38" text-anchor="middle" class="h w">Version</text><text x="90" y="68" text-anchor="middle" class="b w">4 bits · valeur 6</text><rect x="190" width="270" height="90" rx="16" fill="#2388bd"/><text x="325" y="38" text-anchor="middle" class="h w">Traffic Class</text><text x="325" y="68" text-anchor="middle" class="b w">8 bits</text><rect x="470" width="350" height="90" rx="16" fill="#10a6a0"/><text x="645" y="38" text-anchor="middle" class="h w">Flow Label</text><text x="645" y="68" text-anchor="middle" class="b w">20 bits</text><rect x="830" width="330" height="90" rx="16" fill="#7d56b3"/><text x="995" y="38" text-anchor="middle" class="h w">Payload Length</text><text x="995" y="68" text-anchor="middle" class="b w">16 bits</text><rect x="1170" width="200" height="90" rx="16" fill="#d88938"/><text x="1270" y="38" text-anchor="middle" class="h w">Next Header</text><text x="1270" y="68" text-anchor="middle" class="b w">8 bits</text><rect y="110" width="260" height="90" rx="16" fill="#f6c85f"/><text x="130" y="148" text-anchor="middle" class="h">Hop Limit</text><text x="130" y="178" text-anchor="middle" class="b">8 bits</text><rect x="270" y="110" width="545" height="90" rx="16" fill="#e7f2fa"/><text x="542" y="165" text-anchor="middle" class="h">Adresse source · 128 bits</text><rect x="825" y="110" width="545" height="90" rx="16" fill="#e5f7f5"/><text x="1097" y="165" text-anchor="middle" class="h">Adresse destination · 128 bits</text><text x="685" y="270" text-anchor="middle" class="h">Pas de checksum IPv6 · pas de champ de fragmentation dans l'en-tête fixe</text></g>
  <path d="M350 700H505 M785 700H940 M1220 700H1360" stroke="#5a7891" stroke-width="8" marker-end="url(#a)"/><rect x="120" y="650" width="250" height="100" rx="22" fill="#1c70b0"/><text x="245" y="710" text-anchor="middle" class="h w">En-tête IPv6</text><rect x="520" y="650" width="285" height="100" rx="22" fill="#7d56b3"/><text x="662" y="690" text-anchor="middle" class="h w">Extension 1</text><text x="662" y="722" text-anchor="middle" class="b w">Next Header</text><rect x="955" y="650" width="285" height="100" rx="22" fill="#10a6a0"/><text x="1097" y="690" text-anchor="middle" class="h w">Extension 2</text><text x="1097" y="722" text-anchor="middle" class="b w">Next Header</text><rect x="1370" y="650" width="170" height="100" rx="22" fill="#d88938"/><text x="1455" y="710" text-anchor="middle" class="h w">TCP/UDP</text>
</svg>
