<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Fonctions NDP et messages ICMPv6</title><desc id="desc">RS et RA découvrent le routeur, NS et NA résolvent l'adresse et NS plus NA permettent la détection de doublons.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#12324f" flood-opacity=".12"/></filter><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#12324f}.t{font-size:46px;font-weight:760}.st{font-size:22px;fill:#526e87}.h{font-size:25px;font-weight:750}.b{font-size:18px}.w{fill:#fff}</style></defs><rect width="1600" height="900" rx="38" fill="#f7fafc"/><text x="800" y="75" text-anchor="middle" class="t">NDP réunit découverte, résolution et contrôle d'unicité</text><text x="800" y="115" text-anchor="middle" class="st">Quatre messages ICMPv6 structurent les échanges locaux</text>
  <g filter="url(#s)"><rect x="70" y="210" width="460" height="520" rx="32" fill="#fff" stroke="#d4e4ef" stroke-width="2"/><rect x="570" y="210" width="460" height="520" rx="32" fill="#fff" stroke="#d4e4ef" stroke-width="2"/><rect x="1070" y="210" width="460" height="520" rx="32" fill="#fff" stroke="#d4e4ef" stroke-width="2"/></g><text x="300" y="275" text-anchor="middle" class="h">Découverte du routeur</text><rect x="120" y="340" width="150" height="75" rx="18" fill="#1c70b0"/><text x="195" y="387" text-anchor="middle" class="h w">RS · 133</text><rect x="330" y="340" width="150" height="75" rx="18" fill="#10a6a0"/><text x="405" y="387" text-anchor="middle" class="h w">RA · 134</text><text x="300" y="485" text-anchor="middle" class="b">Hôte → routeur : sollicitation</text><text x="300" y="525" text-anchor="middle" class="b">Routeur → hôte : préfixe et défaut</text><text x="300" y="650" text-anchor="middle" class="b">Base de SLAAC</text><text x="800" y="275" text-anchor="middle" class="h">Résolution d'adresse</text><rect x="620" y="340" width="150" height="75" rx="18" fill="#7d56b3"/><text x="695" y="387" text-anchor="middle" class="h w">NS · 135</text><rect x="830" y="340" width="150" height="75" rx="18" fill="#d88938"/><text x="905" y="387" text-anchor="middle" class="h w">NA · 136</text><text x="800" y="485" text-anchor="middle" class="b">NS vers solicited-node</text><text x="800" y="525" text-anchor="middle" class="b">NA fournit l'adresse de couche 2</text><text x="800" y="650" text-anchor="middle" class="b">Remplace ARP sans broadcast</text><text x="1300" y="275" text-anchor="middle" class="h">DAD</text><circle cx="1205" cy="378" r="54" fill="#7d56b3"/><text x="1205" y="386" text-anchor="middle" class="h w">NS</text><circle cx="1395" cy="378" r="54" fill="#d88938"/><text x="1395" y="386" text-anchor="middle" class="h w">NA</text><text x="1300" y="485" text-anchor="middle" class="b">source :: · adresse tentative</text><text x="1300" y="525" text-anchor="middle" class="b">réponse = conflit</text><text x="1300" y="650" text-anchor="middle" class="b">Aucune réponse = adresse utilisable</text><rect x="330" y="790" width="940" height="62" rx="31" fill="#e8f1f7"/><text x="800" y="829" text-anchor="middle" class="h">Filtrer ICMPv6 sans discernement peut casser IPv6</text>
</svg>
