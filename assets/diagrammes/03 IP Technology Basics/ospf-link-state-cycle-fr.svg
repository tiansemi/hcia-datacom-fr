<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cycle de fonctionnement d'OSPF</title><desc id="desc">Cinq étapes relient voisinage, échange de LSA, construction de la LSDB, calcul SPF et installation des routes.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#12324f" flood-opacity=".12"/></filter><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5 0 11Z" fill="#5a7891"/></marker><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#12324f}.t{font-size:46px;font-weight:760}.st{font-size:22px;fill:#526e87}.h{font-size:23px;font-weight:750}.b{font-size:18px}.n{font-size:30px;font-weight:800}.w{fill:#fff}</style></defs>
  <rect width="1600" height="900" rx="38" fill="#f7fafc"/><text x="800" y="75" text-anchor="middle" class="t">OSPF transforme les états de liens en routes</text><text x="800" y="115" text-anchor="middle" class="st">Chaque routeur calcule son propre arbre des plus courts chemins</text>
  <path d="M330 385H400 M650 385H720 M970 385H1040 M1290 385H1360" stroke="#5a7891" stroke-width="8" marker-end="url(#a)"/>
  <g filter="url(#s)"><rect x="60" y="250" width="270" height="270" rx="28" fill="#1c70b0"/><rect x="380" y="250" width="270" height="270" rx="28" fill="#2388bd"/><rect x="700" y="250" width="270" height="270" rx="28" fill="#10a6a0"/><rect x="1020" y="250" width="270" height="270" rx="28" fill="#7d56b3"/><rect x="1340" y="250" width="200" height="270" rx="28" fill="#d88938"/></g>
  <g class="w"><text x="110" y="310" class="n w">1</text><text x="195" y="360" text-anchor="middle" class="h w">Voisinage</text><text x="195" y="405" text-anchor="middle" class="b w">Hello</text><text x="195" y="450" text-anchor="middle" class="b w">pairs découverts</text><text x="430" y="310" class="n w">2</text><text x="515" y="360" text-anchor="middle" class="h w">LSA</text><text x="515" y="405" text-anchor="middle" class="b w">états des liens</text><text x="515" y="450" text-anchor="middle" class="b w">diffusés</text><text x="750" y="310" class="n w">3</text><text x="835" y="360" text-anchor="middle" class="h w">LSDB</text><text x="835" y="405" text-anchor="middle" class="b w">topologie</text><text x="835" y="450" text-anchor="middle" class="b w">de l'aire</text><text x="1070" y="310" class="n w">4</text><text x="1155" y="360" text-anchor="middle" class="h w">SPF</text><text x="1155" y="405" text-anchor="middle" class="b w">arbre sans boucle</text><text x="1155" y="450" text-anchor="middle" class="b w">racine locale</text><text x="1380" y="310" class="n w">5</text><text x="1440" y="360" text-anchor="middle" class="h w">Routes</text><text x="1440" y="405" text-anchor="middle" class="b w">meilleurs</text><text x="1440" y="435" text-anchor="middle" class="b w">chemins</text></g>
  <rect x="270" y="650" width="1060" height="110" rx="32" fill="#e8f1f7"/><text x="800" y="695" text-anchor="middle" class="h">Même LSDB dans une aire, mais arbre SPF propre à chaque routeur</text><text x="800" y="735" text-anchor="middle" class="b">Les routes OSPF retenues sont ensuite comparées aux autres sources de la table IP.</text>
</svg>
