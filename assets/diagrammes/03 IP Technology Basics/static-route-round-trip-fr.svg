<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Routes statiques aller et retour</title><desc id="desc">Deux LAN communiquent à travers deux routeurs. Une route statique vers le LAN distant est nécessaire sur chaque routeur.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#12324f" flood-opacity=".12"/></filter><marker id="ar" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5 0 11Z" fill="#1c70b0"/></marker><marker id="ret" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5 0 11Z" fill="#10a6a0"/></marker><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#12324f}.t{font-size:46px;font-weight:760}.st{font-size:22px;fill:#526e87}.h{font-size:25px;font-weight:750}.b{font-size:19px}.w{fill:#fff}</style></defs>
  <rect width="1600" height="900" rx="38" fill="#f7fafc"/><text x="800" y="75" text-anchor="middle" class="t">Une route aller ne crée jamais la route retour</text><text x="800" y="115" text-anchor="middle" class="st">Le routage est unidirectionnel ; la communication, généralement bidirectionnelle</text>
  <g filter="url(#s)"><rect x="70" y="285" width="300" height="250" rx="28" fill="#fff" stroke="#d4e4ef" stroke-width="2"/><rect x="475" y="285" width="240" height="250" rx="28" fill="#1c70b0"/><rect x="885" y="285" width="240" height="250" rx="28" fill="#10a6a0"/><rect x="1230" y="285" width="300" height="250" rx="28" fill="#fff" stroke="#d4e4ef" stroke-width="2"/></g>
  <text x="220" y="360" text-anchor="middle" class="h">LAN A</text><text x="220" y="405" text-anchor="middle" class="b">10.1.1.0/24</text><text x="220" y="460" text-anchor="middle" class="b">Passerelle : R1</text><text x="595" y="385" text-anchor="middle" class="h w">R1</text><text x="595" y="430" text-anchor="middle" class="b w">vers 20.1.1.0/24</text><text x="595" y="465" text-anchor="middle" class="b w">next hop R2</text><text x="1005" y="385" text-anchor="middle" class="h w">R2</text><text x="1005" y="430" text-anchor="middle" class="b w">vers 10.1.1.0/24</text><text x="1005" y="465" text-anchor="middle" class="b w">next hop R1</text><text x="1380" y="360" text-anchor="middle" class="h">LAN B</text><text x="1380" y="405" text-anchor="middle" class="b">20.1.1.0/24</text><text x="1380" y="460" text-anchor="middle" class="b">Passerelle : R2</text>
  <path d="M220 230H1380" stroke="#1c70b0" stroke-width="9" marker-end="url(#ar)"/><text x="800" y="205" text-anchor="middle" class="h">Aller : LAN A → LAN B</text><path d="M1380 610H220" stroke="#10a6a0" stroke-width="9" marker-end="url(#ret)"/><text x="800" y="670" text-anchor="middle" class="h">Retour : LAN B → LAN A</text>
  <rect x="285" y="745" width="1030" height="90" rx="30" fill="#e8f1f7"/><text x="800" y="782" text-anchor="middle" class="h">Test utile : ping -a adresse-source adresse-destination</text><text x="800" y="816" text-anchor="middle" class="b">Il révèle une route retour manquante vers la source choisie.</text>
</svg>
