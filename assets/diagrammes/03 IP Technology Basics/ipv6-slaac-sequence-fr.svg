<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Séquence SLAAC</title><desc id="desc">L'hôte génère une link-local, réalise DAD, échange RS et RA, construit son adresse globale puis réalise un second DAD.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#12324f" flood-opacity=".12"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#5a7891"/></marker><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#12324f}.t{font-size:46px;font-weight:760}.st{font-size:22px;fill:#526e87}.h{font-size:22px;font-weight:750}.b{font-size:17px}.w{fill:#fff}</style></defs><rect width="1600" height="900" rx="38" fill="#f7fafc"/><text x="800" y="75" text-anchor="middle" class="t">SLAAC valide deux adresses avant de connecter l'hôte</text><text x="800" y="115" text-anchor="middle" class="st">DAD protège d'abord la link-local, puis l'adresse globale</text><path d="M245 410H280 M475 410H510 M705 410H740 M935 410H970 M1165 410H1200 M1395 410H1430" stroke="#5a7891" stroke-width="7" marker-end="url(#a)"/>
  <g filter="url(#s)"><rect x="45" y="305" width="200" height="210" rx="26" fill="#1c70b0"/><rect x="275" y="305" width="200" height="210" rx="26" fill="#2388bd"/><rect x="505" y="305" width="200" height="210" rx="26" fill="#10a6a0"/><rect x="735" y="305" width="200" height="210" rx="26" fill="#7d56b3"/><rect x="965" y="305" width="200" height="210" rx="26" fill="#d88938"/><rect x="1195" y="305" width="200" height="210" rx="26" fill="#10a6a0"/><rect x="1425" y="305" width="130" height="210" rx="26" fill="#1c70b0"/></g><text x="145" y="370" text-anchor="middle" class="h w">Link-local</text><text x="145" y="412" text-anchor="middle" class="b w">FE80::/10</text><text x="145" y="455" text-anchor="middle" class="b w">générée</text><text x="375" y="370" text-anchor="middle" class="h w">DAD 1</text><text x="375" y="412" text-anchor="middle" class="b w">NS · source ::</text><text x="375" y="455" text-anchor="middle" class="b w">pas de conflit</text><text x="605" y="370" text-anchor="middle" class="h w">RS</text><text x="605" y="412" text-anchor="middle" class="b w">chercher un</text><text x="605" y="445" text-anchor="middle" class="b w">routeur</text><text x="835" y="370" text-anchor="middle" class="h w">RA</text><text x="835" y="412" text-anchor="middle" class="b w">préfixe + défaut</text><text x="1065" y="370" text-anchor="middle" class="h w">Adresse globale</text><text x="1065" y="412" text-anchor="middle" class="b w">préfixe + ID</text><text x="1295" y="370" text-anchor="middle" class="h w">DAD 2</text><text x="1295" y="412" text-anchor="middle" class="b w">unicité globale</text><text x="1490" y="370" text-anchor="middle" class="h w">Prête</text><text x="1490" y="412" text-anchor="middle" class="b w">adresse</text><text x="1490" y="445" text-anchor="middle" class="b w">utilisable</text><rect x="260" y="650" width="1080" height="110" rx="32" fill="#e8f1f7"/><text x="800" y="695" text-anchor="middle" class="h">M=1 : adresse par DHCPv6 · M=0/O=1 : SLAAC + autres paramètres DHCPv6</text><text x="800" y="735" text-anchor="middle" class="b">Le comportement final dépend aussi du système d'exploitation du client.</text>
</svg>
