<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Récursion, route flottante et sommation</title><desc id="desc">Trois panneaux résument la résolution d'un prochain saut distant, le secours par préférence et l'agrégation de routes avec protection NULL0.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#12324f" flood-opacity=".12"/></filter><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#12324f}.t{font-size:46px;font-weight:760}.st{font-size:22px;fill:#526e87}.h{font-size:25px;font-weight:750}.b{font-size:18px}.n{font-size:32px;font-weight:800}.w{fill:#fff}</style></defs>
  <rect width="1600" height="900" rx="38" fill="#f7fafc"/><text x="800" y="75" text-anchor="middle" class="t">Trois fonctions avancées, trois problèmes résolus</text><text x="800" y="115" text-anchor="middle" class="st">Résoudre le next hop, prévoir le secours, réduire la table</text>
  <g filter="url(#s)"><rect x="60" y="200" width="470" height="560" rx="30" fill="#fff" stroke="#d4e4ef" stroke-width="2"/><rect x="565" y="200" width="470" height="560" rx="30" fill="#fff" stroke="#d4e4ef" stroke-width="2"/><rect x="1070" y="200" width="470" height="560" rx="30" fill="#fff" stroke="#d4e4ef" stroke-width="2"/></g>
  <circle cx="130" cy="275" r="40" fill="#1c70b0"/><text x="130" y="286" text-anchor="middle" class="n w">1</text><text x="310" y="282" text-anchor="middle" class="h">Récursion</text><rect x="115" y="335" width="360" height="78" rx="18" fill="#e7f2fa"/><text x="295" y="368" text-anchor="middle" class="b">Destination → next hop distant</text><text x="295" y="397" text-anchor="middle" class="b">20.1.1.3</text><text x="295" y="460" text-anchor="middle" class="n">↓</text><rect x="115" y="495" width="360" height="105" rx="18" fill="#e8f1f7"/><text x="295" y="532" text-anchor="middle" class="b">Route de résolution</text><text x="295" y="564" text-anchor="middle" class="b">→ interface directement connectée</text><text x="295" y="690" text-anchor="middle" class="b">Sans résolution : route invalide</text>
  <circle cx="635" cy="275" r="40" fill="#10a6a0"/><text x="635" y="286" text-anchor="middle" class="n w">2</text><text x="815" y="282" text-anchor="middle" class="h">Route flottante</text><rect x="620" y="335" width="360" height="92" rx="18" fill="#e5f7f5"/><text x="800" y="371" text-anchor="middle" class="b">Chemin principal · préférence 60</text><text x="800" y="402" text-anchor="middle" class="b">installé tant qu'il est valide</text><rect x="620" y="465" width="360" height="92" rx="18" fill="#fff1d5"/><text x="800" y="501" text-anchor="middle" class="b">Chemin secours · préférence 70</text><text x="800" y="532" text-anchor="middle" class="b">attend hors de la table active</text><text x="800" y="625" text-anchor="middle" class="h">60 tombe → 70 prend le relais</text><text x="800" y="690" text-anchor="middle" class="b">Valeur plus grande = priorité plus faible</text>
  <circle cx="1140" cy="275" r="40" fill="#7d56b3"/><text x="1140" y="286" text-anchor="middle" class="n w">3</text><text x="1320" y="282" text-anchor="middle" class="h">Sommation</text><g fill="#e9e1f6"><rect x="1125" y="335" width="150" height="58" rx="14"/><rect x="1300" y="335" width="180" height="58" rx="14"/><rect x="1125" y="415" width="150" height="58" rx="14"/><rect x="1300" y="415" width="180" height="58" rx="14"/></g><text x="1200" y="371" text-anchor="middle" class="b">10.1.1.0/24</text><text x="1390" y="371" text-anchor="middle" class="b">10.1.2.0/24</text><text x="1200" y="451" text-anchor="middle" class="b">10.1.3.0/24</text><text x="1390" y="451" text-anchor="middle" class="b">10.1.4.0/24</text><text x="1305" y="520" text-anchor="middle" class="n">↓</text><rect x="1145" y="550" width="320" height="74" rx="18" fill="#7d56b3"/><text x="1305" y="596" text-anchor="middle" class="h w">Préfixe commun</text><text x="1305" y="670" text-anchor="middle" class="b">NULL0 protège les trous du résumé</text>
  <rect x="330" y="800" width="940" height="60" rx="30" fill="#e8f1f7"/><text x="800" y="838" text-anchor="middle" class="h">Toujours vérifier la table réellement installée, pas seulement la configuration</text>
</svg>
