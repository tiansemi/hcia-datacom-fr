<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Topologie du lab IPv6</title><desc id="desc">S1 obtient une adresse SLAAC auprès de R1, R1 rejoint S2 par un second préfixe et des routes statiques rendent la loopback de S2 joignable.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#12324f" flood-opacity=".12"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#5a7891"/></marker><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#12324f}.t{font-size:46px;font-weight:760}.st{font-size:22px;fill:#526e87}.h{font-size:25px;font-weight:750}.b{font-size:18px}.w{fill:#fff}</style></defs><rect width="1600" height="900" rx="38" fill="#f7fafc"/><text x="800" y="75" text-anchor="middle" class="t">SLAAC à gauche, routage statique vers la loopback</text><text x="800" y="115" text-anchor="middle" class="st">Chaque lien valide d'abord IPv6, NDP et ses adresses locales</text><path d="M410 430H660 M940 430H1190" stroke="#5a7891" stroke-width="10"/><g filter="url(#s)"><rect x="90" y="320" width="320" height="230" rx="30" fill="#fff" stroke="#d4e4ef" stroke-width="2"/><rect x="660" y="290" width="280" height="290" rx="30" fill="#1c70b0"/><rect x="1190" y="320" width="320" height="230" rx="30" fill="#10a6a0"/></g><text x="250" y="380" text-anchor="middle" class="h">S1 · client SLAAC</text><text x="250" y="430" text-anchor="middle" class="b">auto global default</text><text x="250" y="480" text-anchor="middle" class="b">préfixe 2000:12::/64</text><text x="800" y="365" text-anchor="middle" class="h w">R1 · routeur</text><text x="800" y="412" text-anchor="middle" class="b w">RA sur GE0/0/1</text><text x="800" y="455" text-anchor="middle" class="b w">2000:12::2/64</text><text x="800" y="498" text-anchor="middle" class="b w">2000:23::1/64</text><text x="1350" y="380" text-anchor="middle" class="h">S2</text><text x="1350" y="430" text-anchor="middle" class="b">2000:23::2/64</text><text x="1350" y="480" text-anchor="middle" class="b">Loopback 2000::2/128</text><text x="535" y="395" text-anchor="middle" class="b">2000:12::/64</text><text x="1065" y="395" text-anchor="middle" class="b">2000:23::/64</text><path d="M430 670H1170" stroke="#1c70b0" stroke-width="8" marker-end="url(#a)"/><text x="800" y="645" text-anchor="middle" class="h">Route aller sur R1 vers 2000::2/128</text><path d="M1170 760H430" stroke="#10a6a0" stroke-width="8" marker-end="url(#a)"/><text x="800" y="820" text-anchor="middle" class="h">Route retour sur S2 vers 2000:12::/64</text>
</svg>
