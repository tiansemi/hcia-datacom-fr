<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">États d'une adjacence OSPF</title><desc id="desc">La progression va de Down à Full, avec Hello, DD, LSR, LSU et LSAck.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#12324f" flood-opacity=".12"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#5a7891"/></marker><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#12324f}.t{font-size:46px;font-weight:760}.st{font-size:22px;fill:#526e87}.h{font-size:23px;font-weight:750}.b{font-size:17px}.w{fill:#fff}</style></defs>
  <rect width="1600" height="900" rx="38" fill="#f7fafc"/><text x="800" y="75" text-anchor="middle" class="t">Du premier Hello à la LSDB synchronisée</text><text x="800" y="115" text-anchor="middle" class="st">2-Way établit le voisinage ; Full établit l'adjacence</text>
  <path d="M235 390H270 M455 390H490 M675 390H710 M895 390H930 M1115 390H1150 M1335 390H1370" stroke="#5a7891" stroke-width="7" marker-end="url(#a)"/>
  <g filter="url(#s)"><rect x="50" y="300" width="185" height="180" rx="25" fill="#e8f1f7"/><rect x="270" y="300" width="185" height="180" rx="25" fill="#d9ecf8"/><rect x="490" y="300" width="185" height="180" rx="25" fill="#1c70b0"/><rect x="710" y="300" width="185" height="180" rx="25" fill="#2388bd"/><rect x="930" y="300" width="185" height="180" rx="25" fill="#10a6a0"/><rect x="1150" y="300" width="185" height="180" rx="25" fill="#7d56b3"/><rect x="1370" y="300" width="180" height="180" rx="25" fill="#d88938"/></g>
  <text x="142" y="370" text-anchor="middle" class="h">Down</text><text x="142" y="415" text-anchor="middle" class="b">aucun Hello</text><text x="362" y="370" text-anchor="middle" class="h">Init</text><text x="362" y="415" text-anchor="middle" class="b">Hello reçu</text><text x="582" y="370" text-anchor="middle" class="h w">2-Way</text><text x="582" y="415" text-anchor="middle" class="b w">bidirectionnel</text><text x="802" y="370" text-anchor="middle" class="h w">ExStart</text><text x="802" y="415" text-anchor="middle" class="b w">maître / esclave</text><text x="1022" y="370" text-anchor="middle" class="h w">Exchange</text><text x="1022" y="415" text-anchor="middle" class="b w">résumés DD</text><text x="1242" y="370" text-anchor="middle" class="h w">Loading</text><text x="1242" y="415" text-anchor="middle" class="b w">LSR · LSU · LSAck</text><text x="1460" y="370" text-anchor="middle" class="h w">Full</text><text x="1460" y="415" text-anchor="middle" class="b w">LSDB identiques</text>
  <rect x="240" y="610" width="510" height="105" rx="28" fill="#e7f2fa"/><text x="495" y="650" text-anchor="middle" class="h">Voisinage</text><text x="495" y="687" text-anchor="middle" class="b">Hello et découverte bidirectionnelle</text><rect x="850" y="610" width="510" height="105" rx="28" fill="#e5f7f5"/><text x="1105" y="650" text-anchor="middle" class="h">Adjacence</text><text x="1105" y="687" text-anchor="middle" class="b">Échange et synchronisation des états de liens</text>
</svg>
