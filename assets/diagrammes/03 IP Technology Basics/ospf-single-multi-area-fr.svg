<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">OSPF aire unique et multi-aire</title><desc id="desc">Une aire unique partage une vaste LSDB, alors que plusieurs aires organisées autour de l'aire 0 limitent le flooding.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#12324f" flood-opacity=".12"/></filter><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#12324f}.t{font-size:46px;font-weight:760}.st{font-size:22px;fill:#526e87}.h{font-size:25px;font-weight:750}.b{font-size:18px}.w{fill:#fff}.link{stroke:#5a7891;stroke-width:8}</style></defs>
  <rect width="1600" height="900" rx="38" fill="#f7fafc"/><text x="800" y="75" text-anchor="middle" class="t">Découper le domaine pour contenir les changements</text><text x="800" y="115" text-anchor="middle" class="st">Le backbone aire 0 relie les aires non backbone</text>
  <g filter="url(#s)"><rect x="70" y="200" width="650" height="540" rx="34" fill="#fff" stroke="#d4e4ef" stroke-width="2"/><rect x="790" y="200" width="740" height="540" rx="34" fill="#fff" stroke="#d4e4ef" stroke-width="2"/></g>
  <text x="395" y="260" text-anchor="middle" class="h">Aire unique</text><ellipse cx="395" cy="470" rx="250" ry="155" fill="#d9ecf8"/><text x="395" y="390" text-anchor="middle" class="h">Aire 0</text><g fill="#1c70b0"><circle cx="250" cy="480" r="40"/><circle cx="360" cy="550" r="40"/><circle cx="470" cy="465" r="40"/><circle cx="560" cy="550" r="40"/></g><path d="M250 480L360 550L470 465L560 550L250 480" class="link" fill="none"/><text x="395" y="680" text-anchor="middle" class="b">LSDB et flooding couvrent tout le domaine</text>
  <text x="1160" y="260" text-anchor="middle" class="h">Multi-aire</text><ellipse cx="1160" cy="470" rx="190" ry="115" fill="#1c70b0"/><text x="1160" y="478" text-anchor="middle" class="h w">Aire 0 · backbone</text><ellipse cx="930" cy="340" rx="115" ry="82" fill="#e5f7f5"/><ellipse cx="1390" cy="340" rx="115" ry="82" fill="#fff1d5"/><ellipse cx="1160" cy="640" rx="130" ry="72" fill="#e9e1f6"/><path d="M1010 390L1080 425 M1310 390L1240 425 M1160 568V540" class="link"/><text x="930" y="348" text-anchor="middle" class="h">Aire 1</text><text x="1390" y="348" text-anchor="middle" class="h">Aire 2</text><text x="1160" y="648" text-anchor="middle" class="h">Aire 3</text><text x="1160" y="715" text-anchor="middle" class="b">Les ABR limitent le flooding et relient chaque aire à l'aire 0</text>
  <rect x="330" y="800" width="940" height="62" rx="31" fill="#e8f1f7"/><text x="800" y="839" text-anchor="middle" class="h">Deux aires non backbone ne se raccordent pas directement</text>
</svg>
