<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">DR, BDR et DROther sur Ethernet</title><desc id="desc">Le DR et le BDR établissent une adjacence avec tous les routeurs DROther, qui restent en état 2-Way entre eux.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#12324f" flood-opacity=".12"/></filter><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#12324f}.t{font-size:46px;font-weight:760}.st{font-size:22px;fill:#526e87}.h{font-size:25px;font-weight:750}.b{font-size:18px}.w{fill:#fff}.adj{stroke:#10a6a0;stroke-width:8}.two{stroke:#a7b9c8;stroke-width:5;stroke-dasharray:14 13}</style></defs>
  <rect width="1600" height="900" rx="38" fill="#f7fafc"/><text x="800" y="75" text-anchor="middle" class="t">DR et BDR concentrent les adjacences du segment</text><text x="800" y="115" text-anchor="middle" class="st">Les DROther ne synchronisent pas leur LSDB directement entre eux</text>
  <path d="M800 420L300 650 M800 420L650 690 M800 420L1050 690 M800 420L1370 650 M520 420L300 650 M520 420L650 690 M520 420L1050 690 M520 420L1370 650" class="adj"/><path d="M300 650L650 690L1050 690L1370 650" class="two" fill="none"/>
  <g filter="url(#s)"><rect x="650" y="250" width="300" height="190" rx="30" fill="#1c70b0"/><rect x="370" y="280" width="300" height="160" rx="30" fill="#7d56b3"/><circle cx="300" cy="650" r="95" fill="#fff" stroke="#d4e4ef" stroke-width="3"/><circle cx="650" cy="690" r="95" fill="#fff" stroke="#d4e4ef" stroke-width="3"/><circle cx="1050" cy="690" r="95" fill="#fff" stroke="#d4e4ef" stroke-width="3"/><circle cx="1370" cy="650" r="95" fill="#fff" stroke="#d4e4ef" stroke-width="3"/></g>
  <text x="800" y="330" text-anchor="middle" class="h w">DR</text><text x="800" y="375" text-anchor="middle" class="b w">désigné · adjacences complètes</text><text x="520" y="340" text-anchor="middle" class="h w">BDR</text><text x="520" y="382" text-anchor="middle" class="b w">secours déjà synchronisé</text><text x="300" y="645" text-anchor="middle" class="h">DROther</text><text x="300" y="680" text-anchor="middle" class="b">Full avec DR/BDR</text><text x="650" y="685" text-anchor="middle" class="h">DROther</text><text x="650" y="720" text-anchor="middle" class="b">2-Way entre pairs</text><text x="1050" y="685" text-anchor="middle" class="h">DROther</text><text x="1050" y="720" text-anchor="middle" class="b">2-Way entre pairs</text><text x="1370" y="645" text-anchor="middle" class="h">DROther</text><text x="1370" y="680" text-anchor="middle" class="b">Full avec DR/BDR</text>
  <rect x="300" y="800" width="1000" height="62" rx="31" fill="#e8f1f7"/><text x="800" y="839" text-anchor="middle" class="h">Élection : priorité la plus élevée, puis Router ID ; priorité 0 = inéligible</text>
</svg>
