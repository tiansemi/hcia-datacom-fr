<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sélection d'une route IP</title>
  <desc id="desc">Le routeur retient le préfixe le plus précis, compare ensuite la préférence entre sources puis la métrique au sein d'une même source.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#12324f" flood-opacity=".12"/></filter><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5 0 11Z" fill="#5a7891"/></marker><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#12324f}.t{font-size:46px;font-weight:760}.st{font-size:22px;fill:#526e87}.n{font-size:34px;font-weight:800}.h{font-size:25px;font-weight:740}.b{font-size:19px}.w{fill:#fff}.card{fill:#fff;stroke:#d4e4ef;stroke-width:2}</style></defs>
  <rect width="1600" height="900" rx="38" fill="#f7fafc"/><text x="800" y="75" text-anchor="middle" class="t">Trois comparaisons, dans le bon contexte</text><text x="800" y="115" text-anchor="middle" class="st">Ne pas confondre précision du préfixe, préférence de source et coût</text>
  <path d="M440 420H570 M1010 420H1140" stroke="#5a7891" stroke-width="8" marker-end="url(#a)"/>
  <g filter="url(#s)"><rect x="80" y="245" width="380" height="350" rx="30" fill="#1c70b0"/><circle cx="150" cy="315" r="42" fill="#fff" opacity=".2"/><text x="150" y="327" text-anchor="middle" class="n w">1</text><text x="335" y="315" text-anchor="middle" class="h w">Préfixe le plus long</text><text x="270" y="375" text-anchor="middle" class="b w">Pour l'adresse du paquet</text><text x="270" y="420" text-anchor="middle" class="b w">/24 gagne sur /16</text><text x="270" y="465" text-anchor="middle" class="b w">La route la plus précise</text><text x="270" y="510" text-anchor="middle" class="b w">détermine le transfert</text>
  <rect x="610" y="245" width="380" height="350" rx="30" fill="#10a6a0"/><circle cx="680" cy="315" r="42" fill="#fff" opacity=".2"/><text x="680" y="327" text-anchor="middle" class="n w">2</text><text x="800" y="315" text-anchor="middle" class="h w">Préférence</text><text x="800" y="375" text-anchor="middle" class="b w">Même destination et masque</text><text x="800" y="420" text-anchor="middle" class="b w">Sources différentes</text><text x="800" y="465" text-anchor="middle" class="b w">Plus petite valeur</text><text x="800" y="510" text-anchor="middle" class="b w">= source prioritaire</text>
  <rect x="1140" y="245" width="380" height="350" rx="30" fill="#7d56b3"/><circle cx="1210" cy="315" r="42" fill="#fff" opacity=".2"/><text x="1210" y="327" text-anchor="middle" class="n w">3</text><text x="1330" y="315" text-anchor="middle" class="h w">Métrique</text><text x="1330" y="375" text-anchor="middle" class="b w">Même source de route</text><text x="1330" y="420" text-anchor="middle" class="b w">Même préférence</text><text x="1330" y="465" text-anchor="middle" class="b w">Plus petit coût</text><text x="1330" y="510" text-anchor="middle" class="b w">= meilleur chemin</text></g>
  <rect x="260" y="690" width="1080" height="100" rx="30" fill="#e8f1f7"/><text x="800" y="732" text-anchor="middle" class="h">Coûts identiques au sein d'un même protocole : routes à coût égal possibles</text><text x="800" y="766" text-anchor="middle" class="b">La table installe les routes optimales retenues.</text>
</svg>
