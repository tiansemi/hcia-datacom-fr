<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Topologie de configuration OSPF typique</title><desc id="desc">R1 dans l'aire 0 rejoint R3 dans l'aire 1 à travers R2 qui agit comme ABR.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#12324f" flood-opacity=".12"/></filter><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#12324f}.t{font-size:46px;font-weight:760}.st{font-size:22px;fill:#526e87}.h{font-size:25px;font-weight:750}.b{font-size:18px}.w{fill:#fff}.link{stroke:#5a7891;stroke-width:10}</style></defs>
  <rect width="1600" height="900" rx="38" fill="#f7fafc"/><text x="800" y="75" text-anchor="middle" class="t">R2 relie l'aire 0 à l'aire 1</text><text x="800" y="115" text-anchor="middle" class="st">Le Router ID identifie le routeur ; la commande network sélectionne ses interfaces</text>
  <rect x="80" y="190" width="760" height="510" rx="35" fill="#e7f2fa"/><rect x="840" y="190" width="680" height="510" rx="35" fill="#e9e1f6"/><text x="430" y="250" text-anchor="middle" class="h">Aire 0</text><text x="1200" y="250" text-anchor="middle" class="h">Aire 1</text><path d="M420 450H800 M800 450H1190" class="link"/>
  <g filter="url(#s)"><rect x="250" y="340" width="240" height="220" rx="30" fill="#1c70b0"/><rect x="680" y="320" width="240" height="260" rx="30" fill="#10a6a0"/><rect x="1120" y="340" width="240" height="220" rx="30" fill="#7d56b3"/></g>
  <text x="370" y="410" text-anchor="middle" class="h w">R1</text><text x="370" y="452" text-anchor="middle" class="b w">RID 1.1.1.1</text><text x="370" y="495" text-anchor="middle" class="b w">Lo0 1.1.1.1/32</text><text x="800" y="395" text-anchor="middle" class="h w">R2 · ABR</text><text x="800" y="438" text-anchor="middle" class="b w">RID 2.2.2.2</text><text x="800" y="481" text-anchor="middle" class="b w">GE0/0/0 · aire 0</text><text x="800" y="520" text-anchor="middle" class="b w">GE0/0/1 · aire 1</text><text x="1240" y="410" text-anchor="middle" class="h w">R3</text><text x="1240" y="452" text-anchor="middle" class="b w">RID 3.3.3.3</text><text x="1240" y="495" text-anchor="middle" class="b w">Lo0 3.3.3.3/32</text>
  <text x="585" y="625" text-anchor="middle" class="b">10.1.12.0/30</text><text x="1010" y="625" text-anchor="middle" class="b">10.1.23.0/30</text><rect x="260" y="760" width="1080" height="80" rx="30" fill="#e8f1f7"/><text x="800" y="809" text-anchor="middle" class="h">Vérifier : voisins Full → LSDB → routes OSPF → ping sourcé</text>
</svg>
