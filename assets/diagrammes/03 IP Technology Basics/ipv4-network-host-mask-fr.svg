<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Parties réseau et hôte d'une adresse IPv4</title><desc id="desc">Le préfixe 24 de 192.168.10.1 sépare les 24 bits réseau des 8 bits hôte.</desc><defs><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#12324f" flood-opacity=".12"/></filter><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#12324f}.t{font-size:46px;font-weight:760}.st{font-size:22px;fill:#526e87}.h{font-size:29px;font-weight:750}.b{font-size:20px}.w{fill:#fff}.mono{font-family:Consolas,monospace;font-size:27px;font-weight:700}</style></defs><rect width="1600" height="900" rx="38" fill="#f7fafc"/><text x="800" y="75" text-anchor="middle" class="t">Le masque sépare le réseau de l'hôte</text><text x="800" y="115" text-anchor="middle" class="st">Exemple : 192.168.10.1/24</text><g transform="translate(140 220)" filter="url(#s)"><rect width="990" height="180" rx="30" fill="#1769aa"/><text x="495" y="70" text-anchor="middle" class="h w">Partie réseau · 24 bits</text><text x="495" y="125" text-anchor="middle" class="mono w">192 . 168 . 10</text><rect x="1010" width="310" height="180" rx="30" fill="#10a6a0"/><text x="1165" y="70" text-anchor="middle" class="h w">Partie hôte</text><text x="1165" y="125" text-anchor="middle" class="mono w">1</text></g><g transform="translate(140 465)"><rect width="1320" height="105" rx="28" fill="#e8f1f7"/><text x="660" y="45" text-anchor="middle" class="h">Masque 255.255.255.0</text><text x="660" y="80" text-anchor="middle" class="b">24 bits à 1 pour le réseau · 8 bits à 0 pour l'hôte</text></g><g transform="translate(200 650)"><rect width="350" height="95" rx="24" fill="#e8f3fb"/><text x="175" y="40" text-anchor="middle" class="h">Réseau</text><text x="175" y="72" text-anchor="middle" class="b">192.168.10.0</text><rect x="425" width="350" height="95" rx="24" fill="#e5f7f5"/><text x="600" y="40" text-anchor="middle" class="h">Hôtes</text><text x="600" y="72" text-anchor="middle" class="b">.1 à .254</text><rect x="850" width="350" height="95" rx="24" fill="#fff0e6"/><text x="1025" y="40" text-anchor="middle" class="h">Broadcast</text><text x="1025" y="72" text-anchor="middle" class="b">192.168.10.255</text></g><text x="800" y="835" text-anchor="middle" class="b">Même adresse sans masque : impossible de déterminer précisément son réseau.</text></svg>
