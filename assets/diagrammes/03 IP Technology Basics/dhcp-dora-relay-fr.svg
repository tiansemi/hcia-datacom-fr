<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Échange DHCP DORA avec relais</title><desc id="desc">Le client diffuse Discover et Request, le relais les transmet au serveur, qui répond par Offer et Ack.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#55748d"/></marker><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#12324f" flood-opacity=".12"/></filter><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#12324f}.t{font-size:46px;font-weight:760}.st{font-size:22px;fill:#526e87}.h{font-size:27px;font-weight:750}.b{font-size:19px}.w{fill:#fff}.arr{stroke:#55748d;stroke-width:5;marker-end:url(#a)}</style></defs><rect width="1600" height="900" rx="38" fill="#f7fafc"/><text x="800" y="75" text-anchor="middle" class="t">DHCP : DORA à travers un agent relais</text><text x="800" y="115" text-anchor="middle" class="st">Le relais franchit la frontière du domaine de broadcast</text><g filter="url(#s)"><rect x="100" y="170" width="330" height="105" rx="28" fill="#1769aa"/><text x="265" y="215" text-anchor="middle" class="h w">Client DHCP</text><text x="265" y="250" text-anchor="middle" class="b w">UDP 68</text><rect x="635" y="170" width="330" height="105" rx="28" fill="#f6c85f"/><text x="800" y="215" text-anchor="middle" class="h">Agent relais</text><text x="800" y="250" text-anchor="middle" class="b">route les messages</text><rect x="1170" y="170" width="330" height="105" rx="28" fill="#10a6a0"/><text x="1335" y="215" text-anchor="middle" class="h w">Serveur DHCP</text><text x="1335" y="250" text-anchor="middle" class="b w">UDP 67</text></g><g><line x1="265" y1="355" x2="790" y2="355" class="arr"/><line x1="810" y1="355" x2="1325" y2="355" class="arr"/><text x="800" y="335" text-anchor="middle" class="h">1 · DISCOVER</text><line x1="1335" y1="455" x2="810" y2="455" class="arr"/><line x1="790" y1="455" x2="275" y2="455" class="arr"/><text x="800" y="435" text-anchor="middle" class="h">2 · OFFER</text><line x1="265" y1="555" x2="790" y2="555" class="arr"/><line x1="810" y1="555" x2="1325" y2="555" class="arr"/><text x="800" y="535" text-anchor="middle" class="h">3 · REQUEST</text><line x1="1335" y1="655" x2="810" y2="655" class="arr"/><line x1="790" y1="655" x2="275" y2="655" class="arr"/><text x="800" y="635" text-anchor="middle" class="h">4 · ACK</text></g><rect x="205" y="740" width="1190" height="75" rx="35" fill="#e8f1f7"/><text x="800" y="773" text-anchor="middle" class="b">Client ↔ relais : messages du domaine local</text><text x="800" y="800" text-anchor="middle" class="b">Relais ↔ serveur : unicast entre réseaux routés</text><text x="800" y="865" text-anchor="middle" class="b">Le serveur doit posséder un pool pour le segment client et une route de retour.</text></svg>
