<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Exécution Python et structure d’un programme</title><desc id="desc">Le code source Python devient bytecode puis est exécuté par la PVM. À droite, un module regroupe fonctions, classes et méthodes, avec indentation et point d’entrée.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fcfd"/><stop offset="1" stop-color="#edf7fa"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#102a43" flood-opacity=".14"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#567687"/></marker><style>.title{font:700 30px Arial,sans-serif;fill:#102a43}.sub{font:400 16px Arial,sans-serif;fill:#486581}.h{font:700 18px Arial,sans-serif;fill:#102a43}.body{font:400 13px Arial,sans-serif;fill:#334e68}.small{font:400 12px Arial,sans-serif;fill:#486581}.white{font:700 17px Arial,sans-serif;fill:#fff}.mono{font:600 13px Consolas,monospace;fill:#334e68}</style></defs>
  <rect width="1200" height="650" rx="26" fill="url(#bg)"/><text x="60" y="62" class="title">Python : du fichier lisible à l’exécution réutilisable</text><text x="60" y="92" class="sub">Le bytecode favorise la portabilité ; la structure et l’indentation rendent l’automatisation maintenable.</text>
  <g transform="translate(55 132)" filter="url(#s)"><rect width="510" height="405" rx="22" fill="#fff"/><text x="255" y="38" text-anchor="middle" class="h">Chaîne d’exécution</text><rect x="105" y="75" width="300" height="65" rx="15" fill="#eef2ff" stroke="#4f72c4"/><text x="255" y="103" text-anchor="middle" class="h">Source Python</text><text x="255" y="126" text-anchor="middle" class="mono">automation.py</text><path d="M255 140v45" stroke="#567687" stroke-width="4" marker-end="url(#a)"/><text x="275" y="171" class="small">interpréteur</text><rect x="105" y="192" width="300" height="65" rx="15" fill="#e7f9f7" stroke="#23a6a8"/><text x="255" y="220" text-anchor="middle" class="h">Bytecode</text><text x="255" y="243" text-anchor="middle" class="mono">module.pyc</text><path d="M255 257v45" stroke="#567687" stroke-width="4" marker-end="url(#a)"/><rect x="105" y="309" width="300" height="65" rx="15" fill="#fff7ed" stroke="#f2994a"/><text x="255" y="337" text-anchor="middle" class="h">Python Virtual Machine</text><text x="255" y="360" text-anchor="middle" class="body">exécute sur l’OS et le CPU</text></g>
  <g transform="translate(615 132)" filter="url(#s)"><rect width="530" height="405" rx="22" fill="#fff"/><text x="265" y="38" text-anchor="middle" class="h">Structure d’un module maintenable</text><rect x="30" y="70" width="470" height="56" rx="14" fill="#153f59"/><text x="50" y="95" style="font:700 13px Consolas,monospace;fill:#fff">"""Description du module."""</text><text x="50" y="115" style="font:400 12px Consolas,monospace;fill:#d7edf3">import paramiko</text><rect x="30" y="145" width="220" height="82" rx="14" fill="#eef2ff" stroke="#4f72c4"/><text x="140" y="174" text-anchor="middle" class="h">Fonction</text><text x="50" y="202" class="mono">def validate_device():</text><rect x="280" y="145" width="220" height="82" rx="14" fill="#e7f9f7" stroke="#23a6a8"/><text x="390" y="174" text-anchor="middle" class="h">Classe et méthode</text><text x="300" y="202" class="mono">class Device:</text><rect x="30" y="250" width="470" height="61" rx="14" fill="#fff7ed" stroke="#f2994a"/><text x="50" y="276" class="mono">def main():</text><text x="180" y="276" class="body">inventaire → action → validation</text><text x="50" y="299" class="small">4 espaces définissent chaque bloc</text><rect x="30" y="330" width="470" height="48" rx="14" fill="#eef3f5"/><text x="50" y="360" class="mono">if __name__ == "__main__": main()</text></g>
  <rect x="60" y="575" width="1080" height="36" rx="14" fill="#153f59"/><text x="600" y="599" text-anchor="middle" style="font:700 14px Arial,sans-serif;fill:#fff">Mode interactif pour explorer · script pour répéter, tester, versionner et auditer</text>
</svg>
