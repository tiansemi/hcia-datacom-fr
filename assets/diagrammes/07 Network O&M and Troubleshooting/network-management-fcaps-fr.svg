<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Architecture NMS et fonctions FCAPS</title><desc id="desc">Un administrateur utilise un client et un serveur NMS pour gérer les agents des équipements. Cinq cartes représentent configuration, performance, pannes, sécurité et comptabilité.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fcfd"/><stop offset="1" stop-color="#edf7fa"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#102a43" flood-opacity=".14"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#567687"/></marker><style>.title{font:700 30px Arial,sans-serif;fill:#102a43}.sub{font:400 16px Arial,sans-serif;fill:#486581}.h{font:700 18px Arial,sans-serif;fill:#102a43}.body{font:400 13px Arial,sans-serif;fill:#334e68}.white{font:700 17px Arial,sans-serif;fill:#fff}.letter{font:700 24px Arial,sans-serif;fill:#fff}</style></defs>
  <rect width="1200" height="650" rx="26" fill="url(#bg)"/><text x="60" y="62" class="title">Du poste d’administration à l’état global du réseau</text><text x="60" y="92" class="sub">Le NMS échange avec les agents et organise l’exploitation autour des cinq fonctions FCAPS.</text>
  <g filter="url(#s)"><rect x="60" y="130" width="245" height="112" rx="18" fill="#fff" stroke="#b9d7df"/><text x="182" y="163" text-anchor="middle" class="h">Administrateur</text><text x="182" y="190" text-anchor="middle" class="body">Client NMS</text><text x="182" y="216" text-anchor="middle" class="body">Interface de gestion</text><rect x="420" y="130" width="300" height="112" rx="18" fill="#4f72c4"/><text x="570" y="170" text-anchor="middle" class="white">Serveur NMS</text><text x="570" y="199" text-anchor="middle" style="font:400 13px Arial,sans-serif;fill:#fff">Collecte · corrèle · configure</text></g>
  <path d="M305 186H412" stroke="#567687" stroke-width="4" marker-end="url(#a)"/><path d="M720 186H1120V310" fill="none" stroke="#567687" stroke-width="4" marker-end="url(#a)"/>
  <g transform="translate(820 125)" filter="url(#s)"><rect width="320" height="145" rx="20" fill="#fff"/><text x="160" y="33" text-anchor="middle" class="h">Équipements gérés</text><g transform="translate(25 58)"><rect width="76" height="54" rx="10" fill="#effafa" stroke="#23a6a8"/><rect x="97" width="76" height="54" rx="10" fill="#effafa" stroke="#23a6a8"/><rect x="194" width="76" height="54" rx="10" fill="#effafa" stroke="#23a6a8"/><text x="38" y="33" text-anchor="middle" class="body">Switch</text><text x="135" y="33" text-anchor="middle" class="body">Routeur</text><text x="232" y="33" text-anchor="middle" class="body">WAC</text></g><text x="160" y="133" text-anchor="middle" class="body">Processus agent sur chaque appareil</text></g>
  <text x="600" y="299" text-anchor="middle" class="h">FCAPS — cinq angles complémentaires</text>
  <g transform="translate(55 335)" filter="url(#s)"><rect width="206" height="185" rx="18" fill="#fff"/><rect width="206" height="54" rx="18" fill="#4f72c4"/><rect y="30" width="206" height="24" fill="#4f72c4"/><text x="28" y="36" class="letter">C</text><text x="62" y="34" class="white">Configuration</text><text x="20" y="91" class="body">Appliquer les paramètres</text><text x="20" y="116" class="body">et soutenir les services.</text><text x="20" y="157" class="body">VLAN · routes · politiques</text></g>
  <g transform="translate(276 335)" filter="url(#s)"><rect width="206" height="185" rx="18" fill="#fff"/><rect width="206" height="54" rx="18" fill="#23a6a8"/><rect y="30" width="206" height="24" fill="#23a6a8"/><text x="28" y="36" class="letter">P</text><text x="62" y="34" class="white">Performance</text><text x="20" y="91" class="body">Mesurer la qualité et</text><text x="20" y="116" class="body">guider l’optimisation.</text><text x="20" y="157" class="body">Débit · latence · charge</text></g>
  <g transform="translate(497 335)" filter="url(#s)"><rect width="206" height="185" rx="18" fill="#fff"/><rect width="206" height="54" rx="18" fill="#f2994a"/><rect y="30" width="206" height="24" fill="#f2994a"/><text x="28" y="36" class="letter">F</text><text x="62" y="34" class="white">Pannes</text><text x="20" y="91" class="body">Détecter, isoler puis</text><text x="20" y="116" class="body">résoudre les défauts.</text><text x="20" y="157" class="body">Alarmes · diagnostic</text></g>
  <g transform="translate(718 335)" filter="url(#s)"><rect width="206" height="185" rx="18" fill="#fff"/><rect width="206" height="54" rx="18" fill="#9b6bb3"/><rect y="30" width="206" height="24" fill="#9b6bb3"/><text x="28" y="36" class="letter">S</text><text x="62" y="34" class="white">Sécurité</text><text x="20" y="91" class="body">Limiter les accès et</text><text x="20" y="116" class="body">protéger le réseau.</text><text x="20" y="157" class="body">AAA · ACL · chiffrement</text></g>
  <g transform="translate(939 335)" filter="url(#s)"><rect width="206" height="185" rx="18" fill="#fff"/><rect width="206" height="54" rx="18" fill="#153f59"/><rect y="30" width="206" height="24" fill="#153f59"/><text x="28" y="36" class="letter">A</text><text x="62" y="34" class="white">Comptabilité</text><text x="20" y="91" class="body">Mesurer l’usage des</text><text x="20" y="116" class="body">ressources réseau.</text><text x="20" y="157" class="body">Statistiques · coûts</text></g>
  <rect x="60" y="570" width="1080" height="38" rx="14" fill="#153f59"/><text x="600" y="595" text-anchor="middle" style="font:700 15px Arial,sans-serif;fill:#fff">Protocoles de gestion : observer, configurer et signaler — à l’échelle du réseau entier</text>
</svg>
