<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Méthodes RESTCONF et équivalents NETCONF</title><desc id="desc">Un client web envoie des méthodes HTTP au serveur RESTCONF. Six cartes expliquent HEAD, GET, POST, PUT, PATCH et DELETE, avec leurs effets sur running.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fcfd"/><stop offset="1" stop-color="#edf7fa"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#102a43" flood-opacity=".14"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#567687"/></marker><style>.title{font:700 30px Arial,sans-serif;fill:#102a43}.sub{font:400 16px Arial,sans-serif;fill:#486581}.h{font:700 18px Arial,sans-serif;fill:#102a43}.body{font:400 13px Arial,sans-serif;fill:#334e68}.small{font:400 12px Arial,sans-serif;fill:#486581}.method{font:700 18px Consolas,monospace;fill:#fff}</style></defs>
  <rect width="1200" height="650" rx="26" fill="url(#bg)"/><text x="60" y="62" class="title">RESTCONF : agir sur les ressources réseau avec HTTP</text><text x="60" y="92" class="sub">Le client et le serveur échangent XML ou JSON ; les écritures s’appliquent directement à running.</text>
  <g filter="url(#s)"><rect x="60" y="130" width="250" height="100" rx="18" fill="#fff" stroke="#b9d7df"/><text x="185" y="168" text-anchor="middle" class="h">Application / NMS</text><text x="185" y="197" text-anchor="middle" class="body">Client RESTCONF</text><rect x="890" y="130" width="250" height="100" rx="18" fill="#fff" stroke="#b9d7df"/><text x="1015" y="168" text-anchor="middle" class="h">Équipement réseau</text><text x="1015" y="197" text-anchor="middle" class="body">Serveur RESTCONF</text></g><path d="M310 180H880" stroke="#567687" stroke-width="4" marker-end="url(#a)"/><text x="595" y="164" text-anchor="middle" class="h">HTTP(S) · requête / réponse</text><text x="595" y="205" text-anchor="middle" class="body">URI de ressource · modèle YANG · XML ou JSON</text>
  <g transform="translate(55 290)" filter="url(#s)"><rect width="170" height="175" rx="18" fill="#fff"/><rect width="170" height="50" rx="18" fill="#153f59"/><rect y="28" width="170" height="22" fill="#153f59"/><text x="85" y="34" text-anchor="middle" class="method">HEAD</text><text x="18" y="84" class="h">Existe ?</text><text x="18" y="112" class="body">Teste la présence</text><text x="18" y="135" class="body">sans corps de réponse.</text><text x="18" y="160" class="small">lecture</text></g>
  <g transform="translate(239 290)" filter="url(#s)"><rect width="170" height="175" rx="18" fill="#fff"/><rect width="170" height="50" rx="18" fill="#4f72c4"/><rect y="28" width="170" height="22" fill="#4f72c4"/><text x="85" y="34" text-anchor="middle" class="method">GET</text><text x="18" y="84" class="h">Lire</text><text x="18" y="112" class="body">Configuration ou</text><text x="18" y="135" class="body">données d’état.</text><text x="18" y="160" class="small">get / get-config</text></g>
  <g transform="translate(423 290)" filter="url(#s)"><rect width="170" height="175" rx="18" fill="#fff"/><rect width="170" height="50" rx="18" fill="#23a6a8"/><rect y="28" width="170" height="22" fill="#23a6a8"/><text x="85" y="34" text-anchor="middle" class="method">POST</text><text x="18" y="84" class="h">Créer</text><text x="18" y="112" class="body">Nouvelle donnée</text><text x="18" y="135" class="body">ou appel RPC.</text><text x="18" y="160" class="small">create</text></g>
  <g transform="translate(607 290)" filter="url(#s)"><rect width="170" height="175" rx="18" fill="#fff"/><rect width="170" height="50" rx="18" fill="#f2994a"/><rect y="28" width="170" height="22" fill="#f2994a"/><text x="85" y="34" text-anchor="middle" class="method">PUT</text><text x="18" y="84" class="h">Remplacer</text><text x="18" y="112" class="body">Réécrit la ressource</text><text x="18" y="135" class="body">ciblée.</text><text x="18" y="160" class="small">replace</text></g>
  <g transform="translate(791 290)" filter="url(#s)"><rect width="170" height="175" rx="18" fill="#fff"/><rect width="170" height="50" rx="18" fill="#9b6bb3"/><rect y="28" width="170" height="22" fill="#9b6bb3"/><text x="85" y="34" text-anchor="middle" class="method">PATCH</text><text x="18" y="84" class="h">Fusionner</text><text x="18" y="112" class="body">Modifie une partie</text><text x="18" y="135" class="body">de la ressource.</text><text x="18" y="160" class="small">merge</text></g>
  <g transform="translate(975 290)" filter="url(#s)"><rect width="170" height="175" rx="18" fill="#fff"/><rect width="170" height="50" rx="18" fill="#c95151"/><rect y="28" width="170" height="22" fill="#c95151"/><text x="85" y="34" text-anchor="middle" class="method">DELETE</text><text x="18" y="84" class="h">Supprimer</text><text x="18" y="112" class="body">Retire la donnée</text><text x="18" y="135" class="body">ciblée.</text><text x="18" y="160" class="small">delete</text></g>
  <rect x="105" y="525" width="990" height="74" rx="18" fill="#153f59"/><text x="600" y="554" text-anchor="middle" style="font:700 16px Arial,sans-serif;fill:#fff">RESTCONF : opérations simples, effet immédiat sur &lt;running/&gt;</text><text x="600" y="580" text-anchor="middle" style="font:400 13px Arial,sans-serif;fill:#d7edf3">NETCONF : plusieurs datastores, verrouillage, commit et rollback selon les capacités</text>
</svg>
