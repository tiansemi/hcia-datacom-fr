<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Arbre de diagnostic des accès filaire et WLAN</title><desc id="desc">Deux branches guident l’accès filaire par adresse IP, VLAN et externe, et l’accès WLAN par AP en ligne, VAP, station, adresse et trafic.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fcfd"/><stop offset="1" stop-color="#edf7fa"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#102a43" flood-opacity=".14"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#567687"/></marker><style>.title{font:700 30px Arial,sans-serif;fill:#102a43}.sub{font:400 16px Arial,sans-serif;fill:#486581}.h{font:700 18px Arial,sans-serif;fill:#102a43}.body{font:400 13px Arial,sans-serif;fill:#334e68}.small{font:400 12px Arial,sans-serif;fill:#486581}.white{font:700 17px Arial,sans-serif;fill:#fff}.step{font:700 14px Arial,sans-serif;fill:#102a43}</style></defs>
  <rect width="1200" height="650" rx="26" fill="url(#bg)"/><text x="60" y="62" class="title">Campus : diagnostiquer dans l’ordre des dépendances</text><text x="60" y="92" class="sub">Ne pas tester l’étape suivante tant que la condition précédente n’est pas démontrée.</text>
  <g transform="translate(55 130)" filter="url(#s)"><rect width="535" height="420" rx="22" fill="#fff"/><rect width="535" height="60" rx="22" fill="#4f72c4"/><rect y="36" width="535" height="24" fill="#4f72c4"/><text x="267" y="40" text-anchor="middle" class="white">Accès filaire</text><g transform="translate(45 95)"><rect width="445" height="56" rx="14" fill="#eef2ff" stroke="#4f72c4"/><text x="222" y="24" text-anchor="middle" class="step">1 · Le terminal obtient-il une adresse IP ?</text><text x="222" y="44" text-anchor="middle" class="small">lien → DHCP → capacité du pool</text><path d="M222 56v33" stroke="#567687" stroke-width="3" marker-end="url(#a)"/><rect y="96" width="445" height="56" rx="14" fill="#e7f9f7" stroke="#23a6a8"/><text x="222" y="120" text-anchor="middle" class="step">2 · Le même VLAN communique-t-il ?</text><text x="222" y="140" text-anchor="middle" class="small">ports up → VLAN → STP → MAC</text><path d="M222 152v33" stroke="#567687" stroke-width="3" marker-end="url(#a)"/><rect y="192" width="445" height="56" rx="14" fill="#fff7ed" stroke="#f2994a"/><text x="222" y="216" text-anchor="middle" class="step">3 · Le voisin direct répond-il au ping ?</text><text x="222" y="236" text-anchor="middle" class="small">IP/VLAN → lien → route → ARP/MAC</text><path d="M222 248v33" stroke="#567687" stroke-width="3" marker-end="url(#a)"/><rect y="288" width="445" height="56" rx="14" fill="#153f59"/><text x="222" y="313" text-anchor="middle" style="font:700 14px Arial,sans-serif;fill:#fff">4 · Accès au réseau externe</text><text x="222" y="333" text-anchor="middle" style="font:400 12px Arial,sans-serif;fill:#d7edf3">route · retour · politique · chemin</text></g></g>
  <g transform="translate(610 130)" filter="url(#s)"><rect width="535" height="420" rx="22" fill="#fff"/><rect width="535" height="60" rx="22" fill="#23a6a8"/><rect y="36" width="535" height="24" fill="#23a6a8"/><text x="267" y="40" text-anchor="middle" class="white">Accès WLAN WAC + Fit AP</text><g transform="translate(45 80)"><rect width="445" height="50" rx="14" fill="#e7f9f7" stroke="#23a6a8"/><text x="222" y="22" text-anchor="middle" class="step">1 · L’AP est-il en état normal ?</text><text x="222" y="40" text-anchor="middle" class="small">IP → CAPWAP → auth → licence</text><path d="M222 50v24" stroke="#567687" stroke-width="3" marker-end="url(#a)"/><rect y="80" width="445" height="50" rx="14" fill="#eef2ff" stroke="#4f72c4"/><text x="222" y="102" text-anchor="middle" class="step">2 · Le VAP est-il ON ?</text><text x="222" y="120" text-anchor="middle" class="small">SSID · sécurité · radio · groupe AP</text><path d="M222 130v24" stroke="#567687" stroke-width="3" marker-end="url(#a)"/><rect y="160" width="445" height="50" rx="14" fill="#fff7ed" stroke="#f2994a"/><text x="222" y="182" text-anchor="middle" class="step">3 · La STA est-elle admise ?</text><text x="222" y="200" text-anchor="middle" class="small">fail record · blacklist · limites · auth</text><path d="M222 210v24" stroke="#567687" stroke-width="3" marker-end="url(#a)"/><rect y="240" width="445" height="50" rx="14" fill="#f7eff9" stroke="#9b6bb3"/><text x="222" y="262" text-anchor="middle" class="step">4 · La STA obtient-elle une IP ?</text><text x="222" y="280" text-anchor="middle" class="small">VLAN service · direct/tunnel · DHCP</text><path d="M222 290v24" stroke="#567687" stroke-width="3" marker-end="url(#a)"/><rect y="320" width="445" height="50" rx="14" fill="#153f59"/><text x="222" y="342" text-anchor="middle" style="font:700 14px Arial,sans-serif;fill:#fff">5 · Les données circulent-elles ?</text><text x="222" y="360" text-anchor="middle" style="font:400 12px Arial,sans-serif;fill:#d7edf3">canal · files · réseau intermédiaire</text></g></g>
  <rect x="60" y="590" width="1080" height="32" rx="14" fill="#153f59"/><text x="600" y="612" text-anchor="middle" style="font:700 14px Arial,sans-serif;fill:#fff">Chaque « non » définit le sous-système à diagnostiquer avant de poursuivre</text>
</svg>
