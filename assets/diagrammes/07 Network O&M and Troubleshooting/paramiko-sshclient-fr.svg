<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Cycle SSHClient et choix du canal Paramiko</title><desc id="desc">Le client charge les clés d’hôte, applique une politique, se connecte, choisit exec_command ou invoke_shell, lit les sorties puis ferme la session.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fcfd"/><stop offset="1" stop-color="#edf7fa"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#102a43" flood-opacity=".14"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#567687"/></marker><style>.title{font:700 30px Arial,sans-serif;fill:#102a43}.sub{font:400 16px Arial,sans-serif;fill:#486581}.h{font:700 18px Arial,sans-serif;fill:#102a43}.body{font:400 13px Arial,sans-serif;fill:#334e68}.small{font:400 12px Arial,sans-serif;fill:#486581}.white{font:700 16px Arial,sans-serif;fill:#fff}.mono{font:600 12px Consolas,monospace;fill:#334e68}</style></defs>
  <rect width="1200" height="650" rx="26" fill="url(#bg)"/><text x="60" y="62" class="title">Paramiko SSHClient : vérifier, connecter, exécuter, fermer</text><text x="60" y="92" class="sub">La clé d’hôte protège l’identité du serveur ; le canal dépend du type de CLI et du nombre de commandes.</text>
  <g transform="translate(55 135)" filter="url(#s)"><rect width="1090" height="135" rx="22" fill="#fff"/><g><circle cx="75" cy="55" r="30" fill="#4f72c4"/><text x="75" y="61" text-anchor="middle" class="white">1</text><text x="75" y="102" text-anchor="middle" class="body">SSHClient</text><path d="M110 55H205" stroke="#567687" stroke-width="4" marker-end="url(#a)"/><circle cx="245" cy="55" r="30" fill="#4f72c4"/><text x="245" y="61" text-anchor="middle" class="white">2</text><text x="245" y="102" text-anchor="middle" class="body">Host keys</text><path d="M280 55H375" stroke="#567687" stroke-width="4" marker-end="url(#a)"/><circle cx="415" cy="55" r="30" fill="#23a6a8"/><text x="415" y="61" text-anchor="middle" class="white">3</text><text x="415" y="102" text-anchor="middle" class="body">Policy</text><path d="M450 55H545" stroke="#567687" stroke-width="4" marker-end="url(#a)"/><circle cx="585" cy="55" r="30" fill="#23a6a8"/><text x="585" y="61" text-anchor="middle" class="white">4</text><text x="585" y="102" text-anchor="middle" class="body">connect()</text><path d="M620 55H715" stroke="#567687" stroke-width="4" marker-end="url(#a)"/><circle cx="755" cy="55" r="30" fill="#f2994a"/><text x="755" y="61" text-anchor="middle" class="white">5</text><text x="755" y="102" text-anchor="middle" class="body">Canal</text><path d="M790 55H885" stroke="#567687" stroke-width="4" marker-end="url(#a)"/><circle cx="925" cy="55" r="30" fill="#153f59"/><text x="925" y="61" text-anchor="middle" class="white">6</text><text x="925" y="102" text-anchor="middle" class="body">close()</text></g></g>
  <g transform="translate(55 310)" filter="url(#s)"><rect width="515" height="235" rx="22" fill="#fff"/><rect width="515" height="55" rx="22" fill="#4f72c4"/><rect y="31" width="515" height="24" fill="#4f72c4"/><text x="257" y="36" text-anchor="middle" class="white">exec_command()</text><text x="28" y="92" class="h">Commande isolée</text><text x="28" y="123" class="body">• canal dédié par commande</text><text x="28" y="151" class="body">• stdin · stdout · stderr</text><text x="28" y="179" class="body">• adapté si le serveur accepte une commande distante</text><rect x="28" y="195" width="459" height="25" rx="12" fill="#eef2ff"/><text x="257" y="212" text-anchor="middle" class="mono">stdin, stdout, stderr = client.exec_command(...)</text></g>
  <g transform="translate(630 310)" filter="url(#s)"><rect width="515" height="235" rx="22" fill="#fff"/><rect width="515" height="55" rx="22" fill="#23a6a8"/><rect y="31" width="515" height="24" fill="#23a6a8"/><text x="257" y="36" text-anchor="middle" class="white">invoke_shell()</text><text x="28" y="92" class="h">CLI interactive persistante</text><text x="28" y="123" class="body">• plusieurs commandes et confirmations</text><text x="28" y="151" class="body">• pagination, prompt, délais et réception partielle</text><text x="28" y="179" class="body">• boucle de lecture bornée par timeout</text><rect x="28" y="195" width="459" height="25" rx="12" fill="#e7f9f7"/><text x="257" y="212" text-anchor="middle" class="mono">channel.send(...) · channel.recv(...)</text></g>
  <rect x="60" y="585" width="1080" height="34" rx="14" fill="#153f59"/><text x="600" y="608" text-anchor="middle" style="font:700 14px Arial,sans-serif;fill:#fff">Production : RejectPolicy + known_hosts · secrets hors du code · timeout · finally: close()</text>
</svg>
